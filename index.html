  <div class="card w">
    <div class="seg" style="margin-bottom:12px">
      <button class="btn ${isOrd?'p':''}" id="rawBtnOrd">Заказы спроса (${nf(O.length)})</button>
      <button class="btn ${!isOrd?'p':''}" id="rawBtnOps">Детализация операций (${nf(Ops.length)})</button>
    </div>
    <div id="rawTbl"></div>
  </div>`;
  setTimeout(()=>{
    $('#rawBtnOrd').onclick=()=>{RAW_VIEW='orders';render()};
    $('#rawBtnOps').onclick=()=>{RAW_VIEW='ops';render()};
    dtable('#rawTbl',isOrd?ordCols:opsCols,isOrd?O:Ops,{
      key:isOrd?'raw_orders':'raw_ops',
      sort:isOrd?'id':'o',dir:'asc',h:540,pg:50,csv:1,name:'SOP_'+RAW_VIEW});
  },0);
  return html+summary('Справка по данным',[
    {t:'Работа с таблицей',i:[
      'Клик по <b>заголовку столбца</b> — сортировка по возрастанию или убыванию.',
      'Значок <b>▾</b> в заголовке — мультивыбор значений: чекбоксы, поиск внутри списка, выбор и снятие всех.',
      'Поле <b>«Поиск по таблице»</b> фильтрует строки по всем столбцам одновременно. Активные фильтры показаны чипами и снимаются кликом.',
      'Кнопка <b>«Экспорт CSV»</b> выгружает текущую отфильтрованную и отсортированную выборку целиком, а не только видимую страницу.'
    ]}
  ]);
}

/* ═════════ 14.0b. БЛОК: МОЩНОСТИ ═══════════ */
function tabCAPS(){
  const cap=DS.capacity||[], plan=DS.capacityPlan||[];
  const agg=DS.agg||{}, t=agg.totals||{};
  /* ── Деградация: нет capacity_view_sp и rescapacity — показываем машино-часы из операций ── */
  if(!cap.length && !plan.length){
    const O=fOps().filter(r=>r.type==='production'&&r.rc>0);
    if(!O.length) return '<div class="empty"><h2>Данных о мощностях нет</h2><p>Таблицы <code>capacity_view_sp</code> и <code>rescapacity</code> не загружены, машино-часы в операциях отсутствуют.</p></div>';
    const byRs=grp(O,r=>r.rs||r.pl,v=>({rc:S(v,r=>r.rc),v:S(v,r=>r.v),pl:v[0].pl})).sort((a,b)=>b.rc-a.rc);
    const K=[['Ресурсов с потреблением',nf(byRs.length),'машино-часы из операций','mid'],
      ['Потреблено часов',nf(S(byRs,r=>r.rc)),'доступный фонд не задан — утилизация не считается','mid'],
      ['Объём передела',nf(S(O,r=>r.v))+' т','производственные операции','']];
    const html=`
    <div class="dq w" style="margin-bottom:14px"><span class="tag">Источник</span>
      <div class="m">Таблицы мощностей не загружены — показаны потреблённые машино-часы из <code>marking_demand</code>. Загрузите <code>capacity_view_sp</code>, чтобы открыть утилизацию и узкие места.</div></div>
    <div class="kpis">${K.map(k=>`<div class="kpi"><div class="t">${k[0]}</div><div class="v ${k[3]}">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
    <div class="grid">
      <div class="card"><h3>Топ ресурсов по машино-часам</h3><canvas id="cs1"></canvas></div>
      <div class="card w"><h3>Нагрузка ресурсов (без лимитов)</h3><div id="cs5"></div></div>
    </div>`;
    setTimeout(()=>{
      chH('#cs1',H('#cs1',260,0.52),byRs.slice(0,9).map((r,i)=>({k:(r.pl||'—')+' · '+r.k,v:r.rc,c:PAL[i%PAL.length],
        tip:`<b>${r.k}</b><br>Площадка: ${r.pl||'—'}<br>Машино-часы: ${nf(r.rc)}<br>Объём: ${nf(r.v)} т`})),
        v=>nf(v)+' ч',null);
      dtable('#cs5',[
        {k:'k',t:'Ресурс',left:1,flt:1},   /* grp() кладёт ключ группировки в поле k, не rs */
        {k:'pl',t:'Площадка',left:1,flt:1},
        {k:'rc',t:'Машино-часы',num:1,f:v=>nf(v,1)},
        {k:'v',t:'Объём, т',num:1,f:v=>nf(v,1)},
        {k:'rph',t:'Часов на тонну',num:1,v:r=>r.rc/Math.max(r.v,1),f:v=>nf(v,3)}
      ],byRs,{key:'caps_hours',sort:'rc',dir:'desc',h:320,csv:1,name:'capacity_hours'});
    },0);
    return html+summary('Резюме: мощности',[{t:'Ограничение анализа',i:[
      'Без capacity_view_sp узкие места не выявляются. Загрузите таблицу мощностей — это откроет баланс «доступно / загружено / свободно», ремонты и план ФРВ (rescapacity).']}]);
  }
  const avail=S(cap,c=>c.avail), load=S(cap,c=>c.load), maint=S(cap,c=>c.maint||0);
  const free=Math.max(0,avail-load), util=avail?load/avail:0;
  const bnL=cap.filter(c=>c.isBottleneck), critL=cap.filter(c=>c.isCrit);
  const planAvail=S(plan,c=>c.avail)||num(t.planAvail);
  const expansion=S(plan,c=>c.expansion||0)||num(t.expansion);
  const byPer=grp(cap,c=>c.periodKey||'—',v=>({avail:S(v,c=>c.avail),load:S(v,c=>c.load)}))
    .sort((a,b)=>String(a.k).localeCompare(String(b.k),'ru',{numeric:true}));
  const byPl=grp(cap,c=>c.pl,v=>({avail:S(v,c=>c.avail),load:S(v,c=>c.load),bn:v.filter(x=>x.isBottleneck).length}))
    .sort((a,b)=>b.load-a.load);
  const planByRs=new Map(); plan.forEach(p=>planByRs.set(p.rs,(planByRs.get(p.rs)||0)+(p.avail||0)));
  const joinRs=[...new Set([...cap.map(c=>c.rs),...plan.map(p=>p.rs)])].map(rs=>{
    const f=cap.filter(c=>c.rs===rs), pa=planByRs.get(rs)||0, fa=S(f,c=>c.avail);
    return {rs,pl:(f[0]||plan.find(p=>p.rs===rs)||{}).pl||'—',plan:pa,fact:fa,
      tip:`<b>${rs}</b><br>План ФРВ (rescapacity): ${nf(pa)} ч<br>Факт доступно (capacity_view_sp): ${nf(fa)} ч<br>Расхождение: ${nf(fa-pa)} ч`};
  }).filter(x=>x.plan>0||x.fact>0).sort((a,b)=>b.fact-a.fact).slice(0,10);
  const K=[
    ['Доступный фонд',nf(avail)+' ч',cap.length+' '+plural(cap.length,['ресурс-период','ресурс-периода','ресурс-периодов']),''],
    ['План загрузки',nf(load)+' ч',pc(util)+' фонда',util>=.95?'neg':util>=.85?'mid':'pos'],
    ['Средняя утилизация',pc(util),bnL.length?'узких мест: '+nf(bnL.length):'перегруза нет',util>=.9?'neg':util>=.75?'mid':'pos'],
    ['Перегружены (100%+)',nf(critL.length)+' '+plural(critL.length,['ресурс','ресурса','ресурсов']),critL.slice(0,2).map(c=>c.rsName).join(', ')||'—',critL.length?'neg':'pos'],
    ['Свободный резерв',nf(free)+' ч',pc(util?1-util:0)+' фонда не занято',free?'pos':'neg'],
    ['Ремонты и простои',nf(maint)+' ч',pc(maint/Math.max(avail,1))+' фонда',maint/avail>.15?'mid':''],
    ['План ФРВ (rescapacity)',planAvail?nf(planAvail)+' ч':'—',expansion?nf(expansion)+' ч расширения':'плановые мощности не загружены',planAvail?'':'mid'],
    ['Расхождение план/факт',planAvail?pc(planAvail?Math.abs(avail-planAvail)/planAvail:0):'—',planAvail?(avail>=planAvail?'факт ≥ плана':'фонд меньше плана'):'нужен rescapacity',planAvail&&Math.abs(avail-planAvail)/planAvail>.1?'mid':'pos']
  ];
  const html=`
  <div class="kpis">${K.map(k=>`<div class="kpi"><div class="t">${k[0]}</div><div class="v ${k[3]}">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
  <div class="grid">
    <div class="card"><h3>Топ ресурсов по утилизации</h3><div class="sub">Загрузка от доступного фонда. Клик — фильтр по заводу</div><canvas id="cs1"></canvas></div>
    <div class="card"><h3>Фонд и загрузка по периодам</h3><div class="sub">Доступно против плана загрузки, часы</div>
      ${lg('#cs2',[[CH.d1,'Доступно'],[CH.warn,'Загрузка']])}<canvas id="cs2"></canvas></div>
    <div class="card"><h3>Структура фонда мощности</h3><div class="sub">Загрузка, ремонты и свободный резерв</div><canvas id="cs3"></canvas></div>
    <div class="card"><h3>${plan.length?'План ФРВ против факта по ресурсам':'Загрузка по площадкам'}</h3>
      <div class="sub">${plan.length?'Синяя точка — план (rescapacity), вторая — факт (capacity_view_sp)':'Часы по площадкам, топ-8'}</div>
      ${plan.length?'':lg('#cs4',[[CH.d1,'Доступно'],[CH.warn,'Загрузка']])}<canvas id="cs4"></canvas></div>
    <div class="card w"><h3>Реестр мощностей и узких мест</h3><div class="sub">capacity_view_sp по ресурсам и периодам. Сортировка и мультифильтры</div><div id="cs5"></div></div>
  </div>`;
  setTimeout(()=>{
    /* cap может быть пустым, если загрузился только rescapacity: chH требует массив,
       иначе items.map падает и весь блок остаётся пустым */
    const capTop=cap.slice().sort((a,b)=>b.util-a.util).slice(0,10);
    if(capTop.length)
      chH('#cs1',H('#cs1',280,0.52),capTop.map(c=>({
        k:(c.pl||'—')+' · '+(c.rsName||c.rs),v:c.util*100,
        c:c.util>=1?CH.err:c.util>=.9?CH.warn:c.util>=.5?CH.ok:CH.dim,pl:c.pl,
        tip:`<b>${c.rsName||c.rs}</b><br>Площадка: ${c.pl||'—'}<br>Период: ${c.periodKey||'—'}<br>Доступно: ${nf(c.avail)} ч<br>Загрузка: <b>${nf(c.load)} ч</b> (${pc(c.util)})<br>Свободно: ${nf(c.free)} ч`})),
        v=>nf(v,1)+'%',it=>setF('pl',it.k.split(' · ')[0]));
    else{const g=cv('#cs1',200);if(g){g.x.fillStyle=CH.axis;g.x.textAlign='center';g.x.font='13px '+FNT;
      g.x.fillText('capacity_view_sp не загружен — показан только план ФРВ',g.w/2,100)}}
    if(byPer.length)
      chBars('#cs2',H('#cs2',260,0.45),byPer.map(p=>String(p.k).slice(0,10)),
        [{c:CH.d1,v:byPer.map(p=>p.avail)},{c:CH.warn,v:byPer.map(p=>p.load)}],
        v=>nf(v/1000,0)+'k ч',
        i=>`<b>${byPer[i].k}</b><br>Доступно: ${nf(byPer[i].avail)} ч<br>Загрузка: ${nf(byPer[i].load)} ч<br>Утилизация: ${pc(byPer[i].avail?byPer[i].load/byPer[i].avail:0)}`,null);
    else{const g=cv('#cs2',200);if(g){g.x.fillStyle=CH.axis;g.x.textAlign='center';g.x.font='13px '+FNT;
      g.x.fillText('Нет данных по периодам мощностей',g.w/2,100)}}
    chDonut('#cs3',H('#cs3',240,0.55),[
      {k:'План загрузки',v:load,c:CH.d1},
      {k:'Ремонты и простои',v:maint,c:CH.warn},
      {k:'Свободный резерв',v:Math.max(0,avail-load-maint),c:CH.dim}
    ].filter(p=>p.v>0),'Фонд, ч',v=>nf(v,0)+' ч',null);
    if(plan.length)
      chDumbbell('#cs4',H('#cs4',270,0.55),joinRs.map(x=>({k:String(x.rs).slice(0,18),a:x.plan,b:x.fact,tip:x.tip})),
        v=>nf(v/1000,0)+'k ч',null);
    else
      chBars('#cs4',H('#cs4',260,0.45),byPl.slice(0,8).map(p=>p.k),
        [{c:CH.d1,v:byPl.slice(0,8).map(p=>p.avail)},{c:CH.warn,v:byPl.slice(0,8).map(p=>p.load)}],
        v=>nf(v/1000,0)+'k ч',
        i=>`<b>${byPl[i].k}</b><br>Доступно: ${nf(byPl[i].avail)} ч<br>Загрузка: ${nf(byPl[i].load)} ч<br>Узких мест: ${byPl[i].bn}`,null,1);
    dtable('#cs5',[
      {k:'pl',t:'Площадка',left:1,flt:1},
      {k:'rsName',t:'Ресурс',left:1,flt:1},
      {k:'resType',t:'Вид ресурса',left:1,flt:1},
      {k:'periodKey',t:'Период',left:1,flt:1},
      {k:'norm',t:'Норматив, ч',num:1,f:v=>nf(v)},
      {k:'avail',t:'Доступно, ч',num:1,f:v=>nf(v)},
      {k:'load',t:'Загрузка, ч',num:1,f:v=>nf(v)},
      {k:'free',t:'Свободно, ч',num:1,f:v=>nf(v),cls:v=>v<=0?'neg':'pos'},
      {k:'maint',t:'Ремонты, ч',num:1,f:v=>nf(v)},
      {k:'util',t:'Загрузка %',num:1,f:v=>pc(v),cls:v=>v>=1?'neg':v>=.9?'mid':'pos'}
    ],cap,{key:'caps_registry',sort:'util',dir:'desc',h:350,csv:1,name:'capacity_registry'});
  },0);
  return html+summary('Резюме: мощности',[
    {t:'Выводы',i:[
      `Средняя утилизация фонда — <span class="h">${pc(util)}</span>: загружено ${nf(load)} ч из ${nf(avail)} ч доступных.`,
      bnL.length?`Узких мест (≥90%): <span class="h">${nf(bnL.length)}</span>, из них ${critL.length} перегружены на 100%+ — объём физически не размещается без расшивки.`:`Перегруженных ресурсов нет — план размещается в фонд.`,
      maint?`Ремонты и простои занимают <span class="h">${nf(maint)} ч</span> (${pc(maint/Math.max(avail,1))} фонда).`:`Ремонты в данных не выделены.`,
      planAvail?`Расхождение плана ФРВ (rescapacity) и факта — <span class="h">${pc(planAvail?Math.abs(avail-planAvail)/planAvail:0)}</span>: при отклонении свыше 10% проверить вход прогона.`:`Плановые мощности (rescapacity) не загружены — «план vs факт» недоступен.`]},
    {t:'Рекомендации',i:[
      critL.length?`Расшить перегруженные ресурсы: ${critL.slice(0,3).map(c=>c.rsName||c.rs).join(', ')} — перенос объёма на альтернативные мощности или сверхурочные.`:`Резерв фонда позволяет принять дополнительный спрос — проверьте упущенную маржу во вкладке «Покрытие спроса».`,
      `Сверять план ФРВ с фактом по каждому прогону: расхождение — признак устаревшего rescapacity.`,
      `Держать узкие места под контролем до согласования плана: загрузка ≥90% — кандидат на инвестиции или изменение маршрута.`]}]);
}

/* ═══════════ 14.0c. БЛОК: ЭКОНОМИКА ОТКАЗОВ ═════════ */
function tabCOST(){
  const agg=DS.agg||{}, t=agg.totals||{};
  const pen=DS.penalty||[], penFlat=DS.penaltyFlat||[];
  const D=fOrders();
  const hasRates=pen.length>0||penFlat.length>0;
  const lm=num(t.lm)||S(D,o=>o.unm*o.mpt);
  const penNonDel=num(t.penaltyNonDel)||0, penLate=num(t.penaltyLate)||0;
  const mar=num(t.mar)||S(D,o=>o.mar);
  const defOrd=D.filter(o=>o.unm>0);
  if(!hasRates && !defOrd.length)
    return '<div class="empty"><h2>Экономика отказов неприменима</h2><p>Таблицы <code>demand_cost</code>/<code>demand_cost_ti</code> не загружены, а дефицитов в плане нет.</p></div>';
  const rateSrc=pen.length?pen:penFlat;
  const rates=rateSrc.slice().sort((a,b)=>(b.nonDel||0)-(a.nonDel||0)).slice(0,9);
  const prLm=grp(defOrd,o=>o.prod,v=>({lm:S(v,o=>o.unm*o.mpt),unm:S(v,o=>o.unm)}))
    .sort((a,b)=>b.lm-a.lm);
  const K=[
    ['Упущенная маржа',bn(lm),'неудовлетворённый спрос × маржа/т','neg'],
    ['Штраф за непоставку',hasRates?bn(penNonDel):'нет ставок',hasRates?'ставка × дефицитный объём':'справочник demand_cost не загружен',hasRates&&penNonDel?'neg':'mid'],
    ['Штраф за опоздание',hasRates?bn(penLate):'нет ставок',hasRates?'поздние отгрузки × ставка × периоды':'',hasRates&&penLate?'mid':''],
    ['Суммарные потери',bn(lm+penNonDel+penLate),mar?pc((lm+penNonDel+penLate)/mar)+' валовой маржи':'','neg'],
    ['Штрафы к упущенной марже',lm?pc((penNonDel+penLate)/lm):'—','во сколько раз штраф ниже ценности спроса',''],
    ['Заказов с дефицитом',nf(defOrd.length)+' из '+D.length,pc(D.length?defOrd.length/D.length:0)+' портфеля',''],
    ['Записей в справочнике ставок',nf(pen.length+penFlat.length),pen.length?'периодные перекрывают безпериодные':'только безпериодные (demand_cost_ti)',hasRates?'':'mid'],
    ['Средняя ставка непоставки',hasRates?nf(S(rateSrc,r=>r.nonDel||0)/Math.max(rateSrc.length,1))+' ₽/т':'—','средняя по справочнику','']
  ];
  const html=`
  <div class="dq ${hasRates?'i':'w'}" style="margin-bottom:14px"><span class="tag">Источник</span>
    <div class="m">${hasRates
      ?`Ставки: <code>${pen.length?'demand_cost (периодные)':'demand_cost_ti (безпериодные)'}</code>. Штрафы считаны как ставка × неудовлетворённый объём${pen.length&&penFlat.length?' (периодные ставки перекрывают безпериодные)':''}.`
      :'Таблицы ставок не загружены — показана только упущенная маржа из заказов.'}</div></div>
  <div class="kpis">${K.map(k=>`<div class="kpi"><div class="t">${k[0]}</div><div class="v ${k[3]}">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
  <div class="grid">
    <div class="card"><h3>Структура потерь: маржа против штрафов</h3><div class="sub">Из чего складывается цена отказа</div><canvas id="ct1"></canvas></div>
    <div class="card"><h3>Топ продуктов по упущенной марже</h3><div class="sub">Клик — фильтр по продукту</div><canvas id="ct2"></canvas></div>
    <div class="card"><h3>Топ ставок штрафа за непоставку</h3><div class="sub">Товар × локация, ₽ за тонну дефицита</div><canvas id="ct3"></canvas></div>
    <div class="card"><h3>Парето заказов по упущенной марже</h3><div class="sub">Тёмные столбцы формируют 80% потерь</div><canvas id="ct4"></canvas></div>
    <div class="card w"><h3>Справочник ставок отказов</h3><div class="sub">Сортировка и мультифильтры по товару, локации и потоку</div><div id="ct5"></div></div>
  </div>`;
  setTimeout(()=>{
    chBars('#ct1',H('#ct1',260,0.45),
      ['Упущенная маржа','Штраф: непоставка','Штраф: опоздание'],
      [{c:CH.d5,v:[lm,penNonDel,penLate]}],v=>bn(v),
      i=>`<b>${['Упущенная маржа','Штраф за непоставку','Штраф за опоздание'][i]}</b><br>${bn([lm,penNonDel,penLate][i])}`,null,1,1);
    if(prLm.length)
      chH('#ct2',H('#ct2',270,0.52),prLm.slice(0,9).map((p,i)=>({k:p.k,v:p.lm,c:PAL[i%PAL.length],
        tip:`<b>${p.k}</b><br>Упущенная маржа: ${bn(p.lm)}<br>Дефицит: ${nf(p.unm)} т`})),bn,it=>setF('pr',it.k));
    else{const g=cv('#ct2',200);if(g){g.x.fillStyle=CH.axis;g.x.textAlign='center';g.x.font='13px '+FNT;
      g.x.fillText('Дефицитов под текущими фильтрами нет',g.w/2,100)}}
    if(rates.length)
      chH('#ct3',H('#ct3',270,0.52),rates.map(r=>({k:[r.item,r.loc].filter(Boolean).join(' · ')||'—',
        v:r.nonDel||0,c:CH.d4,
        tip:`<b>${r.item||'—'} @ ${r.loc||'—'}</b><br>Поток: ${r.stream||'—'}<br>Ставка непоставки: ${nf(r.nonDel)} ₽/т<br>Ставка опоздания: ${nf(r.lateRate)} ₽/т × ${nf(r.latePeriods)} пер.`})),
        v=>nf(v)+' ₽/т',null);
    else{const g=cv('#ct3',200);if(g){g.x.fillStyle=CH.axis;g.x.textAlign='center';g.x.font='13px '+FNT;

    if(defOrd.length)

let SELECTED_ORDER_ID=null;

function drawBox(x,bx,by,bw,bh,r){
  if(x.roundRect){x.beginPath();x.roundRect(bx,by,bw,bh,r)}
  else{x.beginPath();x.moveTo(bx+r,by);x.lineTo(bx+bw-r,by);
    x.quadraticCurveTo(bx+bw,by,bx+bw,by+r);x.lineTo(bx+bw,by+bh-r);
    x.quadraticCurveTo(bx+bw,by+bh,bx+bw-r,by+bh);x.lineTo(bx+r,by+bh);
    x.quadraticCurveTo(bx,by+bh,bx,by+bh-r);x.lineTo(bx,by+r);
    x.quadraticCurveTo(bx,by,bx+r,by);x.closePath()}
}
function getLineage(focusedKey,edges){
  if(!focusedKey)return null;
  const upN=new Set([focusedKey]),upE=new Set();let ch=true;
  while(ch){ch=false;edges.forEach((e,i)=>{const s=e.from._key||e.from.id,d=e.to._key||e.to.id;
    if(upN.has(d)&&!upN.has(s)){upN.add(s);upE.add(i);ch=true}})}
  const dnN=new Set([focusedKey]),dnE=new Set();ch=true;
  while(ch){ch=false;edges.forEach((e,i)=>{const s=e.from._key||e.from.id,d=e.to._key||e.to.id;
    if(dnN.has(s)&&!dnN.has(d)){dnN.add(d);dnE.add(i);ch=true}})}
  return {activeNodes:new Set([...upN,...dnN]),activeEdgeIdxs:new Set([...upE,...dnE])};
}
function optimizeEdges(rawEdges){
  const m=new Map();
  rawEdges.forEach(e=>{const k=(e.from._key||e.from.id)+'->'+(e.to._key||e.to.id);if(!m.has(k))m.set(k,e)});
  let edges=[...m.values()];
  const adj=new Map();
  edges.forEach(e=>{const u=e.from._key||e.from.id,v=e.to._key||e.to.id;
    if(!adj.has(u))adj.set(u,new Set());adj.get(u).add(v)});
  return edges.filter(e=>{const u=e.from._key||e.from.id,v=e.to._key||e.to.id;
    for(const w of (adj.get(u)||new Set())){if(w!==v&&(adj.get(w)||new Set()).has(v))return false}
    return true});
}
function drawTreeEdges(x,edges,lineage,isCost){
  edges.forEach((e,idx)=>{
    const hl=lineage?lineage.activeEdgeIdxs.has(idx):false;
    const dim=lineage?!hl:false;
    const sx=e.from.x,sy=e.from.y+e.from.h/2,ex=e.to.x+e.to.w,ey=e.to.y+e.to.h/2;
    const dx=Math.max(Math.abs(sx-ex)*.48,28);
    const isFinal=(e.to.oid==='A'||e.to._key==='ROOT'||e.to._key==='SW_ROOT'||e.to.tm==='LASTMILE');
    x.beginPath();x.moveTo(sx,sy);x.bezierCurveTo(sx-dx,sy,ex+dx,ey,ex,ey);
    if(hl){x.strokeStyle=CH.brand;x.lineWidth=2.2;x.setLineDash([])}
    else if(dim){x.strokeStyle=CH.dim;x.lineWidth=1;x.setLineDash([])}
    else if(isFinal){x.strokeStyle=rgba(isCost?CH.d3:CH.d1,.75);x.lineWidth=1.8;x.setLineDash([])}
    else{x.strokeStyle=rgba(CH.d2,.55);x.lineWidth=1.2;x.setLineDash([4,3])}
    x.stroke();x.setLineDash([]);
    const aL=hl?7:5,aW=hl?3.5:2.5;
    x.fillStyle=hl?CH.brand:(dim?CH.dim:(isFinal?(isCost?CH.d3:CH.d1):CH.d2));
    x.beginPath();x.moveTo(ex,ey);x.lineTo(ex+aL,ey-aW);x.lineTo(ex+aL-1.2,ey);x.lineTo(ex+aL,ey+aW);
    x.closePath();x.fill();
    const hasVal=isCost?(e.cost>0):(e.vol>0);
    if((isFinal||hl||e.from._isGroup)&&!dim&&hasVal){
      const mx=(sx+ex)/2,my=(sy+ey)/2-12;
      const txt=isCost?(e.cost>=1e6?mln(e.cost):nf(Math.round(e.cost))+' ₽'):(nf(e.vol,e.vol<10?2:1)+' т');
      x.font='600 9.5px '+FNT;const tw=x.measureText(txt).width+10;
      x.fillStyle=CH.surf;drawBox(x,mx-tw/2,my-7.5,tw,15,3);x.fill();
      x.strokeStyle=hl?CH.brand:CH.line;x.lineWidth=1;x.stroke();
      x.fillStyle=hl?CH.brand:CH.lab;x.textAlign='center';x.textBaseline='middle';x.fillText(txt,mx,my);
    }
  });
}
function drawTreeNodes(c,x,nodes,lineage,isCost){
  nodes.forEach(n=>{
    const key=n._key||n.id;
    const focus=(TREE_FOCUSED_KEY===key);
    const part=lineage?lineage.activeNodes.has(key):false;
    const dim=lineage?!part:false;
    const col=n.color||CH.d1;

    // Определение наличия узкого места или блокировки для данного узла цепочки
    let bnInfo = null;
    if(DS && DS.hasCap && DS.capacity){
      const matchCap = DS.capacity.find(cap => 
        (n.rs && cap.rs.toLowerCase() === n.rs.toLowerCase()) ||
        (n.pl && cap.pl && cap.pl.toLowerCase() === n.pl.toLowerCase() && (cap.isBottleneck || cap.isBlocked)) ||
        (n.vd && cap.locFr && cap.locFr.toLowerCase() === n.vd.toLowerCase() && (cap.isBottleneck || cap.isBlocked))
      );
      if(matchCap && (matchCap.isBottleneck || matchCap.isBlocked)){
        bnInfo = {
          isBlocked: matchCap.isBlocked,
          util: matchCap.util,
          rsName: matchCap.rsName,
          rs: matchCap.rs
        };
      }
    }

    x.fillStyle=dim?CH.pane:(bnInfo && bnInfo.isBlocked ? rgba(CH.err,0.06) : CH.surf);
    drawBox(x,n.x,n.y,n.w,n.h,4);x.fill();
    
    if(focus){x.strokeStyle=CH.brand;x.lineWidth=2.5}
    else if(bnInfo && bnInfo.isBlocked){x.strokeStyle=CH.err;x.lineWidth=1.8}
    else if(bnInfo && bnInfo.util>=0.90){x.strokeStyle=CH.warn;x.lineWidth=1.5}
    else if(part){x.strokeStyle=CH.accent;x.lineWidth=1.8}
    else{x.strokeStyle=dim?CH.dim:CH.line;x.lineWidth=1}
    x.stroke();

    x.fillStyle=dim?CH.dim:(bnInfo && bnInfo.isBlocked ? CH.err : col);
    x.fillRect(n.x,n.y+3,3.5,n.h-6);

    const title=n.title||'Узел';
    const sub=n.sub||(isCost?mln(n.cost||0):`${nf(n.v,1)} т`);
    
    if(n._inline){
      x.textBaseline='middle';const my=n.y+n.h/2;
      x.fillStyle=dim?CH.dimTxt:CH.txt;x.font='600 10px '+FNT;x.textAlign='left';
      x.fillText(title.length>13?title.slice(0,12)+'…':title,n.x+9,my);
      x.fillStyle=dim?CH.dimTxt:(isCost?CH.d3:CH.sub);x.font='600 9.5px '+FNT;x.textAlign='right';
      x.fillText(sub,n.x+n.w-7,my);
    }else{
      x.fillStyle=dim?CH.dimTxt:CH.txt;x.font='600 10.5px '+FNT;x.textAlign='left';x.textBaseline='top';
      const maxTitleChars = bnInfo ? 11 : 16;
      x.fillText(title.length>maxTitleChars?title.slice(0,maxTitleChars-1)+'…':title,n.x+9,n.y+5);
      x.fillStyle=dim?CH.dimTxt:(isCost?CH.d3:CH.sub);x.font=(isCost?'600 ':'')+'9.5px '+FNT;
      x.fillText(sub.length>20?sub.slice(0,19)+'…':sub,n.x+9,n.y+19);
    }

    // Отрисовка интерактивного индикатора узкого места (Bottleneck Badge)
    if(bnInfo && !dim){
      const badgeW = bnInfo.isBlocked ? 28 : 34;
      const badgeH = 14;
      const bx = n.x + n.w - badgeW - 4;
      const by = n.y + 4;
      const bColor = bnInfo.isBlocked ? CH.err : (bnInfo.util >= 0.95 ? CH.err : CH.warn);

      drawBox(x, bx, by, badgeW, badgeH, 3);
      x.fillStyle = bColor;
      x.fill();

      x.fillStyle = '#ffffff';
      x.font = '700 8.5px ' + FNT;
      x.textAlign = 'center';
      x.textBaseline = 'middle';
      x.fillText(bnInfo.isBlocked ? '⛔ 0' : pc(bnInfo.util), bx + badgeW / 2, by + badgeH / 2 + 0.5);
    }

    let fullTip = n.tip || `<b>${title}</b>`;
    if(bnInfo){
      fullTip += `<br><span style="color:${bnInfo.isBlocked ? 'var(--scp-err)' : 'var(--scp-warn)'};font-weight:700">`
        + `${bnInfo.isBlocked ? '⛔ Ограничение/Блокировка маршрута (const=0)' : `🛑 Узкое место мощности (${pc(bnInfo.util)})`}`
        + `</span><br>Ресурс: <b>${bnInfo.rsName}</b>`
        + `<br><span style="color:var(--scp-accent)">Клик: сфокусировать и открыть мощности цехов</span>`;
    }

    reg(c,n.x,n.y,n.w,n.h,fullTip,()=>{
      if(bnInfo){
        TREE_FOCUSED_KEY = bnInfo.rs;
        TREE_VIEW_MODE = 'prod_res';
      } else {
        TREE_FOCUSED_KEY=(TREE_FOCUSED_KEY===key)?null:key;
      }
      render();
    });
  });
}
function drawCostColumnTotals(x,h,colsMeta,totalCost){

function drawModeStages(g,ops,ord){

function drawModeBOMTree(g,ops,ord){
  let activeOps=(TREE_OP_TYPE_FILTER==='all')?ops:ops.filter(o=>o.type===TREE_OP_TYPE_FILTER);
  const isCost=(TREE_METRIC_MODE==='cost');
  const pct=Math.max(0,BOM_AGG_THRESHOLD_PCT);
  const thrVal=(isCost?ord.cost:ord.sal)*(pct/100);
  if(pct<=0||TREE_OP_TYPE_FILTER!=='all'){chSupplyTreeStandard(g,activeOps,ord);return}

    if(!isRoot&&val<=thrVal){

      if(!micro.has(pref))micro.set(pref,[]);micro.get(pref).push(o);

      _isGroup:true,_groupItems:list})});

function chSupplyTreeStandard(g,ops,ord){
  const {c,x,w,h}=g;
  const p={l:26,r:26,t:50,b:26};
  const isCost=(TREE_METRIC_MODE==='cost');
  const T_COLOR={production:CH.d3,movement:CH.d1,procurement:CH.d4,stock:CH.d6};
  if(!ops.length){x.fillStyle=CH.axis;x.textAlign='center';x.font='13px '+FNT;
    x.fillText('Нет операций выбранного типа для этого заказа',w/2,h/2);bind(c);return}
  const byOid=new Map();
  ops.forEach(o=>{const k=o.oid||('GEN_'+(o.dp||1)+'_'+(o.pr||o.tm));
    if(!byOid.has(k))byOid.set(k,{...o,_key:k})});
  byOid.forEach(node=>{
    let pk=null;
    if(node.oid){
      if(node.type==='procurement'&&node.oid.endsWith('.B')){
        const mo=node.oid.slice(0,-2)+'.A';if(byOid.has(mo))pk=mo}
      if(!pk&&node.type==='production'){
        const mm=[...byOid.values()].find(o=>o.type==='movement'&&o.fr===node.pl&&o.pr===node.pr&&o.oid!==node.oid);
        if(mm)pk=mm._key}
      if(!pk){const parts=node.oid.split('.');
        for(let l=parts.length-1;l>=1;l--){const cand=parts.slice(0,l).join('.');
          if(byOid.has(cand)){pk=cand;break}}}
      if(!pk&&node.oid!=='A'&&byOid.has('A'))pk='A';
    }
    node._parentKey=pk});
  const depths=[...new Set([...byOid.values()].map(o=>o.dp||(o.oid?o.oid.split('.').length:1)))].sort((a,b)=>a-b);
  const numCols=Math.max(depths.length,1);
  const colW=(w-p.l-p.r)/numCols,nodeW=Math.min(colW*.78,152),nodeH=36,availH=h-p.t-p.b;
  const nodes=[];

    const stepY=availH/Math.max(colNodes.length,1);
    colNodes.forEach((node,ri)=>{
      node.x=p.l+ci*colW+(colW-nodeW)/2;node.y=p.t+ri*stepY+(stepY-nodeH)/2;
      node.w=nodeW;node.h=nodeH;node._col=ci+1;node.title=node.pr||node.tm;
      const isRoot=(node.oid==='A'||node._col===1);
      if(isCost){
        if(isRoot){node.sub=`Полная с/с: ${mln(ord.cost)}`;node.color=CH.d3}
        else{node.sub=(node.cost>0)?`${mln(node.cost)} (${pc(node.cost/ord.cost)})`:'0 ₽';
          node.color=T_COLOR[node.type]||CH.d1}
      }else{
        node.sub=node.pl||node.vd||(node.fr?`${node.fr} → ${node.to}`:`${nf(node.v,1)} т`);
        node.color=T_COLOR[node.type]||CH.d1}
      node.tip=`<b>${node.type} · уровень ${node._col}</b>`
        +(node.oid?`<br>ID в BOM: <code>${node.oid}</code>`:'')
        +`<br>Материал: ${node.pr||'—'}`
        +`<br>Объём операции: ${nf(node.v,2)} т (${pc(node.v/ord.sal)} от заказа)`
        +(isRoot?`<br>Полная себестоимость заказа: <b>${mln(ord.cost)} ₽</b>`
          :`<br>Затраты статьи: <b>${node.cost?mln(node.cost)+' ₽':'0 ₽'}</b> (${pc((node.cost||0)/ord.cost)} от с/с)`)
        +(node.pl?`<br>Площадка: ${node.pl}`:'')
        +(node.rs?`<br>Ресурс: ${node.rs}`:'')
        +(node.fr?`<br>Маршрут: ${node.fr} → ${node.to} (${node.tm||'плечо'})`:'')
        +(node.vd?`<br>Поставщик: ${node.vd}`:'')
        +(node.rt?`<br>Рецепт: ${node.rt}`:'')
        +`<br>Тариф: ${node.stub?'0 ₽ (заглушка)':nf(node.r)+' ₽/т'}`
        +(node.rc?`<br>Машино-часы: ${nf(node.rc,2)} ч`:'');
      nodes.push(node)})});
  const nodeMap=new Map(nodes.map(n=>[n._key,n]));
  const rawEdges=[];
  nodes.forEach(n=>{if(n._parentKey&&nodeMap.has(n._parentKey))
    rawEdges.push({from:n,to:nodeMap.get(n._parentKey),vol:n.v,cost:n.cost})});
  const edges=optimizeEdges(rawEdges);
  x.fillStyle=CH.lab;x.font='600 11.5px '+FNT;x.textAlign='center';
  for(let d=1;d<=numCols;d++){const cx=p.l+(d-1)*colW+colW/2;
    x.fillText(isCost?(d===1?'1. Итог себестоимости':'Уровень '+d):'Уровень '+d,cx,p.t-22)}
  const lineage=getLineage(TREE_FOCUSED_KEY,edges);
  drawTreeEdges(x,edges,lineage,isCost);
  drawTreeNodes(c,x,nodes,lineage,isCost);
}
