      `Расшить узкие места по топ-дефицитам: перераспределить мощности в пользу позиций с максимальной маржой на тонну, а не на заказ.`,
      `Установить порог отсечения: заказы с маржинальностью ниже 25% выносить на отдельное решение — пересмотр цены, отказ или смена маршрута.`,
      `Ввести регулярное сравнение версий планов для контроля, что изменения в сети улучшают маржу, а не только объём.`]}]);
}

/* ═════════ 9. БЛОК: СПРОС И ПОКРЫТИЕ ═══════════ */
function tabDM(){
  const D=fOrders();if(!D.length)return '<div class="empty">Нет данных под текущими фильтрами</div>';
  const agg=DS.agg||{},T0=agg.totals||{},covT=T0.cov||{};
  const hasDC=!!(((agg.dims||{}).coverage||[]).length);
  const fActive=Object.values(F).some(a=>a.length);
  /* Неограниченный спрос известен только из demand_coverage (агрегат по всей схеме) — под фильтрами не применяем */
  const useUnc=hasDC&&!fActive;

  const rev=S(D,o=>o.rev),mar=S(D,o=>o.mar),cost=S(D,o=>o.cost),dem=S(D,o=>o.dem),sal=S(D,o=>o.sal),unm=S(D,o=>o.unm);
  const ex=D.filter(o=>o.chan==='EX'),ru=D.filter(o=>o.chan==='RU'),p1=D.filter(o=>o.pr==1);
  const defOrders=D.filter(o=>o.unm>0),full=D.length-defOrders.length;
  const lm=S(defOrders,o=>o.unm*o.mpt),lostRev=S(defOrders,o=>o.unm*o.price);
  const demUnc=useUnc?(num(covT.demUnc)||(num(covT.ff)+num(covT.uf))):dem;
  const notPlanned=Math.max(0,demUnc-dem),late=useUnc?num(covT.late):0,inTime=Math.max(0,sal-late);
  const sl=dem?sal/dem:0;

  const per=grp(D,o=>o.p,v=>({sal:S(v,o=>o.sal),unm:S(v,o=>o.unm),dem:S(v,o=>o.dem)})).sort((a,b)=>a.k-b.k);
  const def=grp(defOrders,o=>o.loc+' · '+o.prod,v=>({v:S(v,o=>o.unm),lm:S(v,o=>o.unm*o.mpt),prod:v[0].prod}))
    .sort((a,b)=>b.lm-a.lm).slice(0,8);
  const prDef=grp(defOrders,o=>o.prod,v=>({unm:S(v,o=>o.unm),lm:S(v,o=>o.unm*o.mpt)})).sort((a,b)=>b.unm-a.unm);
  const cl=grp(D,o=>o.cl,v=>({mar:S(v,o=>o.mar),sal:S(v,o=>o.sal),dem:S(v,o=>o.dem),unm:S(v,o=>o.unm),rev:S(v,o=>o.rev)}))
    .sort((a,b)=>b.mar-a.mar);
  const pr=grp(D,o=>o.prod,v=>({price:S(v,o=>o.price*o.sal)/Math.max(S(v,o=>o.sal),1),cpt:S(v,o=>o.cost)/Math.max(S(v,o=>o.sal),1),
    mar:S(v,o=>o.mar),sal:S(v,o=>o.sal)})).sort((a,b)=>b.price-a.price);
  const rcaCache=new Map();
  const rcaFor=o=>{if(!rcaCache.has(o.id))rcaCache.set(o.id,CapacityRCA.analyzeOrderChain(o));return rcaCache.get(o.id)};

  /* ── бизнес-водопад ── */
  const wf=[];
  if(useUnc)wf.push({k:'Неограниченный спрос',v:demUnc,type:'total',c:CH.d1},{k:'Не принято в план',v:-notPlanned,type:'delta'});
  wf.push({k:'Ограниченный спрос',v:dem,type:'total',c:CH.d2},{k:'Дефицит',v:-unm,type:'delta'},{k:'Отгружено',v:sal,type:'total',c:CH.d3});
  if(useUnc)wf.push({k:'С опозданием',v:-late,type:'delta'},{k:'В срок',v:inTime,type:'total',c:CH.ok});

  const K=[
    ['Неограниченный спрос',useUnc?nf(demUnc)+' т':'—',useUnc?'demand_coverage, вся схема':(hasDC?'снимите фильтры, чтобы увидеть':'demand_coverage не загружен'),''],
    ['Ограниченный спрос (план)',nf(dem)+' т',D.length+' '+plural(D.length,['заказ','заказа','заказов']),''],
    ['Отгружено',nf(sal)+' т','Service Level '+pc(sl),sl>=.95?'pos':sl>=.8?'mid':'neg'],
    ['Дефицит',nf(unm)+' т',defOrders.length+' '+plural(defOrders.length,['заказ','заказа','заказов'])+' с дефицитом',unm?'neg':'pos'],
    ['Отгружено с опозданием',useUnc?nf(late)+' т':'—',useUnc?pc(sal?late/sal:0)+' отгруженного':'нужен demand_coverage',late&&late/Math.max(sal,1)>.05?'neg':late?'mid':''],
    ['Упущенная маржа',bn(lm),'потерянная выручка '+bn(lostRev),'neg'],
    ['Маржинальность продаж',pc(rev?mar/rev:0),`Выручка ${bn(rev)} | Маржа ${bn(mar)}`,'pos'],
    ['Заказов без дефицита',pc(full/D.length),`${full} из ${D.length}`,full/D.length>=.85?'pos':'mid']
  ];

  const html=`
  <div class="dq ${useUnc?'i':'w'}" style="margin-bottom:14px"><span class="tag">Источник</span>
    <div class="m">${useUnc?'Неограниченный спрос и опоздания — агрегаты <code>demand_coverage</code> по всей схеме; остальное — <code>marking_demand</code> под фильтрами.'
      :hasDC?'Активны фильтры: неограниченный спрос (<code>demand_coverage</code>) не разрезается по фильтрам, водопад начинается с ограниченного спроса.'
      :'Таблица <code>demand_coverage</code> не загружена — водопад построен от ограниченного спроса <code>marking_demand</code>.'}</div></div>
  <div class="kpis">${K.map(k=>`<div class="kpi"><div class="t">${k[0]}</div><div class="v ${k[3]}">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
  <div class="grid">
    <div class="card w"><h3>Водопад спроса: от неограниченного к отгрузке в срок</h3>
      <div class="sub">Тонны. Синие столбцы — уровни, красные — потери на каждом шаге. Клик по «Дефицит» — к таблице ниже</div><canvas id="d0"></canvas></div>
    <div class="card"><h3>Покрытие спроса по периодам</h3><div class="sub">Тыс. т и линия Service Level. Клик — фильтр по периоду</div>
      ${lg('#d1',[[CH.d3,'Отгружено'],[CH.d5,'Дефицит'],[CH.warn,'Service Level']])}<canvas id="d1"></canvas></div>
    <div class="card"><h3>Топ дефицитов: локация и продукт</h3><div class="sub">Ранжировано по упущенной марже. Клик — фильтр по продукту</div><canvas id="d2"></canvas></div>
    <div class="card"><h3>Доля каналов в марже</h3><div class="sub">Клик по сегменту — фильтр, по легенде — скрыть сегмент</div><canvas id="d3"></canvas></div>
    <div class="card"><h3>Клиенты: маржа и покрытие спроса</h3><div class="sub">Столбец — маржа, линия — Service Level</div>
      ${lg('#d4',[[CH.d1,'Маржа'],[CH.warn,'Service Level']])}<canvas id="d4"></canvas></div>
    <div class="card"><h3>Цена и себестоимость по продуктам</h3><div class="sub">Синяя точка — цена, вторая — себестоимость. Длина отрезка равна марже</div><canvas id="d5"></canvas></div>
    <div class="card"><h3>Маржа по клиентам и периодам</h3><div class="sub">Тепловая карта, млн ₽. Клик — фильтр клиент + период</div><canvas id="d6"></canvas></div>
    <div class="card"><h3>Дефицит по продуктам и периодам</h3><div class="sub">Тепловая карта, тыс. т. Клик — фильтр по продукту</div><canvas id="d8"></canvas></div>
    <div class="card"><h3>Парето заказов по дефициту</h3><div class="sub">Тёмные столбцы формируют 80% дефицита</div><canvas id="d9"></canvas></div>
    <div class="card w"><h3>Дефициты, упущенная маржа и корневые причины (RCA)</h3>
      <div class="sub">Единая таблица покрытия. Номер заказа открывает цепочку, бейдж узкого места — цепочку мощностей с фокусом на лимите</div><div id="d7"></div></div>
  </div>`;

  setTimeout(()=>{
    chWaterfall('#d0',H('#d0',280,0.28,240,380),wf,v=>nf(v/1000,1)+'k т',
      i=>{const b=wf[i];return `<b>${b.k}</b><br>${nf(Math.abs(b.v))} т`+(b.type==='delta'&&demUnc?`<br>${pc(Math.abs(b.v)/demUnc)} от неограниченного спроса`:'')},
      i=>{if(wf[i].k==='Дефицит'){const el=$('#d7');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}});
    chStackLine('#d1',H('#d1',270,0.48),per.map(p=>'P'+p.k),
      [{c:CH.d3,v:per.map(p=>p.sal)},{c:CH.d5,v:per.map(p=>p.unm)}],
      {c:CH.warn,v:per.map(p=>p.dem?p.sal/p.dem:0)},v=>nf(v/1000,0)+'k',
      i=>`<b>P${per[i].k}</b><br>Ограниченный спрос: ${nf(per[i].dem)} т<br>Отгружено: ${nf(per[i].sal)} т<br>Дефицит: ${nf(per[i].unm)} т<br>Service Level: ${pc(per[i].dem?per[i].sal/per[i].dem:0)}`,
      i=>setF('p',per[i].k));
    const noData=(id,msg)=>{const g=cv(id,200);if(g){g.x.fillStyle=CH.axis;g.x.textAlign='center';g.x.font='13px '+FNT;g.x.fillText(msg,g.w/2,100)}};
    if(def.length)chH('#d2',H('#d2',270,0.55),def.map(d=>({k:d.k,v:d.lm,c:CH.d5,prod:d.prod,
      tip:`<b>${d.k}</b><br>Дефицит: ${nf(d.v)} т<br>Упущенная маржа: ${bn(d.lm)}`})),bn,it=>setF('pr',it.prod));
    else noData('#d2','Дефицитов под текущими фильтрами нет');
    chDonut('#d3',H('#d3',230,0.55),[{k:'RU внутренний',v:S(ru,o=>o.mar),c:CH.d1},{k:'EX экспорт',v:S(ex,o=>o.mar),c:CH.d2}],
      'Маржа',bn,pt=>setF('ch',pt.k.startsWith('RU')?'RU':'EX'));
    chStackLine('#d4',H('#d4',250,0.45),cl.map(c=>c.k),[{c:CH.d1,v:cl.map(c=>c.mar)}],{c:CH.warn,v:cl.map(c=>c.dem?c.sal/c.dem:0)},
      v=>nf(v/1e9,1)+' млрд',i=>`<b>${cl[i].k}</b><br>Маржа: ${bn(cl[i].mar)}<br>Маржа на тонну: ${nf(cl[i].mar/Math.max(cl[i].sal,1))} ₽<br>Service Level: ${pc(cl[i].dem?cl[i].sal/cl[i].dem:0)}<br>Дефицит: ${nf(cl[i].unm)} т`,
      i=>setF('cl',cl[i].k));
    chDumbbell('#d5',H('#d5',290,0.6),pr.slice(0,9).map(p=>({k:p.k,a:p.price,b:p.cpt,
      tip:`<b>${p.k}</b><br>Цена: ${nf(p.price)} ₽/т<br>Себестоимость: ${nf(p.cpt)} ₽/т<br>Маржа на тонну: ${nf(p.price-p.cpt)} ₽<br>Маржинальность: ${pc(1-p.cpt/Math.max(p.price,1))}`})),
      v=>nf(v/1000,0)+'k ₽',it=>setF('pr',it.k));
    const rws=uq(D,o=>o.cl),cls=uq(D,o=>o.p).sort((a,b)=>a-b);
    chHeat('#d6',H('#d6',290,0.55),rws,cls.map(c=>'P'+c),rws.map(r=>cls.map(c=>S(D.filter(o=>o.cl===r&&o.p==c),o=>o.mar))),bn,
      (r,c)=>{const k=String(r),p=String(c).slice(1);
        const i=F.cl.indexOf(k);i<0?F.cl.push(k):F.cl.splice(i,1);
        const j=F.p.indexOf(p);j<0?F.p.push(p):F.p.splice(j,1);render()});
    const hr=prDef.slice(0,7).map(p=>p.k),hc=cls.map(c=>'P'+c);
    if(hr.length)chHeat('#d8',H('#d8',290,0.5),hr,hc,hr.map(r=>hc.map(c=>S(D.filter(o=>o.prod===r&&('P'+o.p)===c),o=>o.unm))),
      v=>nf(v)+' т',r=>setF('pr',r),v=>nf(v/1000,1)+'k');
    else noData('#d8','Нет дефицитов для разреза «продукт × период»');
    if(defOrders.length)chPareto('#d9',H('#d9',280,0.5),defOrders.slice().sort((a,b)=>b.unm-a.unm).slice(0,40).map(o=>({k:`#${o.id} ${o.prod}`,v:o.unm})),
      v=>nf(v)+' т',it=>setF('pr',it.k.split(' ')[1]));
    else noData('#d9','Дефицитов нет');

    dtable('#d7',[
      {k:'id',t:'# Заказа',num:1,left:1,f:(v,o)=>`<span style="color:var(--scp-link);font-weight:700;cursor:pointer;text-decoration:underline" title="Перейти к цепочке заказа №${o.id}" data-goto-order="${o.id}">№${v} ↗</span>`},
      {k:'loc',t:'Локация',left:1,flt:1},
      {k:'prod',t:'Продукт',left:1,flt:1},
      {k:'cl',t:'Клиент',left:1,flt:1},
      {k:'chan',t:'Канал',flt:1},
      {k:'p',t:'Период',num:1,flt:1,f:v=>'P'+v},
      {k:'dem',t:'Спрос',num:1,f:v=>nf(v)},
      {k:'sal',t:'Отгрузка',num:1,f:v=>nf(v,1)},
      {k:'unm',t:'Дефицит',num:1,f:v=>nf(v,1),cls:()=>'neg'},
      {k:'cov',t:'Покрытие',num:1,v:o=>o.dem?o.sal/o.dem:0,f:v=>pc(v),cls:v=>v>.5?'mid':'neg'},
      {k:'rca_prod',t:'Узкое место (пр-во)',left:1,flt:1,v:o=>{const r=rcaFor(o);
        if(!r.hasData)return 'Базовый режим';return r.prodBottleneck?`${r.prodBottleneck.rsName} (${pc(r.prodBottleneck.util)})`:'В норме'},
       f:(v,o)=>{const r=rcaFor(o);
        if(!r.hasData)return `<span class="tag" style="color:var(--scp-text-3)">—</span>`;
        if(!r.prodBottleneck)return `<span class="tag" style="color:var(--scp-ok);border-color:var(--scp-ok)">✓ В норме</span>`;
        const b=r.prodBottleneck;
        return `<span class="tag" data-rca-jump="1" data-mode="prod_res" data-ord="${o.id}" data-rs="${esc(b.rs)}" style="color:var(--scp-err);border-color:var(--scp-err);font-weight:600;cursor:pointer;background:var(--scp-err-bg)" title="Открыть цепочку производственных мощностей">🛑 ${esc(b.rsName)}: ${pc(b.util)} ↗</span>`}},
      {k:'rca_log',t:'Узкое место (логистика/склад)',left:1,flt:1,v:o=>{const r=rcaFor(o);
        if(!r.hasData)return 'Базовый режим';
        if(r.logBottleneck){const b=r.logBottleneck;return b.isBlocked?`⛔ Блок: ${b.rsName}`:`📦 ${b.rsName} (${pc(b.util)})`}
        return (r.logChain&&r.logChain.length)?'В норме':'Лимиты не заданы'},
       f:(v,o)=>{const r=rcaFor(o);
        if(!r.hasData)return `<span class="tag" style="color:var(--scp-text-3)">—</span>`;
        if(!r.logBottleneck)return (r.logChain&&r.logChain.length)
          ?`<span class="tag" style="color:var(--scp-ok);border-color:var(--scp-ok)">✓ В норме</span>`
          :`<span class="tag" style="color:var(--scp-text-3)" title="В res_loc / capacity_view_sp нет лимитов маршрутов для плеч этого заказа">◌ Лимиты не заданы</span>`;
        const b=r.logBottleneck,icon=b.isBlocked?'⛔':'📦',txt=b.isBlocked?`Блок: ${esc(b.rsName)}`:`${esc(b.rsName)}: ${pc(b.util)}`;
        const st=b.isBlocked?'color:var(--scp-err);border-color:var(--scp-err);background:var(--scp-err-bg)':'color:var(--scp-warn);border-color:var(--scp-warn);background:var(--scp-warn-bg)';
        return `<span class="tag" data-rca-jump="1" data-mode="log_res" data-ord="${o.id}" data-rs="${esc(b.rs)}" style="${st};font-weight:600;cursor:pointer" title="Открыть цепочку логистических лимитов">${icon} ${txt} ↗</span>`}},
      {k:'lostRev',t:'Потер. выручка',num:1,v:o=>o.unm*o.price,f:v=>mln(v),cls:()=>'neg'},
      {k:'lm',t:'Упущ. маржа',num:1,v:o=>o.unm*o.mpt,f:v=>mln(v),cls:()=>'neg'}
    ],defOrders,{key:'dm_def',sort:'lm',dir:'desc',h:360,csv:1,name:'deficits'});
  },0);

  const topDef=def[0],hiMar=D.slice().sort((a,b)=>b.mpt-a.mpt)[0];
  return html+summary('Резюме: спрос и покрытие',[
    {t:'Водопад',i:[
      useUnc?`Неограниченный спрос <span class="h">${nf(demUnc)} т</span> → в план принято ${nf(dem)} т (${pc(demUnc?dem/demUnc:0)}), отгружено ${nf(sal)} т, из них в срок ${nf(inTime)} т.`
        :`Ограниченный спрос <span class="h">${nf(dem)} т</span>, отгружено ${nf(sal)} т — Service Level ${pc(sl)}.`,
      unm?`Дефицит <span class="h">${nf(unm)} т</span> = ${bn(lostRev)} потерянной выручки и ${bn(lm)} упущенной маржи (${pc(mar?lm/mar:0)} текущего результата).`:`Дефицита нет — ограниченный спрос покрыт полностью.`,
      def.length?`Топ-позиция по упущенной марже: <span class="h">${topDef.k}</span> — ${nf(topDef.v)} т, ${bn(topDef.lm)}.`:'',
      `Экспорт: ${pc(sal?S(ex,o=>o.sal)/sal:0)} объёма и <span class="h">${pc(mar?S(ex,o=>o.mar)/mar:0)}</span> маржи; самая маржинальная позиция — ${hiMar.prod} (${nf(hiMar.mpt)} ₽/т, ${hiMar.cl}).`].filter(Boolean)},
    {t:'Аномалии',i:[
      p1.length&&S(p1,o=>o.sal)/Math.max(S(p1,o=>o.dem),1)<.9?`<span class="h">Приоритет 1 не обслужен полностью</span>: SL ${pc(S(p1,o=>o.sal)/S(p1,o=>o.dem))} — проверить правила аллокации и мощности.`:`Приоритет 1 обслужен полностью.`,
      def.length&&defOrders.some(o=>o.sal/o.dem<.1)?`Есть заказы с покрытием менее 10% — спрос фактически игнорируется оптимизатором: нет маршрута, мощности или сырья.`:`Критически низких покрытий не выявлено.`,
      `Поле «Клиент» смешивает юрлица и географии, сегмент «Прочие» агрегирует разнородных контрагентов — искажает клиентскую аналитику.`]},
    {t:'Рекомендации',i:[
      `Расшивать дефицит по <span class="h">упущенной марже</span>, а не по тоннам — таблица уже отсортирована так.`,
      `По каждому дефицитному заказу смотреть колонки RCA: перегруз производства, блокировка маршрута и сырьё — три разных управленческих решения.`,
      useUnc?`Сверять покрытие в разрезе periodtype — смешение гранулярностей искажает Service Level.`:`Загрузить <code>demand_coverage</code>, чтобы водопад начинался с неограниченного спроса и включал опоздания.`]}]);
}
/* ═══════════════ 10. БЛОК: ЛОГИСТИКА ═══════════════ */
function tabLG(){
  const O=fOps().filter(r=>r.type==='movement');
  if(!O.length)return '<div class="empty">Нет операций перемещения под текущими фильтрами</div>';
  const real=O.filter(r=>!r.stub);
  const cost=S(real,r=>r.cost),vol=S(O,r=>r.v);
  const byM=grp(O,r=>r.tm,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),rate:S(v.filter(x=>!x.stub),r=>r.cost)/Math.max(S(v.filter(x=>!x.stub),r=>r.v),1)}))
    .sort((a,b)=>b.c-a.c);
  const byC=grp(O,r=>r.tclass,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v)})).sort((a,b)=>b.c-a.c);

  // Классификатор контура плеча
  const getLegLayer=l=>{
    // Порядок проверок важен: плечо «поставщик → порт» — снабжение сырьём,
    // а не дистрибуция (раньше проверка Port перехватывала его в isOut)
    if(l.fr.startsWith('Vendor_'))return 'inbound';
    if(l.fr.startsWith('Plant_')&&l.to.startsWith('Plant_'))return 'interplant';
    return 'distrib';
  };

  const legs=grp(O,r=>r.fr+' → '+r.to,v=>({
    c:S(v,r=>r.cost),
    v:S(v,r=>r.v),
    fr:v[0].fr,
    to:v[0].to,
    tm:v[0].tm,
    prods:uq(v,z=>z.pr).filter(Boolean),
    layer:getLegLayer(v[0]),
    rate:S(v.filter(x=>!x.stub),r=>r.cost)/Math.max(S(v.filter(x=>!x.stub),r=>r.v),1)
  })).sort((a,b)=>b.v-a.v);

  const totCost=S(fOps(),r=>r.cost);
  const legsPerOrder=grp(O,r=>r.o,v=>({n:v.length}));
  const K=[['Затраты на логистику',bn(cost),pc(cost/Math.max(totCost,1))+' затрат цепочки',''],
   ['Перемещено',nf(vol)+' т',O.length+' '+plural(O.length,['операция','операции','операций']),''],
   ['Средний тариф',nf(cost/Math.max(S(real,r=>r.v),1))+' ₽/т','без строк-заглушек',''],
   ['Плеч на заказ',nf(S(legsPerOrder,l=>l.n)/legsPerOrder.length,1),'индикатор перевалки',
     S(legsPerOrder,l=>l.n)/legsPerOrder.length>6?'mid':''],
   ['Строк-заглушек',pc(O.filter(r=>r.stub).length/O.length),'тариф не более 1 ₽/т','mid'],
   ['Уникальных плеч',nf(legs.length),'узлов сети: '+uq(O,r=>r.fr).length,'']];

  // Фильтрация плеч под выбранный контур и вид транспорта
  let flowLegs = legs.filter(l=>l.fr&&l.to);
  if(LG_FLOW_LAYER==='distrib') flowLegs = flowLegs.filter(l=>l.layer==='distrib');
  else if(LG_FLOW_LAYER==='interplant') flowLegs = flowLegs.filter(l=>l.layer==='interplant');
  else if(LG_FLOW_LAYER==='inbound') flowLegs = flowLegs.filter(l=>l.layer==='inbound');

  // Доступные виды транспорта для активного контура
  const availTms = uq(flowLegs,l=>l.tm);
  if(LG_FLOW_TM!=='all'&&!availTms.includes(LG_FLOW_TM)) LG_FLOW_TM='all';

  if(LG_FLOW_TM!=='all') flowLegs = flowLegs.filter(l=>l.tm===LG_FLOW_TM);

  const hasClientFilter = F.cl.length>0||F.pr.length>0;
  const dispFlowLegs = hasClientFilter ? flowLegs : flowLegs.slice(0,32);

  const html=`
  <div class="kpis">${K.map(k=>`<div class="kpi"><div class="t">${k[0]}</div><div class="v ${k[3]||''}">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
  <div class="grid">
    <div class="card w">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px">
        <div>
          <h3>Потоки сети: откуда и куда</h3>
          <div class="sub" style="margin-bottom:0">Толщина потока — тонны. Наведите на иконку транспорта, чтобы увидеть перемещаемый продукт:</div>
        </div>
        <div class="seg">
          <button class="btn ${LG_FLOW_LAYER==='distrib'?'p':''}" id="lgLayerDistrib">🚚 Дистрибуция клиентам</button>
          <button class="btn ${LG_FLOW_LAYER==='interplant'?'p':''}" id="lgLayerInter">🏭 Межзаводские заготовки</button>
          <button class="btn ${LG_FLOW_LAYER==='inbound'?'p':''}" id="lgLayerInbound">📦 Снабжение сырьем</button>
          <button class="btn ${LG_FLOW_LAYER==='all'?'p':''}" id="lgLayerAll">🌐 Сквозная сеть</button>
        </div>
      </div>
      <div class="tbar" style="margin-bottom:10px">
        <span class="tbar-lbl">Вид транспорта:</span>
        <button class="chip ${LG_FLOW_TM==='all'?'on':''}" data-ltm="all">Все виды (${flowLegs.length})</button>
        ${availTms.map(t=>`<button class="chip ${LG_FLOW_TM===t?'on':''}" data-ltm="${esc(t)}">${TM_ICONS[t]||t}</button>`).join('')}
      </div>
      <canvas id="l3"></canvas>
    </div>
    <div class="card"><h3>Затраты по виду транспорта</h3><div class="sub">Клик — фильтр по виду</div><canvas id="l1"></canvas></div>
    <div class="card"><h3>Класс операции перемещения</h3><div class="sub">Транспорт, внутризаводское, терминал, условие поставки</div><canvas id="l2"></canvas></div>
    <div class="card"><h3>Топ плеч по затратам</h3><div class="sub">Клик — фильтр по виду транспорта плеча</div><canvas id="l4"></canvas></div>
    <div class="card"><h3>Тариф по видам транспорта</h3><div class="sub">Только реальные ставки, ₽/т</div><canvas id="l5"></canvas></div>
    <div class="card w"><h3>Матрица плеч</h3><div class="sub">Тонны, затраты и удельный тариф. Сортировка и мультифильтры</div><div id="l6"></div></div>
  </div>`;

  setTimeout(()=>{
    // Слушатели переключателя контуров
    if($('#lgLayerDistrib'))$('#lgLayerDistrib').onclick=()=>{LG_FLOW_LAYER='distrib';LG_FLOW_TM='all';render()};
    if($('#lgLayerInter'))$('#lgLayerInter').onclick=()=>{LG_FLOW_LAYER='interplant';LG_FLOW_TM='all';render()};
    if($('#lgLayerInbound'))$('#lgLayerInbound').onclick=()=>{LG_FLOW_LAYER='inbound';LG_FLOW_TM='all';render()};
    if($('#lgLayerAll'))$('#lgLayerAll').onclick=()=>{LG_FLOW_LAYER='all';LG_FLOW_TM='all';render()};

    // Слушатели переключателя вида транспорта
    $$('[data-ltm]').forEach(b=>{
      b.onclick=()=>{LG_FLOW_TM=b.dataset.ltm;render()};
    });

    // Динамический расчёт адаптивной высоты канваса под плотность узлов
    const nodesInFlow = new Set();
    dispFlowLegs.forEach(l=>{nodesInFlow.add(l.fr);nodesInFlow.add(l.to)});
    const isInterplant = (LG_FLOW_LAYER==='interplant') || dispFlowLegs.every(l=>l.fr.startsWith('Plant_')&&l.to.startsWith('Plant_'));
    const maxNodesInColEstimate = Math.ceil(nodesInFlow.size / (isInterplant ? 3.2 : 4.5));
    const autoGraphHeight = Math.max(380, Math.min(820, maxNodesInColEstimate * 52 + 90));

    // Отрисовка потоков
    if(dispFlowLegs.length) chFlow('#l3',H('#l3',autoGraphHeight,0.36,360,820),dispFlowLegs,v=>nf(v)+' т',k=>setF('nd',k));
    else{const g=cv('#l3',200);if(g){g.x.fillStyle=CH.axis;g.x.textAlign='center';g.x.font='13px '+FNT;
      g.x.fillText('В выбранном контуре и виде транспорта нет перемещений',g.w/2,100)}}

    chH('#l1',H('#l1',240,0.5),byM.map((m,i)=>({k:m.k,v:m.c,c:PAL[i%PAL.length],
      tip:`<b>${m.k}</b><br>Затраты: ${bn(m.c)}<br>Объём: ${nf(m.v)} т<br>Тариф: ${nf(m.rate)} ₽/т<br>Класс: ${TCLASS[m.k]||'—'}`})),bn,it=>setF('tm',it.k));
    chDonut('#l2',H('#l2',240,0.55),byC.map((c,i)=>({k:c.k,v:c.c,c:PAL[i]})),'Затраты',bn,null);

    const legsByCost=legs.slice().sort((a,b)=>b.c-a.c);
    chH('#l4',H('#l4',260,0.55),legsByCost.slice(0,9).map(l=>({k:l.fr+' → '+l.to,v:l.c,tm:l.tm,c:CH.d1,
      tip:`<b>${l.fr} → ${l.to}</b><br>${l.tm} · ${nf(l.v)} т<br>Продукты: ${l.prods.join(', ')||'—'}<br>Затраты: ${bn(l.c)}<br>Тариф: ${nf(l.rate)} ₽/т`})),bn,it=>setF('tm',it.tm));

    const rm=byM.filter(m=>m.rate>1).sort((a,b)=>b.rate-a.rate);
    chBars('#l5',H('#l5',260,0.45),rm.map(m=>m.k),[{c:CH.d6,v:rm.map(m=>m.rate)}],v=>nf(v/1000,1)+'k',
      i=>`<b>${rm[i].k}</b><br>Тариф: ${nf(rm[i].rate)} ₽/т<br>Объём: ${nf(rm[i].v)} т`,i=>setF('tm',rm[i].k),1,1);

    dtable('#l6',[
      {k:'fr',t:'Откуда',left:1,flt:1},
      {k:'to',t:'Куда',left:1,flt:1},
      {k:'tm',t:'Вид',flt:1},
      {k:'tc',t:'Класс',flt:1,v:l=>TCLASS[l.tm]||'—'},
      {k:'prods',t:'Продукты',left:1,flt:1,v:l=>l.prods.join(', ')},
      {k:'v',t:'Тонн',num:1,f:v=>nf(v)},
      {k:'c',t:'Затраты, млн',num:1,f:v=>nf(v/1e6,1)},
      {k:'rate',t:'Тариф ₽/т',num:1,f:v=>nf(v),cls:v=>v>10000?'neg':v>3000?'mid':''},
      {k:'layer',t:'Контур',flt:1,v:l=>l.layer==='distrib'?'Дистрибуция':l.layer==='interplant'?'Межзаводской':'Снабжение'}
    ],legs,{key:'lg_legs',sort:'v',dir:'desc',h:350,csv:1,name:'legs'});
  },0);

  const topLeg=legs.slice().sort((a,b)=>b.c-a.c)[0]||{fr:'—',to:'—',c:0,v:0,tm:'—'};
  const expensive=legs.filter(l=>l.rate>10000);
  const avgLegs=S(legsPerOrder,l=>l.n)/legsPerOrder.length;

  return html+summary('Резюме: логистика',[
    {t:'Выводы',i:[
      `Логистика составляет <span class="h">${bn(cost)}</span>, или ${pc(cost/Math.max(totCost,1))} затрат цепочки. Средний тариф ${nf(cost/Math.max(S(real,r=>r.v),1))} ₽/т.`,
      `Дороже всего плечо <span class="h">${topLeg.fr} → ${topLeg.to}</span> (${topLeg.tm}): ${bn(topLeg.c)} при ${nf(topLeg.v)} т.`,
      `Доминирующий вид: <span class="h">${byM[0].k}</span> — ${pc(byM[0].c/Math.max(cost,1))} логистических затрат.`,
      `В среднем <span class="h">${nf(avgLegs,1)}</span> плеч на заказ; часть цепочек проходит три и более промежуточных узла.`]},
    {t:'Аномалии',i:[
      `<span class="h">${pc(O.filter(r=>r.stub).length/O.length)}</span> строк перемещения имеют тариф не более 1 ₽/т (LASTMILE, PLANTFCA, часть SUPTRAN) — это технические заглушки модели.`,
      `Поле «Тип транспорта» смешивает виды транспорта (RAIL, TRUCK, SHIP) с условиями поставки (PLANTFCA) и операциями терминала (PORTHANDL).`,
      expensive.length?`Плечи с тарифом выше 10 000 ₽/т: ${expensive.slice(0,3).map(l=>`${l.fr} → ${l.to}`).join(' | ')} — проверить обоснованность маршрута.`:`Плеч с аномально высоким удельным тарифом не выявлено.`]},
    {t:'Рекомендации',i:[
      `Используйте переключатель контуров над графом (<b>Дистрибуция клиентам</b> / <b>Межзаводские заготовки</b> / <b>Снабжение сырьем</b>) и фильтр по видам транспорта для точечного анализа плеч.`,
      `Заполнить реальные тарифы для LASTMILE и PLANTFCA либо вынести их в отдельную статью условий поставки.`,
      `Проанализировать цепочки с пятью и более плечами на возможность прямой отгрузки.`]}]);
}

/* ═══════════════ 11. БЛОК: ПРОИЗВОДСТВО ═══════════════ */
function tabPD(){
  const O=fOps().filter(r=>r.type==='production');
  if(!O.length)return '<div class="empty">Нет производственных операций под текущими фильтрами</div>';
  const cost=S(O,r=>r.cost),vol=S(O,r=>r.v),totCost=S(fOps(),r=>r.cost);
  const byPl=grp(O,r=>r.pl,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),rc:S(v,r=>r.rc||0),
    rate:S(v,r=>r.cost)/Math.max(S(v,r=>r.v),1)})).sort((a,b)=>b.c-a.c);
  const byRs=grp(O.filter(r=>r.rc),r=>r.rs,v=>({rc:S(v,r=>r.rc),v:S(v,r=>r.v),pl:v[0].pl})).sort((a,b)=>b.rc-a.rc);
  const byRt=grp(O,r=>r.rt,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),rate:S(v,r=>r.cost)/Math.max(S(v,r=>r.v),1),pl:v[0].pl,pr:v[0].pr}))
    .filter(r=>r.k).sort((a,b)=>b.rate-a.rate);
  const byPr=grp(O,r=>r.pr,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),rate:S(v,r=>r.cost)/Math.max(S(v,r=>r.v),1)})).sort((a,b)=>b.c-a.c);
  const dep=grp(O,r=>r.dp,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v)})).sort((a,b)=>a.k-b.k);
  const multi=grp(O,r=>r.pr,v=>({pl:uq(v,x=>x.pl).length,rows:v})).filter(x=>x.pl>1);

  const bnList = (DS.hasCap ? DS.capacity.filter(c=>c.isBottleneck) : [])
    .sort((a,b)=>b.util-a.util);
  const avgCapUtil = DS.hasCap && DS.capacity.length 
    ? (S(DS.capacity,c=>c.load) / Math.max(S(DS.capacity,c=>c.avail),1))
    : null;

  const K=[
   ['Затраты на производство',bn(cost),pc(cost/Math.max(totCost,1))+' затрат цепочки',''],
   ['Объём операций',nf(vol)+' т',O.length+' '+plural(O.length,['операция','операции','операций']),''],
   ['Средняя загрузка мощностей',avgCapUtil!==null?pc(avgCapUtil):'Базовый режим',DS.hasCap?`доступно ${nf(S(DS.capacity,c=>c.avail))} т`:'лист capacity_view_sp не найден',avgCapUtil>0.9?'neg':avgCapUtil>0.75?'mid':'pos'],
   ['Узких мест (≥90%)',DS.hasCap?nf(bnList.length)+' '+plural(bnList.length,['ресурс','ресурса','ресурсов']):'—',DS.hasCap?`${bnList.filter(b=>b.isCrit).length} перегружены на 100%+`:'требуется capacity_view_sp',bnList.length?'neg':'pos'],
   ['Задействовано заводов',nf(byPl.length),uq(O,r=>r.rs).length+' '+plural(uq(O,r=>r.rs).length,['ресурс','ресурса','ресурсов']),''],
   ['Максимальная глубина BOM',nf(Math.max(...O.map(r=>r.dp||1))),'уровней разузлования','mid']
  ];

  const html=`
  <div class="kpis">${K.map(k=>`<div class="kpi"><div class="t">${k[0]}</div><div class="v ${k[3]||''}">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
  <div class="grid">
    <div class="card"><h3>Затраты по заводам</h3><div class="sub">Клик — фильтр по заводу</div><canvas id="p1"></canvas></div>
    <div class="card">
      <h3>${DS.hasCap ? 'Топ узких мест: загрузка мощностей от норматива' : 'Нагрузка ресурсов, машино-часы'}</h3>
      <div class="sub">${DS.hasCap ? 'Ранжирование самых критичных мощностей (≥90% утилизации)' : 'Доступная мощность в данных отсутствует, отображаются только машино-часы'}</div>
      <canvas id="p2"></canvas>
    </div>
    <div class="card"><h3>Себестоимость передела по рецептам</h3><div class="sub">₽/т. Сравнение альтернативных маршрутов</div><canvas id="p3"></canvas></div>
    <div class="card"><h3>Затраты по уровню разузлования</h3><div class="sub">Где в BOM накапливается стоимость</div><canvas id="p4"></canvas></div>
    <div class="card"><h3>Затраты по заводам и продуктам</h3><div class="sub">Тепловая карта, млн ₽</div><canvas id="p5"></canvas></div>
    <div class="card"><h3>${DS.hasCap ? 'Баланс мощностей: занято vs доступно' : 'Топ полуфабрикатов по затратам'}</h3>
      <div class="sub">${DS.hasCap ? 'Загрузка основных групп оборудования' : 'Справочно, без фильтрации'}</div>
      ${DS.hasCap?lg('#p6',[[CH.d1,'Доступно'],[CH.warn,'Загрузка']]):''}
      <canvas id="p6"></canvas>
    </div>
    <div class="card w"><h3>${DS.hasCap ? 'Реестр мощностей и узких мест (capacity_view_sp)' : 'Производственные маршруты'}</h3>
      <div class="sub">${DS.hasCap ? 'Сквозной баланс мощностей, процент утилизации и альтернативные мощности' : 'Рецепт, продукт и ресурс. Сортировка и мультифильтры'}</div>
      <div id="p7"></div>
    </div>
  </div>`;

  setTimeout(()=>{
    chH('#p1',H('#p1',250,0.52),byPl.slice(0,9).map((p,i)=>({k:p.k||'—',v:p.c,c:PAL[i%PAL.length],
      tip:`<b>${p.k}</b><br>Затраты: ${bn(p.c)}<br>Объём: ${nf(p.v)} т<br>Передел: ${nf(p.rate)} ₽/т<br>Машино-часы: ${nf(p.rc)}`})),bn,it=>setF('pl',it.k));

    if(DS.hasCap && DS.capacity.length){
      const topCap = DS.capacity.slice().sort((a,b)=>b.util-a.util).slice(0,10);
      chH('#p2',H('#p2',250,0.52),topCap.map(c=>({
        k: `${c.pl} · ${c.rsName}`,
        v: c.util * 100,
        c: c.util >= 1.0 ? CH.err : (c.util >= 0.90 ? CH.warn : CH.ok),
        pl: c.pl,
        tip: `<b>${c.rsName} (${c.rs})</b><br>Площадка: ${c.pl}<br>Норматив: ${nf(c.norm)} т<br>Загрузка плана: <b>${nf(c.load)} т</b><br>Утилизация: <b>${pc(c.util)}</b><br>Свободный резерв: ${nf(c.free)} т`
      })), v=>nf(v,1)+'%', it=>setF('pl',it.pl));
    } else {
      chH('#p2',H('#p2',250,0.52),byRs.slice(0,9).map(r=>({k:r.k,v:r.rc,c:CH.d6,pl:r.pl,
        tip:`<b>${r.k}</b><br>Завод: ${r.pl}<br>Машино-часы: ${nf(r.rc)}<br>Объём: ${nf(r.v)} т<br>Часов на тонну: ${nf(r.rc/Math.max(r.v,1),3)}`})),
        v=>nf(v)+' ч',it=>setF('pl',it.pl));
    }

    chBars('#p3',H('#p3',260,0.48),byRt.slice(0,10).map(r=>r.k.slice(0,14)),
      [{c:CH.d4,v:byRt.slice(0,10).map(r=>r.rate)}],v=>nf(v/1000,0)+'k',
      i=>`<b>${byRt[i].k}</b><br>Передел: ${nf(byRt[i].rate)} ₽/т<br>Продукт: ${byRt[i].pr}<br>Завод: ${byRt[i].pl}<br>Объём: ${nf(byRt[i].v)} т`,
      i=>setF('pl',byRt[i].pl),1);
    chLine('#p4',H('#p4',260,0.45),dep.map(d=>'Ур. '+d.k),[{c:CH.d1,v:dep.map(d=>d.c),fill:1}],v=>nf(v/1e6,0)+' млн',
      i=>`<b>Уровень ${dep[i].k}</b><br>Затраты: ${bn(dep[i].c)}<br>Объём: ${nf(dep[i].v)} т<br>Операций: ${dep[i].n}`,null);
    
    const rr=byPl.slice(0,7).map(p=>p.k),cc=byPr.slice(0,8).map(p=>p.k);
    chHeat('#p5',H('#p5',270,0.5),rr,cc,rr.map(r=>cc.map(c=>S(O.filter(x=>x.pl===r&&x.pr===c),x=>x.cost))),bn,(r)=>setF('pl',r));
    
    if(DS.hasCap && DS.capacity.length){
      const grpCap = grp(DS.capacity, c=>c.pl, v=>({
        avail: S(v, x=>x.avail),
        load: S(v, x=>x.load)
      })).slice(0,8);
      chBars('#p6',H('#p6',260,0.45),grpCap.map(g=>g.k),
        [{c:CH.d1,v:grpCap.map(g=>g.avail)},{c:CH.warn,v:grpCap.map(g=>g.load)}],
        v=>nf(v/1000,0)+'k т',
        i=>`<b>Площадка ${grpCap[i].k}</b><br>Доступно: ${nf(grpCap[i].avail)} т<br>Загрузка: ${nf(grpCap[i].load)} т<br>Утилизация: ${pc(grpCap[i].load/Math.max(grpCap[i].avail,1))}`,
        null);
    } else {

    if(DS.hasCap && DS.capacity.length){

        {k:'resType',t:'Вид ресурса',left:1,flt:1},
        {k:'periodKey',t:'Период',left:1,flt:1},
        {k:'norm',t:'Норматив, т',num:1,f:v=>nf(v)},
        {k:'avail',t:'Доступно, т',num:1,f:v=>nf(v)},
        {k:'load',t:'План загрузки, т',num:1,f:v=>nf(v)},
        {k:'free',t:'Свободно, т',num:1,f:v=>nf(v),cls:v=>v===0?'neg':''},
        {k:'util',t:'Загрузка %',num:1,f:v=>pc(v),cls:v=>v>=1.0?'neg':v>=0.9?'mid':'pos'}
      ],DS.capacity,{key:'pd_capacity',sort:'util',dir:'desc',h:350,csv:1,name:'capacity_balance'});
    } else {
      dtable('#p7',[
        {k:'rt',t:'Рецепт или маршрут',left:1,flt:1},
        {k:'pr',t:'Продукт',left:1,flt:1},
        {k:'pl',t:'Завод',flt:1,left:1},
        {k:'rs',t:'Ресурс',left:1,flt:1},
        {k:'dp',t:'Уровень',num:1,flt:1},
        {k:'v',t:'Тонн',num:1,f:v=>nf(v,1)},
        {k:'r',t:'₽/т',num:1,f:v=>nf(v)},
        {k:'cost',t:'Затраты, млн',num:1,f:v=>nf(v/1e6,1)},
        {k:'rc',t:'Машино-часы',num:1,f:v=>v?nf(v,1):'—'}
      ],O,{key:'pd_routes',sort:'cost',dir:'desc',h:350,csv:1,name:'production'});
    }
  },0);
  const maxRt=byRt[0]||{k:'—',rate:0,pr:'—',pl:'—'},topPl=byPl[0]||{k:'—',c:0};
  return html+summary('Резюме: производство',[
    {t:'Выводы',i:[
      `Производство составляет <span class="h">${bn(cost)}</span> (${pc(cost/Math.max(totCost,1))} затрат цепочки), средний передел ${nf(cost/Math.max(vol,1))} ₽/т.`,
      `Ключевая площадка: <span class="h">${topPl.k}</span> — ${pc(topPl.c/Math.max(cost,1))} производственных затрат.`,
      `Самый дорогой передел: <span class="h">${maxRt.k}</span> — ${nf(maxRt.rate)} ₽/т (${maxRt.pr} на ${maxRt.pl}).`,
      `Глубина разузлования достигает <span class="h">${Math.max(...O.map(r=>r.dp||1))}</span> уровней — стоимость накапливается каскадно, локальная экономия на нижнем уровне мультиплицируется вверх.`,
      multi.length?`Продукты, выпускаемые на нескольких площадках: ${multi.slice(0,3).map(m=>m.k).join(' | ')} — есть база для сравнения себестоимости заводов.`:`Мультизаводского выпуска одного продукта под фильтром не выявлено.`]},
    {t:'Аномалии',i:[
      DS.hasCap&&DS.capacity.length
        ?`Мощности загружены (${DS.capacity.length} записей, узких мест ≥90%: ${DS.capacity.filter(c=>c.isBottleneck).length}). Сверяйте баланс по площадкам в реестре мощностей выше — строки с загрузкой 100%+ требуют расшивки.`
        :`<span class="h">Мощности ресурсов отсутствуют в данных</span> — можно измерить только потреблённые машино-часы, но не загрузку. Узкие места формально не определяются.`,
      `Часть производственных операций имеет ставку 0 ₽/т (например, маршруты Scrap) — это либо безвозмездный возврат, либо пропуск данных; влияет на распределение себестоимости.`,
      `Мультиресурсные операции дублируют строку с тем же объёмом — при наивном суммировании объём производства завышается.`,
      `Поле «Источник поставки» фактически содержит идентификатор рецепта, а не поставщика — риск неверной интерпретации в отчётах.`]},
    {t:'Рекомендации',i:[
      DS.hasCap&&DS.capacity.length
        ?`Держать <span class="h">capacity_view_sp актуальным</span>: пересчитывать узкие места при каждом прогоне и разбирать ресурсы с загрузкой ≥90% до согласования плана.`
        :`Добавить в выгрузку <span class="h">доступную мощность ресурса</span> по периодам — это откроет процент утилизации, выявление узких мест и обоснование инвестиций.`,
      `Для продуктов с мультизаводским выпуском построить регулярное сравнение передела и перевести объём на площадку с меньшей полной себестоимостью с учётом логистики до клиента.`,
      `Провести аудит альтернативных рецептов одного продукта: разница в ₽/т между маршрутами — прямой резерв экономии без инвестиций.`,
      `Переименовать поля: «Источник поставки» в «Маршрут или рецепт», разделить «Ресурс» на производственный ресурс и локацию — это снизит ошибки аналитики.`]}]);
}

/* ═══════════════ 12. БЛОК: ЗАКУПКИ ═══════════════ */
function tabPC(){
  const O=fOps().filter(r=>r.type==='procurement');
  if(!O.length)return '<div class="empty">Нет закупочных операций под текущими фильтрами</div>';
  const cost=S(O,r=>r.cost),vol=S(O,r=>r.v),totCost=S(fOps(),r=>r.cost);
  const byV=grp(O,r=>r.vd,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),sku:uq(v,x=>x.pr).length,
    rate:S(v,r=>r.cost)/Math.max(S(v,r=>r.v),1)})).sort((a,b)=>b.c-a.c);
  const byM=grp(O,r=>r.pr,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),vd:uq(v,x=>x.vd),
    rate:S(v,r=>r.cost)/Math.max(S(v,r=>r.v),1),min:Math.min(...v.map(x=>x.r)),max:Math.max(...v.map(x=>x.r))}))
    .sort((a,b)=>b.c-a.c);
  const byP=grp(O,r=>r.p,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),rate:S(v,r=>r.cost)/Math.max(S(v,r=>r.v),1)})).sort((a,b)=>a.k-b.k);
  const infl=byM.filter(m=>m.max>m.min).map(m=>({...m,gr:m.max/m.min-1})).sort((a,b)=>b.gr-a.gr);
  const top3=byV.slice(0,3),conc=S(top3,v=>v.c)/Math.max(cost,1);
  const multiSrc=byM.filter(m=>m.vd.length>1);
  const K=[['Затраты на закупки',bn(cost),pc(cost/Math.max(totCost,1))+' затрат цепочки',''],
   ['Закуплено',nf(vol)+' т',O.length+' '+plural(O.length,['операция','операции','операций']),''],
   ['Средняя цена закупки',nf(cost/Math.max(vol,1))+' ₽/т','взвешенно',''],
   ['Поставщиков',nf(byV.length),uq(O,r=>r.pr).length+' '+plural(uq(O,r=>r.pr).length,['материал','материала','материалов']),''],
   ['Концентрация топ-3',pc(conc),top3.map(v=>v.k).join(' | '),conc>.6?'mid':''],
   ['Мультисорсинг',nf(multiSrc.length)+' SKU','имеют два и более поставщика',multiSrc.length?'pos':'mid']];
  const html=`
  <div class="kpis">${K.map(k=>`<div class="kpi"><div class="t">${k[0]}</div><div class="v ${k[3]||''}">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
  <div class="grid">
    <div class="card"><h3>Парето поставщиков по затратам</h3><div class="sub">Клик — фильтр по поставщику</div><canvas id="c1"></canvas></div>
    <div class="card"><h3>Топ материалов по затратам</h3><div class="sub">Клик — фильтр по поставщику материала</div><canvas id="c2"></canvas></div>
    <div class="card"><h3>Разброс цены закупки по материалу</h3><div class="sub">От минимума к максимуму за горизонт</div><canvas id="c3"></canvas></div>
    <div class="card"><h3>Динамика цены закупки</h3><div class="sub">Средняя ₽/т по периодам</div><canvas id="c4"></canvas></div>
    <div class="card"><h3>Затраты по поставщикам и материалам</h3><div class="sub">Тепловая карта, млн ₽</div><canvas id="c5"></canvas></div>
    <div class="card"><h3>Доля поставщиков в объёме</h3><div class="sub">Тонны</div><canvas id="c6"></canvas></div>
    <div class="card w"><h3>Закупочный реестр</h3><div class="sub">Сортировка и мультифильтры по поставщику, материалу и периоду</div><div id="c7"></div></div>
  </div>`;
  setTimeout(()=>{
    chPareto('#c1',H('#c1',250,0.45),byV.map(v=>({k:v.k,v:v.c})),bn,it=>setF('vd',it.k));
    chH('#c2',H('#c2',250,0.52),byM.slice(0,9).map((m,i)=>({k:m.k,v:m.c,vd:m.vd[0],c:PAL[i%PAL.length],
      tip:`<b>${m.k}</b><br>Затраты: ${bn(m.c)}<br>Объём: ${nf(m.v,1)} т<br>Средняя цена: ${nf(m.rate)} ₽/т<br>Поставщики: ${m.vd.join(', ')}`})),bn,it=>setF('vd',it.vd));
    chDumbbell('#c3',H('#c3',260,0.55),infl.slice(0,9).map(m=>({k:m.k,a:m.min,b:m.max,
      tip:`<b>${m.k}</b><br>Минимум: ${nf(m.min)} ₽/т<br>Максимум: ${nf(m.max)} ₽/т<br>Разброс: <b>+${pc(m.gr)}</b><br>Поставщики: ${m.vd.join(', ')}`})),
      v=>nf(v/1000,0)+'k',null);
    chLine('#c4',H('#c4',260,0.45),byP.map(p=>'P'+p.k),[{c:CH.d4,v:byP.map(p=>p.rate),fill:1}],v=>nf(v/1000,0)+'k',
      i=>`<b>P${byP[i].k}</b><br>Средняя цена: ${nf(byP[i].rate)} ₽/т<br>Затраты: ${bn(byP[i].c)}<br>Объём: ${nf(byP[i].v,1)} т`,
      i=>setF('p',byP[i].k));
    const rr=byV.slice(0,7).map(v=>v.k),cc=byM.slice(0,8).map(m=>m.k);
    chHeat('#c5',H('#c5',260,0.5),rr,cc,rr.map(r=>cc.map(c=>S(O.filter(x=>x.vd===r&&x.pr===c),x=>x.cost))),bn,(r)=>setF('vd',r));
    chDonut('#c6',H('#c6',260,0.55),byV.slice(0,6).map((v,i)=>({k:v.k,v:v.v,c:PAL[i]})),'Тонны',v=>nf(v,1)+' т',pt=>setF('vd',pt.k));
    dtable('#c7',[
      {k:'vd',t:'Поставщик',left:1,flt:1},
      {k:'pr',t:'Материал',left:1,flt:1},
      {k:'p',t:'Период',num:1,flt:1,f:v=>'P'+v},
      {k:'v',t:'Тонн',num:1,f:v=>nf(v,2)},
      {k:'r',t:'Цена ₽/т',num:1,f:v=>nf(v),cls:v=>v>500000?'neg':v>150000?'mid':''},
      {k:'cost',t:'Затраты, млн',num:1,f:v=>nf(v/1e6,2)},
      {k:'dp',t:'Уровень BOM',num:1,flt:1}
    ],O,{key:'pc_reg',sort:'cost',dir:'desc',h:350,csv:1,name:'procurement'});
  },0);
  const inflAvg=byP.length>1?byP[byP.length-1].rate/byP[0].rate-1:0;
  const dearest=byM.slice().sort((a,b)=>b.rate-a.rate)[0];
  return html+summary('Резюме: закупки',[
    {t:'Выводы',i:[
      `Закупки составляют <span class="h">${bn(cost)}</span> (${pc(cost/Math.max(totCost,1))} затрат цепочки) на ${nf(vol)} т от ${byV.length} поставщиков.`,
      `Топ-3 поставщика концентрируют <span class="h">${pc(conc)}</span> затрат: ${top3.map(v=>v.k+' — '+pc(v.c/cost)).join(' | ')}.`,
      `Самый дорогой материал в удельном выражении — <span class="h">${dearest.k}</span>, ${nf(dearest.rate)} ₽/т.`,
      byP.length>1?`Средняя цена закупки за горизонт изменилась на <span class="h">${pc(inflAvg)}</span> — это заложенная в план инфляция снабжения.`:`Динамику цен по периодам под текущим фильтром оценить нельзя.`,
      `Мультисорсинг есть у ${multiSrc.length} материалов — потенциал переключения объёма между вендорами.`]},
    {t:'Аномалии',i:[
      infl.length?`Максимальный разброс цены внутри одного материала: <span class="h">${infl[0].k}, +${pc(infl[0].gr)}</span>. Требует проверки: это индексация во времени или разные условия у вендоров.`:`Существенного разброса цен внутри материалов не выявлено.`,
      `Отпускные цены готовой продукции не индексируются, а закупочные растут. Это создаёт искусственное сжатие маржи к концу горизонта.`,
      `Часть материалов закупается микрообъёмами (менее одной тонны на операцию) при высокой цене — вероятны неучтённые минимальные партии и постоянные затраты на заказ.`,
      `Поле «Поставщик» заполнено только для закупок, но «Локация производства» в этих строках дублирует вендора — избыточность, ведущая к ошибкам соединения таблиц.`]},
    {t:'Рекомендации',i:[
      `Сфокусировать переговоры на топ-3 поставщиках: снижение цены на 5% даёт около ${bn(S(top3,v=>v.c)*.05)} экономии — больше, чем полная оптимизация всего остального.`,
      `Снизить зависимость: для материалов с единственным источником и высокой долей затрат инициировать поиск второго вендора.`,
      `Для материалов с мультисорсингом ввести правило приоритета по цене с учётом логистики — сейчас распределение выглядит немотивированным.`,
      `Добавить в модель минимальные партии, сроки поставки и условия оплаты — без них закупочная часть плана оптимистична.`]}]);
}

/* ═══════════════ 13. БЛОК: ЗАПАСЫ ═══════════════ */
function tabST(){
  const O=fOps().filter(r=>r.type==='stock');
  if(!O.length)return '<div class="empty"><h2>Операций хранения нет</h2><p>В исходной модели строки типа <code>stock</code> появляются только в поздних периодах. Снимите фильтр по периоду или выберите P11 и P12.</p></div>'
    +summary('Резюме: запасы',[{t:'Наблюдение',i:['Под выбранным фильтром хранение не используется — оптимизатор работает в поток. Это снижает затраты на запасы, но повышает чувствительность к сбоям поставок.']}]);
  const cost=S(O,r=>r.cost),vol=S(O,r=>r.v),totCost=S(fOps(),r=>r.cost);
  const byPl=grp(O,r=>r.pl,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),sku:uq(v,x=>x.pr).length})).sort((a,b)=>b.c-a.c);
  const byPr=grp(O,r=>r.pr,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),steps:v.length})).sort((a,b)=>b.c-a.c);
  const byP=grp(O,r=>r.p,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),n:v.length})).sort((a,b)=>a.k-b.k);
  const chains=grp(O,r=>r.o+'|'+r.pr+'|'+r.pl,v=>({steps:v.length,v:v[0].v,c:S(v,r=>r.cost),o:v[0].o,pr:v[0].pr,pl:v[0].pl}))
    .sort((a,b)=>b.steps-a.steps);
  const K=[['Затраты на хранение',bn(cost),pc(cost/Math.max(totCost,1))+' затрат цепочки',''],
   ['Тонно-периодов',nf(vol),O.length+' '+plural(O.length,['шаг','шага','шагов'])+' хранения',''],
   ['Ставка хранения',nf(cost/Math.max(vol,1))+' ₽ за тонну-период','средняя',''],
   ['Складских узлов',nf(byPl.length),uq(O,r=>r.rs).length+' локаций хранения',''],
   ['Максимальное пролёживание',nf(chains[0].steps)+' '+plural(chains[0].steps,['период','периода','периодов']),chains[0].pr+' на '+chains[0].pl,chains[0].steps>4?'neg':'mid'],
   ['Средняя длина хранения',nf(S(chains,c=>c.steps)/chains.length,1)+' периодов','по партиям','']];
  const html=`
  <div class="kpis">${K.map(k=>`<div class="kpi"><div class="t">${k[0]}</div><div class="v ${k[3]||''}">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
  <div class="grid">
    <div class="card"><h3>Затраты на хранение по складам</h3><div class="sub">Клик — фильтр по заводу</div><canvas id="s1"></canvas></div>
    <div class="card"><h3>Что лежит на хранении</h3><div class="sub">Тонно-периоды по продуктам</div><canvas id="s2"></canvas></div>
    <div class="card"><h3>Динамика хранения по периодам</h3><div class="sub">Затраты и число операций</div><canvas id="s3"></canvas></div>
    <div class="card"><h3>Длительность пролёживания партий</h3><div class="sub">Число последовательных шагов хранения</div><canvas id="s4"></canvas></div>
    <div class="card w"><h3>Затраты по складам и продуктам</h3><div class="sub">Тепловая карта, млн ₽</div><canvas id="s5"></canvas></div>
    <div class="card w"><h3>Реестр хранения</h3><div class="sub">Партии. Сортировка и мультифильтры</div><div id="s6"></div></div>
  </div>`;
  setTimeout(()=>{
    chH('#s1',H('#s1',240,0.5),byPl.slice(0,9).map((p,i)=>({k:p.k,v:p.c,c:PAL[i%PAL.length],
      tip:`<b>${p.k}</b><br>Затраты: ${bn(p.c)}<br>Тонно-периодов: ${nf(p.v)}<br>SKU: ${p.sku}`})),bn,it=>setF('pl',it.k));
    chDonut('#s2',H('#s2',240,0.55),byPr.slice(0,6).map((p,i)=>({k:p.k,v:p.v,c:PAL[i]})),'Тонно-периоды',v=>nf(v)+' т·п',null);
    chBars('#s3',H('#s3',250,0.45),byP.map(p=>'P'+p.k),[{c:CH.d4,v:byP.map(p=>p.c)}],v=>nf(v/1e6,0)+' млн',
      i=>`<b>P${byP[i].k}</b><br>Затраты: ${bn(byP[i].c)}<br>Операций: ${byP[i].n}<br>Тонно-периодов: ${nf(byP[i].v)}`,
      i=>setF('p',byP[i].k),0,1);
    chH('#s4',H('#s4',250,0.52),chains.slice(0,9).map(c=>({k:c.pr+' · '+c.pl,v:c.steps,
      c:c.steps>4?CH.err:CH.d2,pl:c.pl,
      tip:`<b>${c.pr}</b> на ${c.pl}<br>Заказ №${c.o}<br>Периодов хранения: <b>${c.steps}</b><br>Объём: ${nf(c.v,1)} т<br>Затраты: ${mln(c.c)} ₽`})),
      v=>nf(v)+' пер.',it=>setF('pl',it.pl));
    const rr=byPl.slice(0,7).map(p=>p.k),cc=byPr.slice(0,8).map(p=>p.k);
    chHeat('#s5',H('#s5',260,0.42),rr,cc,rr.map(r=>cc.map(c=>S(O.filter(x=>x.pl===r&&x.pr===c),x=>x.cost))),bn,(r)=>setF('pl',r));

/* ═══════════════ 14. БЛОК: СРАВНЕНИЕ ВЕРСИЙ ═══════════════ */
function snap(ds){
  const o=ds.orders,ops=ds.ops,f=t=>ops.filter(r=>r.type===t);
  const m=(t)=>S(f(t),r=>r.cost);
  return {name:ds.name,ts:ds.ts,orders:o.length,
    rev:S(o,x=>x.rev),cost:S(o,x=>x.cost),mar:S(o,x=>x.mar),dem:S(o,x=>x.dem),sal:S(o,x=>x.sal),unm:S(o,x=>x.unm),
    lm:S(o,x=>x.unm*x.mpt),full:o.filter(x=>!(x.unm>1e-9)).length,
    pd:m('production'),mv:m('movement'),pc:m('procurement'),st:m('stock'),
    opsN:ops.length,plants:uq(ops,r=>r.pl).length,vendors:uq(ops,r=>r.vd).length};
}
function getVers(){try{return JSON.parse(localStorage.getItem('sop_vers')||'[]')}catch(e){return []}}
function saveVer(){const v=getVers();v.unshift(snap(DS));localStorage.setItem('sop_vers',JSON.stringify(v.slice(0,12)));
  alert('Версия сохранена: '+DS.name+'\nВсего версий: '+Math.min(v.length,12));if(TAB==='vs')render()}

/* ── Автосохранение датасета: загруженные данные переживают перезагрузку страницы ──
   DS — чистые данные (строки/числа, без Date), поэтому сериализуется целиком.
   Формат версионируется (v:1): после смены структуры кода старая запись игнорируется. */
const AUTOSAVE_KEY='sop_autosave_v1';
const ACTIVE_DATASET_KEY='inplan_active_dataset_v1';
const DATASET_TTL_MS=4*60*60*1000;
function getActiveDatasetSource(){
  const active=readActiveDataset();
  return active&&active.source||null;
}
window.getActiveDatasetSource=getActiveDatasetSource;
function readActiveDataset(){
  try{
    const raw=localStorage.getItem(ACTIVE_DATASET_KEY);
    if(!raw)return null;
    const o=JSON.parse(raw);
    if(!o||o.v!==1||!o.source||!o.expiresAt||o.expiresAt<=Date.now()){
      localStorage.removeItem(ACTIVE_DATASET_KEY);
      return null;
    }
    return o;
  }catch(e){return null}
}
function writeActiveDataset(ds,expiresAt){
  if(!ds)return;
  try{localStorage.setItem(ACTIVE_DATASET_KEY,JSON.stringify({
    v:1,source:ds.src==='clickhouse'?'clickhouse':'excel',name:ds.name||'',
    schema:ds.schema||'',gran:ds.gran||null,expiresAt:expiresAt||Date.now()+DATASET_TTL_MS
  }))}catch(e){console.warn('Активный набор не сохранён:',e)}
}
function clearSavedDataset(){
  try{localStorage.removeItem(AUTOSAVE_KEY);localStorage.removeItem(ACTIVE_DATASET_KEY)}catch(e){}
}
function expireActiveDatasetIfNeeded(){
  if(DS && !DS._demo && !readActiveDataset()){
    clearSavedDataset();
    DS=build(SEED);DS._demo=true;TAB='ov';STAT_PIN=false;clearF();render();
  }
}
function autosaveDS(){
  if(!DS)return;
  try{
    localStorage.setItem(AUTOSAVE_KEY,JSON.stringify({v:1,ts:new Date().toISOString(),name:DS.name,ds:DS}));
    writeActiveDataset(DS);
  }
  catch(e){/* приватный режим / переполнение квоты (~5 МБ) — просто не сохраняем */
    console.warn('Автосохранение не выполнено:',e)}
}
function restoreDS(){
  try{
    const active=readActiveDataset();
    if(!active)return null;
    const raw=localStorage.getItem(AUTOSAVE_KEY);
    if(!raw)return null;
    const o=JSON.parse(raw);
    if(!o||o.v!==1||!o.ds||!Array.isArray(o.ds.orders)||!Array.isArray(o.ds.ops))return null;
    if((active.source==='clickhouse') !== (o.ds.src==='clickhouse'))return null;
    return o;
  }catch(e){return null}
}
function fmtTs(ts){if(!ts)return '';const d=new Date(ts);const p=n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`}

  const opt=(sel)=>list.map((v,i)=>`<option value="${i}" ${((sel===0?iB:iA)===i)?'selected':''}>${esc(v.name)}${v.ts?(' | '+fmtTs(v.ts)):''}</option>`).join('');

function tabDQ(){
  const o=DS.orders,ops=DS.ops,ch=[];
  const add=(sev,tag,msg,rec)=>ch.push({sev,tag,msg,rec});

  const bad1=o.filter(x=>Math.abs(x.sal+x.unm-x.dem)>.01);
  add(bad1.length?'e':'i','Баланс спроса',
    bad1.length?`${bad1.length} заказов: план продаж плюс неудовлетворённый спрос не равны плану спроса, например №${bad1[0].id}.`
      :`Все ${o.length} заказов: план продаж плюс неудовлетворённый спрос равны плану спроса.`,
    bad1.length?'Проверить выгрузку оптимизатора — нарушен базовый инвариант модели.':'Инвариант соблюдён, данные пригодны для расчёта Service Level.');

  const bad2=o.filter(x=>Math.abs(x.sal*x.price-x.rev)>Math.max(1,x.rev*1e-6));
  add(bad2.length?'e':'i','Выручка',
    bad2.length?`${bad2.length} заказов: выручка не равна произведению плана продаж на цену.`:'Выручка сходится с произведением продаж на цену во всех заказах.',
    bad2.length?'Уточнить наличие скидок и надбавок, не отражённых в поле цены за тонну.':'Расчёт выручки корректен.');

  const bad3=o.filter(x=>Math.abs(x.rev-x.cost-x.mar)>Math.max(1,x.rev*1e-6));
  add(bad3.length?'e':'i','Маржа',
    bad3.length?`${bad3.length} заказов: маржа не равна разнице выручки и себестоимости.`:'Маржа сходится с разницей выручки и себестоимости.',
    bad3.length?'Проверить знаки и полноту состава себестоимости.':'Финансовая логика непротиворечива.');

  const an=o.filter(x=>x.cpt<x.price*.01);
  add(an.length?'e':'i','Аномальная себестоимость',
    an.length?`${an.length} ${plural(an.length,['заказ','заказа','заказов'])} с себестоимостью менее 1% от цены: ${an.slice(0,3).map(x=>'№'+x.id+' '+x.prod+' — '+nf(x.cpt)+' ₽/т при цене '+nf(x.price)).join(' | ')}.`
      :'Заказов с аномально низкой себестоимостью не выявлено.',
    an.length?'Искажает рейтинг маржинальности. Причина обычно в отпуске со склада без разузлования до сырья. Исключить из рейтингов или помечать флагом неполной себестоимости.':'—');

  const flat=grp(o,x=>x.prod,v=>({u:uq(v,z=>z.price).length,p:uq(v,z=>z.p).length})).filter(x=>x.p>1&&x.u===1);
  add(flat.length?'w':'i','Индексация цен',
    flat.length?`${flat.length} ${plural(flat.length,['продукт','продукта','продуктов'])} имеют одинаковую цену во всех периодах: ${flat.slice(0,4).map(f=>f.k).join(' | ')}. При этом закупочные тарифы растут.`
      :'Цены изменяются по периодам.',
    flat.length?'Заложить индексацию отпускных цен, иначе маржа к концу горизонта систематически занижена, а решения смещены в сторону раннего исполнения.':'—');

  const stub=ops.filter(r=>r.stub);
  const stubRate=stub.length/Math.max(ops.length,1);
  add(stubRate>.1?'w':'i','Тарифы-заглушки',
    `${stub.length} из ${ops.length} операций (${pc(stubRate)}) имеют ставку не более 1 ₽/т, в основном ${uq(stub,r=>r.tm).filter(x=>x).slice(0,4).join(', ')||'перемещения без тарифа'}.`,
    'Стоимостные метрики по этим строкам исключены из расчёта, поэтому затраты цепочки недооценены. Заполнить реальные ставки либо вынести в отдельную статью условий поставки.');

  add('w','Незаполненные поля',
    'Поля «Тип спроса», «Потреблённый запас», «late_delivery», «mapper_run_id» пусты во всей выгрузке.',
    'Без них недоступны сегментация спроса, оборачиваемость запасов и метрика своевременности. Запросить заполнение у владельца модели.');

  const mixed=ops.filter(r=>r.type==='movement'&&r.rs);
  add('w','Смешение сущностей',
    `Поле «Тип транспорта» объединяет виды транспорта (RAIL, TRUCK, SHIP) с условиями поставки (PLANTFCA) и операциями терминала (PORTHANDL). Поле «Ресурс» в строках перемещения содержит локации${mixed.length?', '+mixed.length+' строк':''}.`,
    'Разделить на независимые атрибуты: вид транспорта, тип операции сети, базис поставки. Поле «Ресурс» оставить только для производственных строк.');

  const dup=grp(ops.filter(r=>r.type==='production'),r=>r.o+'|'+r.rt+'|'+r.pr+'|'+r.v,v=>({n:v.length})).filter(x=>x.n>1);
  add(dup.length?'w':'i','Дубли объёма по мультиресурсу',
    dup.length?`${dup.length} групп производственных операций дублируются по нескольким ресурсам с одинаковым объёмом.`
      :'Дублей мультиресурсных операций не обнаружено.',
    dup.length?'При суммировании объёма выпуска обязательна дедупликация по order_operation_id, иначе производство завышается кратно числу ресурсов.':'—');

  const hasRC=ops.some(r=>r.rc);
  if(DS.hasCap && DS.capacity.length){
    const bnCount = DS.capacity.filter(c=>c.isBottleneck).length;
    add('i','Баланс мощностей (capacity_view_sp)',
      `Мощности ресурсов успешно загружены (${DS.capacity.length} записей). Рассчитана утилизация от норматива, выявлено ${bnCount} узких мест (≥90%).`,
      '—');
  } else {
    add('e','Отсутствуют мощности ресурсов',
      hasRC?'Есть потреблённые машино-часы, но нет доступной мощности ресурсов по периодам.'
        :'Нет ни потребления, ни мощности ресурсов (лист capacity_view_sp не загружен).',
      'Без мощности невозможно рассчитать утилизацию и найти узкие места. Добавьте лист capacity_view_sp в загружаемый XLSX.');
  }
  const synth=uq(o,x=>x.dem).length===1;
  add(synth?'w':'i','Реалистичность спроса',
    synth?`Все заказы имеют одинаковый план спроса — ${nf(o[0].dem)} т. Это признак тестового набора.`
      :'План спроса варьируется по заказам, набор выглядит реальным.',
    synth?'Не переносить абсолютные значения в управленческую отчётность до валидации на фактическом спросе.':'—');

  const geo=['Вьетнам','Турция','Южная Америка','Китай','Индия'].filter(g=>o.some(x=>x.cl===g));
  const nOther=o.filter(x=>x.cl==='Прочие').length;
  add(geo.length||nOther?'w':'i','Справочник клиентов',
    (geo.length?`Поле «Клиент» смешивает юрлица и географии: ${geo.join(', ')}. `:'')
    +(nOther?`Присутствует агрегат «Прочие» — ${nOther} ${plural(nOther,['заказ','заказа','заказов'])}, ${pc(nOther/o.length)} портфеля.`:''),
    'Ввести два независимых измерения: клиент и рынок или регион. Распаковать «Прочие» минимум до топ-10 контрагентов, иначе клиентская аналитика искажена.');

  const ps=uq(o,x=>x.p).sort((a,b)=>a-b);
  const gaps=[];for(let i=ps[0];i<=ps[ps.length-1];i++)if(!ps.includes(i))gaps.push(i);
  add(gaps.length?'w':'i','Покрытие горизонта',
    gaps.length?`Загружены периоды ${ps.join(', ')}. Отсутствуют: ${gaps.join(', ')} — тренды и сезонность считаются по неполному горизонту.`
      :`Горизонт непрерывен: периоды с ${ps[0]} по ${ps[ps.length-1]}, всего ${ps.length}.`,
    gaps.length?'Догрузить полный файл: выводы о динамике маржи и тарифов на разрывном горизонте ненадёжны.':'—');

  const maxDp=Math.max(...ops.map(r=>r.dp||0),0);
  add(maxDp>=9?'w':'i','Глубина разузлования',
    `Максимальная глубина дерева операций — ${maxDp} уровней. Операций с глубиной семь и более: ${ops.filter(r=>(r.dp||0)>=7).length}.`,
    maxDp>=9?'Глубокие цепочки каскадно накапливают стоимость и делают себестоимость чувствительной к ошибке на нижнем уровне. Проверить корректность коэффициентов расхода.':'—');

  const stR=uq(ops.filter(r=>r.type==='stock'),r=>Math.abs(r.r));
  add(stR.length===1?'w':'i','Ставки хранения',
    ops.some(r=>r.type==='stock')
      ?(stR.length===1?`Все операции хранения имеют единую ставку ${nf(stR[0])} ₽/т за период.`:`Ставки хранения варьируются: ${stR.length} различных значений.`)
      :'Операции хранения в выгрузке отсутствуют.',
    stR.length===1?'Дифференцировать ставки по типу склада и продукта: модель не различает дешёвый навал и дорогое условное хранение.':'—');

  const pcO=ops.filter(r=>r.type==='procurement');
  const single=grp(pcO,r=>r.pr,v=>({vd:uq(v,x=>x.vd).length,c:S(v,x=>x.cost)})).filter(x=>x.vd===1).sort((a,b)=>b.c-a.c);
  add(single.length?'w':'i','Риск единственного источника',
    single.length?`${single.length} ${plural(single.length,['материал','материала','материалов'])} закупаются у единственного поставщика. Крупнейшие по затратам: ${single.slice(0,3).map(s=>s.k+' — '+bn(s.c)).join(' | ')}.`
      :'Все материалы имеют альтернативные источники.',
    single.length?'Риск срыва поставки не хеджирован. Инициировать квалификацию второго вендора по позициям с наибольшими затратами.':'—');

  const errs=ch.filter(c=>c.sev==='e').length, warns=ch.filter(c=>c.sev==='w').length, oks=ch.filter(c=>c.sev==='i').length;
  const score=Math.max(0,Math.round(100-errs*13-warns*5));
  const SEV={e:['Критично',CH.err],w:['Предупреждение','#c47512'],i:['Норма',CH.ok]};

  const html=`
  <div class="dq i" style="margin-bottom:14px"><span class="tag">Область анализа</span>
    <div class="m">Проверки выполняются по <b>всему загруженному набору</b>: ${o.length} заказов и ${ops.length} операций.
    Они не зависят от активных фильтров — качество данных оценивается целиком.</div></div>
  <div class="kpis">
    ${[['Индекс качества данных',score+' из 100',errs+' критических, '+warns+' предупреждений',score>=75?'pos':score>=50?'mid':'neg'],
       ['Проверок выполнено',nf(ch.length),oks+' пройдено успешно',''],
       ['Заказов в наборе',nf(o.length),uq(o,x=>x.p).length+' периодов | '+uq(o,x=>x.prod).length+' продуктов',''],
       ['Операций в наборе',nf(ops.length),uq(ops,r=>r.type).length+' типов операций',''],
       ['Покрытие затрат',pc(1-stubRate),'строк с реальным тарифом',stubRate>.2?'neg':stubRate>.1?'mid':'pos'],
       ['Пустых атрибутов',nf(4),'из выгрузки не используются','mid']]
      .map(k=>`<div class="kpi"><div class="t">${k[0]}</div><div class="v ${k[3]}">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}
  </div>
  <div class="grid">
    <div class="card"><h3>Профиль проверок</h3><div class="sub">Распределение результатов по уровню критичности</div><canvas id="q1"></canvas></div>
    <div class="card"><h3>Покрытие затрат по типам операций</h3><div class="sub">Доля строк с реальным тарифом</div><canvas id="q2"></canvas></div>
    <div class="card w"><h3>Реестр проверок и рекомендаций</h3><div class="sub">Отсортировано по критичности</div><div id="q3"></div></div>
    <div class="card w"><h3>Заполненность атрибутов выгрузки</h3><div class="sub">Доля непустых значений в релевантных строках</div><canvas id="q4"></canvas></div>
  </div>`;

  setTimeout(()=>{
    chDonut('#q1',H('#q1',240,0.55),[
      {k:'Критично',v:errs||0.001,c:CH.err},{k:'Предупреждение',v:warns||0.001,c:CH.warn},{k:'Норма',v:oks||0.001,c:CH.ok}
    ],'Проверки',v=>nf(Math.round(v))+' шт',null);

    const cov=grp(ops,r=>r.type,v=>({ok:v.filter(x=>!x.stub).length,n:v.length}))
      .map(t=>({k:t.k,v:t.ok/Math.max(t.n,1),n:t.n,ok:t.ok})).sort((a,b)=>a.v-b.v);
    chH('#q2',H('#q2',240,0.5),cov.map(c=>({k:c.k,v:c.v*100,c:c.v>.85?CH.ok:c.v>.6?CH.warn:CH.err,
      tip:`<b>${c.k}</b><br>С реальным тарифом: ${c.ok} из ${c.n}<br>Покрытие: ${pc(c.v)}<br>Без стоимости: ${c.n-c.ok} строк`})),
      v=>nf(v,0)+'%',null);

    $('#q3').innerHTML=ch.slice().sort((a,b)=>({e:0,w:1,i:2})[a.sev]-({e:0,w:1,i:2})[b.sev]).map(c=>
      `<div class="dq ${c.sev}"><span class="tag" style="color:${SEV[c.sev][1]};border-color:${SEV[c.sev][1]}">${SEV[c.sev][0]}</span>
       <div class="m"><b>${c.tag}.</b> ${c.msg}${c.rec&&c.rec!=='—'?`<br><span style="color:var(--scp-text-3)">Рекомендация: ${c.rec}</span>`:''}</div></div>`).join('');

    const fields=[
      ['Локация производства',ops.filter(r=>r.type==='production'||r.type==='stock'),r=>r.pl],
      ['Ресурс',ops.filter(r=>r.type==='production'),r=>r.rs],
      ['Маршрут или рецепт',ops.filter(r=>r.type==='production'),r=>r.rt],
      ['Машино-часы',ops.filter(r=>r.type==='production'),r=>r.rc],
      ['Поставщик',ops.filter(r=>r.type==='procurement'),r=>r.vd],
      ['Плечо откуда и куда',ops.filter(r=>r.type==='movement'),r=>r.fr&&r.to],
      ['Тариф без заглушки',ops,r=>!r.stub],
      ['Тип спроса',ops,()=>false],
      ['Потреблённый запас',ops,()=>false],
      ['late_delivery',ops,()=>false]
    ].map(f=>({k:f[0],v:f[1].length?f[1].filter(f[2]).length/f[1].length*100:0}));
    chBars('#q4',H('#q4',270,0.28,230,350),fields.map(f=>f.k),[{c:CH.d1,v:fields.map(f=>f.v)}],v=>nf(v,0)+'%',
      i=>`<b>${fields[i].k}</b><br>Заполнено: ${nf(fields[i].v,1)}% релевантных строк${fields[i].v===0?'<br>Поле не используется':''}`,
      null,1);
  },0);

  const topRec=ch.filter(c=>c.sev==='e').concat(ch.filter(c=>c.sev==='w')).slice(0,4);
  return html+summary('Резюме: качество данных',[
    {t:'Общая оценка',i:[
      `Индекс качества данных — <span class="h">${score} из 100</span>: ${errs} критических нарушений, ${warns} предупреждений, ${oks} проверок пройдено.`,
      `Базовые финансовые инварианты (баланс спроса, выручка, маржа) ${bad1.length||bad2.length||bad3.length?'<span class="h">нарушены</span>. Использовать данные для принятия решений нельзя до исправления':'соблюдены. Агрегированные финансовые показатели можно считать достоверными'}.`,
      `Стоимостное покрытие операций: <span class="h">${pc(1-stubRate)}</span>. Остаток приходится на строки с тарифом-заглушкой, поэтому полная себестоимость цепочки занижена.`,
      DS.hasCap&&DS.capacity.length
        ?`Мощности и лимиты загружены (${DS.capacity.length} записей, узких мест: ${DS.capacity.filter(c=>c.isBottleneck).length}) — утилизация рассчитывается; следите, чтобы файл capacity_view_sp сопровождал каждый прогон.`
        :`Ключевой пробел для планирования — <span class="h">отсутствие мощностей ресурсов</span>. Без них производственный блок остаётся описательным, узкие места не выявляются.`]},
    {t:'Приоритетные действия в порядке влияния',i:topRec.map((c,i)=>
      `<b>${i+1}. ${c.tag}</b> — ${c.rec}`)},
    {t:'Как улучшить процесс подготовки данных',i:[
      `Внедрить автоматические <span class="h">проверки выгрузки</span>: три инварианта — баланс спроса, выручка равна объёму на цену, маржа равна разнице выручки и себестоимости — должны проверяться до публикации файла.`,
      `Разделить выгрузку на <span class="h">два уровня</span>: заказы и операции. Сейчас финансы дублируются на каждой строке операции, что провоцирует двойной счёт.`,
      `Нормализовать справочники: клиент отдельно от региона, вид транспорта отдельно от базиса поставки, ресурс отдельно от локации, маршрут отдельно от поставщика.`,
      `Добавить отсутствующие сущности: мощности ресурсов, расстояния и время в пути, остатки запасов, минимальные партии закупки. Каждая открывает целый класс метрик.`,
      `Ввести <span class="h">версионирование прогонов</span> с фиксацией вводных: без этого невозможно отличить эффект управленческого решения от эффекта изменения данных.`]}]);
}

    {k:'loc',t:'Локация спроса',left:1,flt:1},
    {k:'prod',t:'Продукт',left:1,flt:1},
    {k:'cl',t:'Клиент',left:1,flt:1},

    {k:'dem',t:'Спрос, т',num:1,f:v=>nf(v)},

    {k:'rev',t:'Выручка',num:1,f:v=>mln(v)},
    {k:'cost',t:'Себестоимость',num:1,f:v=>mln(v)},
    {k:'mar',t:'Маржа',num:1,f:v=>mln(v)},

    {k:'p',t:'Период',num:1,flt:1,f:v=>'P'+v},
    {k:'type',t:'Тип',flt:1,left:1},
    {k:'pr',t:'Продукт операции',left:1,flt:1},
    {k:'pl',t:'Завод',left:1,flt:1},
    {k:'rs',t:'Ресурс',left:1,flt:1},
    {k:'fr',t:'Откуда',left:1,flt:1},
    {k:'to',t:'Куда',left:1,flt:1},
    {k:'tm',t:'Транспорт',flt:1},
    {k:'vd',t:'Поставщик',left:1,flt:1},
    {k:'v',t:'Объём, т',num:1,f:v=>nf(v,2)},
    {k:'r',t:'Тариф, ₽',num:1,f:(v,r0)=>r0.stub?'0 ₽':nf(v)},
    {k:'cost',t:'Затраты, ₽',num:1,f:v=>v?nf(v):'—'},
    {k:'rt',t:'Маршрут',left:1,flt:1},
    {k:'dp',t:'Глубина',num:1,flt:1,f:v=>'Ур. '+v},
    {k:'rc',t:'Машино-часы',num:1,f:v=>v?nf(v,2):'—'}
  ];
  const html=`
