  x.fillStyle=CH.d3;x.font='600 12px '+FNT;x.textAlign='left';x.textBaseline='alphabetic';
  x.fillText('2. Финансовый водопад: выручка, затраты по статьям и валовая маржа',p.l,wfTop-10);
  const pcC=S(ops.filter(o=>o.type==='procurement'),o=>o.cost)||(ord.cost*.49);
  const pdC=S(ops.filter(o=>o.type==='production'),o=>o.cost)||(ord.cost*.48);
  const mvC=S(ops.filter(o=>o.type==='movement'),o=>o.cost)||(ord.cost*.028);
  const stC=S(ops.filter(o=>o.type==='stock'),o=>o.cost)||(ord.cost*.002);
  const stages=[
    {name:'Валовая выручка',val:ord.rev,c:CH.d1,base:1},
    {name:'Сырьё',val:pcC,c:CH.d4},{name:'Производство',val:pdC,c:CH.d3},
    {name:'Логистика',val:mvC,c:CH.d2},{name:'Хранение',val:stC,c:CH.d6},
    {name:'Валовая маржа',val:ord.mar,c:CH.d3,total:1,margin:1},
    {name:'Полная с/с',val:pcC+pdC+mvC+stC,c:'#8a8f98',ref:1}];
  const wcW=(w-p.l-p.r)/stages.length,wbW=Math.min(wcW*.62,108);
  const maxF=ord.rev*1.28||1,wAvail=h-wfTop-p.b-22;
  let lvl=ord.rev;
  stages.forEach((cs,i)=>{
    const bx=p.l+i*wcW+(wcW-wbW)/2;let by,bh;
    if(cs.base||cs.total||cs.ref){bh=Math.max(wAvail*(cs.val/maxF),12);by=wfTop+wAvail-bh}
    else{bh=Math.max(wAvail*(cs.val/maxF),4);by=wfTop+wAvail-(wAvail*(lvl/maxF));lvl-=cs.val;
      x.strokeStyle=CH.line;x.setLineDash([3,3]);x.beginPath();
      x.moveTo(bx+wbW,by+bh);x.lineTo(bx+wcW,by+bh);x.stroke();x.setLineDash([])}
    x.fillStyle=cs.c;drawBox(x,bx,by,wbW,bh,4);x.fill();
    if(cs.ref){x.strokeStyle=CH.ctrl||'#949598';x.lineWidth=1;x.stroke()}
    x.fillStyle=cs.margin?CH.ok:CH.txt;x.font='700 10.5px '+FNT;
    x.textAlign='center';x.textBaseline='bottom';
    x.fillText(mln(cs.val)+(cs.margin?` (${pc(ord.mar/ord.rev)})`:''),bx+wbW/2,by-5);
    x.fillStyle=CH.lab;x.font='10px '+FNT;x.textBaseline='top';
    x.fillText(cs.name,bx+wbW/2,h-p.b+3);
  });
}

function drawModeResourceChain(g, ops, ord, isLogistics=false){
  const {c,x,w,h}=g;
  const targetOps = ops.filter(o => isLogistics ? (o.type==='movement'||o.type==='stock') : (o.type==='production'));

  if(!targetOps.length && !isLogistics){
    x.fillStyle=CH.axis;x.textAlign='center';x.font='13px '+FNT;
    x.fillText('Нет производственных операций в заказе', w/2, h/2);
    bind(c); return;
  }

  const chainNodes = [];
  targetOps.forEach(op => {
    const rsCandidates = isLogistics 
      ? [op.rs, op.pl, op.fr, op.to].filter(Boolean) 
      : [op.rs].filter(Boolean);
    rsCandidates.forEach(rsId => {
      const cap = CapacityRCA.getCap(rsId, op.pl, ord.p, ord.d) ||
                  (isLogistics ? CapacityRCA.getLogLimit(rsId, op.fr, op.to, op.pr || ord.prod, ord.p, ord.d) : null);
      const isLogRes = cap ? (cap.cat === 'warehouse' || cap.cat === 'loading' || cap.cat === 'unloading' || cap.cat === 'logistics' || cap.cat === 'route') : isLogistics;
      if(isLogistics !== isLogRes) return;

      const title = cap ? cap.rsName : (op.fr && op.to ? `${op.fr} → ${op.to}` : rsId);
      const key = cap ? cap.rs : (op.fr && op.to ? `${op.fr}_${op.to}` : rsId);
      if(chainNodes.some(n => n.key === key)) return;

      const isBlocked = cap ? (cap.avail === 0 || cap.isBlocked) : false;
      const hasExplicitLimit = Boolean(cap && (cap.avail > 0 || cap.isBlocked));
      const avail = hasExplicitLimit ? cap.avail : null;
      const load = cap && cap.load !== undefined ? cap.load : op.v;
      
      // Если лимита в res_loc_loc нет — маршрут не является узким местом
      let util = 0;
      let free = null;
      if(isBlocked){
        util = 1.0;
        free = 0;
      } else if(hasExplicitLimit && avail > 0){
        util = Math.min(1.0, load / avail);
        free = Math.max(0, avail - load);
      } else {
        util = 0.20; // Обычный открытый маршрут
        free = null;
      }

      const pl = cap ? (cap.pl || (cap.locFr ? `${cap.locFr} → ${cap.locTo}` : op.pl)) : (op.fr && op.to ? `${op.fr} → ${op.to}` : (op.pl || 'Сеть'));
      const resType = cap ? cap.resType : (isLogistics ? 'Логистическое плечо' : 'Производство');

      chainNodes.push({
        key,
        rs: key,
        title,
        pl,
        resType,
        avail,
        load,
        free,
        util,
        hasExplicitLimit,
        prodTarget: cap ? (cap.prodTarget || cap.prodRaw || op.pr || ord.prod) : (op.pr || ord.prod),
        isBlocked,
        isBottleneck: isBlocked || (hasExplicitLimit && util >= 0.90),
        op
      });
    });
  });

  // Добавление всех релевантных лимитов и блокировок из res_loc_loc и capacity_view_sp
  if(DS && DS.capacity){
    const bomProducts = CapacityRCA.getOrderBOMProducts(ord);
    const orderLocations = new Set([ord.loc, ...ops.flatMap(o => [o.pl, o.fr, o.to]).filter(Boolean)]);
    const targetDate = normalizePeriodKey(ord.d);

    const relatedLimits = DS.capacity.filter(c => {
      if(isLogistics){
        if(c.cat !== 'route' && c.cat !== 'logistics' && c.cat !== 'warehouse' && c.cat !== 'loading' && c.cat !== 'unloading') return false;
      } else {
        if(c.cat !== 'production') return false;
      }

      if(TREE_FOCUSED_KEY && (c.rs === TREE_FOCUSED_KEY || (c.rsName && c.rsName.includes(TREE_FOCUSED_KEY)))) return true;

      const dateMatch = c.isGlobal || !targetDate || !c.periodKey || (c.periodKey === targetDate) || (ord.p !== undefined && c.p === Number(ord.p));
      if(!dateMatch) return false;

      const prodMatch = !c.prodList || c.prodList.includes('all') || c.prodList.some(p => bomProducts.has(p)) || (c.prodTarget && bomProducts.has(c.prodTarget));
      const locMatch = !c.locToList || c.locToList.includes('all') || c.locToList.some(l => orderLocations.has(l)) ||
                       (c.locFrList && c.locFrList.some(l => orderLocations.has(l))) ||
                       (c.pl && orderLocations.has(c.pl));

      return (prodMatch && locMatch) && (c.avail === 0 || c.isBlocked || c.util >= 0.85);
    });

    relatedLimits.forEach(cap => {
      const key = cap.rs;
      if(!chainNodes.some(n => n.key === key)){
        const isBlocked = (cap.avail === 0 || cap.isBlocked);
        chainNodes.push({
          key,
          rs: key,
          title: cap.rsName || (cap.locFr && cap.locTo ? `${cap.locFr} → ${cap.locTo}` : cap.rs),
          pl: cap.locFr ? `${cap.locFr} → ${cap.locTo}` : (cap.pl || ord.loc),
          resType: cap.resType || (isBlocked ? 'Блокировка маршрута' : (isLogistics ? 'Лимит логистики' : 'Мощность цеха')),
          avail: cap.avail,
          load: cap.load,
          free: isBlocked ? 0 : cap.free,
          util: isBlocked ? 1.0 : cap.util,
          prodTarget: cap.prodTarget || cap.prodRaw || ord.prod,
          isBlocked,
          isBottleneck: isBlocked || cap.util >= 0.90,
          op: targetOps[0] || null
        });
      }
    });
  }

  if(!chainNodes.length){
    x.fillStyle=CH.axis;x.textAlign='center';x.font='13px '+FNT;
    x.fillText(isLogistics ? 'Данные по логистическим лимитам и маршрутам не найдены' : 'Данные по мощностям производства не найдены', w/2, h/2);
    bind(c); return;
  }

  // Отрисовка отдельной компактной адаптивной карточки
  const drawResCard = (node, bx, by, bw, bh) => {
    node.x = bx; node.y = by; node.w = bw; node.h = bh;
    const isBn = node.isBottleneck || node.isBlocked;
    const isHl = (TREE_FOCUSED_KEY === node.key);
    const uColor = node.isBlocked ? CH.err : (node.util >= 0.90 ? CH.err : (node.util >= 0.75 ? CH.warn : CH.ok));

    // Фон
    x.fillStyle = isHl ? (CH.brandBg || '#f1e0ff') : (node.isBlocked ? rgba(CH.err, 0.05) : CH.surf);
    drawBox(x, bx, by, bw, bh, 5);
    x.fill();

    // Обводка
    x.strokeStyle = isHl ? CH.brand : (node.isBlocked ? CH.err : (isBn ? rgba(CH.err, 0.7) : CH.line));
    x.lineWidth = isHl ? 2.2 : (node.isBlocked ? 1.5 : 1);
    x.stroke();

    // Индикатор слева
    x.fillStyle = uColor;
    x.fillRect(bx, by + 4, 3.5, bh - 8);

    // Заголовок карточки
    x.fillStyle = isHl ? CH.brand : (node.isBlocked ? CH.err : CH.txt);
    x.font = '700 11px ' + FNT;
    x.textAlign = 'left'; x.textBaseline = 'top';
    const maxChars = Math.max(8, Math.floor((bw - 72) / 6.6));
    const titleCrop = node.title.length > maxChars ? node.title.slice(0, maxChars - 1) + '…' : node.title;
    x.fillText(titleCrop, bx + 9, by + 6);

    // Статус / Процент
    x.font = '700 11px ' + FNT;
    x.fillStyle = node.hasExplicitLimit ? uColor : CH.ok;
    x.textAlign = 'right';
    x.fillText(node.isBlocked ? '⛔ БЛОК' : (node.hasExplicitLimit ? pc(node.util) : '✓ ОК'), bx + bw - 8, by + 6);

    // Подзаголовок
    x.fillStyle = CH.sub;
    x.font = '9.5px ' + FNT;
    x.textAlign = 'left';
    const subTxt = node.prodTarget ? `${node.pl} · SKU: ${node.prodTarget}` : `${node.pl} · ${node.resType}`;
    const maxSubChars = Math.max(10, Math.floor((bw - 18) / 6.2));
    const subCrop = subTxt.length > maxSubChars ? subTxt.slice(0, maxSubChars - 1) + '…' : subTxt;
    x.fillText(subCrop, bx + 9, by + 21);

    // Шкала загрузки
    const barX = bx + 9, barY = by + 36, barW = bw - 18, barH = 4.5;
    x.fillStyle = CH.dim || '#dedce5';
    drawBox(x, barX, barY, barW, barH, 2);
    x.fill();

    const fillW = node.isBlocked ? barW : (node.hasExplicitLimit ? Math.max(2, Math.min(barW, barW * node.util)) : barW);
    x.fillStyle = node.hasExplicitLimit ? uColor : CH.ok;
    drawBox(x, barX, barY, fillW, barH, 2);
    x.fill();

    // Значения
    x.fillStyle = node.isBlocked ? CH.err : CH.sub;
    x.font = '600 9px ' + FNT;
    x.textAlign = 'left';
    if(node.isBlocked){
      x.fillText(`Лимит: 0 т (запрет)`, bx + 9, by + 44);
    } else if(node.hasExplicitLimit){
      x.fillText(`${nf(node.load)} из ${nf(node.avail)} т`, bx + 9, by + 44);
    } else {
      x.fillText(`Объём: ${nf(node.load)} т`, bx + 9, by + 44);
    }

    x.textAlign = 'right';
    if(node.isBlocked){
      x.fillStyle = CH.err;
      x.fillText(`заблокировано`, bx + bw - 8, by + 44);
    } else if(node.hasExplicitLimit && (node.util >= 0.995 || node.free <= 0)){
      x.fillStyle = CH.err;
      x.fillText(`резерв: 0 т`, bx + bw - 8, by + 44);
    } else if(node.hasExplicitLimit && node.free > 0){
      x.fillStyle = CH.ok;
      x.fillText(`свободно ${nf(node.free)} т`, bx + bw - 8, by + 44);
    } else {
      x.fillStyle = CH.ok;
      x.fillText(`без ограничений`, bx + bw - 8, by + 44);
    }

    const tipFreeTxt = node.isBlocked ? '0 т (заблокировано)' 
      : (node.hasExplicitLimit ? (node.free <= 0 ? '0 т (резерв исчерпан)' : `${nf(node.free)} т`) : 'Не ограничено моделью');

    const tipLimitTxt = node.isBlocked ? '0 т (заблокировано)' 
      : (node.hasExplicitLimit ? `${nf(node.avail)} т` : 'Без ограничений (свободный маршрут)');

    const tip = `<b>${node.title}</b>`
      + `<br>Узел / Маршрут: <b>${node.pl}</b>`
      + (node.prodTarget ? `<br>Продуктовая маска: <b>${node.prodTarget}</b>` : '')
      + `<br>Вид ограничения: <b>${node.resType}</b>`
      + `<br>Лимит (мощность): <b>${tipLimitTxt}</b>`
      + `<br>Фактический объём перевозки: <b>${nf(node.load)} т</b>`
      + `<br>Свободный остаток: <b>${tipFreeTxt}</b>`
      + `<br>Статус: <b style="color:${node.hasExplicitLimit ? uColor : 'var(--scp-ok)'}">${node.isBlocked ? '100% (Блокировка)' : (node.hasExplicitLimit ? pc(node.util) : 'Маршрут открыт')}</b>`
      + (node.isBlocked ? `<br><span style="color:var(--scp-err);font-weight:700">⛔ Направление полностью заблокировано (res_loc_loc const=0)</span>` 
        : (node.isBottleneck ? `<br><span style="color:var(--scp-err);font-weight:700">🛑 Узкое место цепи (≥90%)</span>` : ''));

    reg(c, bx, by, bw, bh, tip, () => {
      TREE_FOCUSED_KEY = (TREE_FOCUSED_KEY === node.key) ? null : node.key;
      render();
    });
  };

  // ════════ РЕЖИМ 1: Группировка по площадкам (plants) ════════
  if(RES_LAYOUT_MODE === 'plants'){
    const p = {l: 16, r: 16, t: 20, b: 20};
    const plantMap = new Map();
    chainNodes.forEach(n => {
      let plKey = n.pl || 'Сеть';
      if(plKey.includes(' → ')){
        const parts = plKey.split(' → ');
        plKey = parts[0];
      }
      if(!plantMap.has(plKey)) plantMap.set(plKey, []);
      plantMap.get(plKey).push(n);
    });

    const plantGroups = [...plantMap.entries()].map(([pl, items]) => ({
      pl,
      items,
      hasBn: items.some(i => i.isBottleneck || i.isBlocked)
    })).sort((a,b) => a.pl.localeCompare(b.pl));

    const cardW = 230, cardH = 58, gap = 12;
    const availW = w - p.l - p.r;
    const maxCols = Math.max(1, Math.min(4, Math.floor((availW + gap) / (cardW + 16 + gap))));
    const actualColW = (availW - (maxCols - 1) * gap) / maxCols;

    let colHeights = new Array(maxCols).fill(p.t);

    plantGroups.forEach((plant) => {
      let targetCol = 0;
      for(let ci = 1; ci < maxCols; ci++){
        if(colHeights[ci] < colHeights[targetCol]) targetCol = ci;
      }

      const gx = p.l + targetCol * (actualColW + gap);
      const gy = colHeights[targetCol];
      const gH = plant.items.length * (cardH + 6) + 30;

      x.fillStyle = plant.hasBn ? rgba(CH.err, 0.04) : CH.pane;
      drawBox(x, gx, gy, actualColW, gH, 6);
      x.fill();
      x.strokeStyle = plant.hasBn ? rgba(CH.err, 0.3) : CH.line;
      x.lineWidth = 1;
      x.stroke();

      x.fillStyle = plant.hasBn ? CH.err : CH.txt;
      x.font = '700 11px ' + FNT;
      x.textAlign = 'left'; x.textBaseline = 'top';
      const grpIcon = plant.pl.startsWith('Vendor') ? '📦' : (plant.pl.startsWith('Port') ? '⚓' : (isLogistics ? '🚚' : '🏭'));
      x.fillText(`${grpIcon} ${plant.pl} (${plant.items.length})`, gx + 8, gy + 7);

      plant.items.forEach((node, rowIdx) => {
        const by = gy + 24 + rowIdx * (cardH + 6);
        drawResCard(node, gx + 6, by, actualColW - 12, cardH);
      });

      colHeights[targetCol] += gH + 10;
    });
  }

// ════════ РЕЖИМ 3: Адаптивная матрица мощностей (grid) ════════
  else if(RES_LAYOUT_MODE === 'grid'){
    const p = {l: 16, r: 16, t: 16, b: 16};
    const cardW = 230, cardH = 58, gap = 10;
    const availW = w - p.l - p.r;
    const numCols = Math.max(1, Math.min(5, Math.floor((availW + gap) / (cardW + gap))));
    const actCardW = (availW - (numCols - 1) * gap) / numCols;

    chainNodes.forEach((node, i) => {
      const col = i % numCols;
      const row = Math.floor(i / numCols);
      const bx = p.l + col * (actCardW + gap);
      const by = p.t + row * (cardH + gap);
      drawResCard(node, bx, by, actCardW, cardH);
    });
  }

  // ════════ РЕЖИМ 4: Фокус на узких местах и блокировках (focus) ════════
  else if(RES_LAYOUT_MODE === 'focus'){
    const p = {l: 20, r: 20, t: 16, b: 16};
    const bnNodes = chainNodes.filter(n => n.isBottleneck || n.isBlocked);
    const dispNodes = bnNodes.length ? bnNodes : chainNodes.slice().sort((a,b)=>b.util-a.util).slice(0, 4);

    x.fillStyle = CH.sub;
    x.font = '600 11px ' + FNT;
    x.textAlign = 'left'; x.textBaseline = 'top';
    x.fillText(`Сквозная цепочка: ${chainNodes.length} узлов/лимитов · Узких мест и блокировок: ${bnNodes.length}`, p.l, p.t);

    const pipeY = p.t + 20, pipeW = w - p.l - p.r;
    x.fillStyle = CH.pane;
    drawBox(x, p.l, pipeY, pipeW, 14, 4);
    x.fill();
    x.strokeStyle = CH.line;
    x.stroke();

    const segW = pipeW / Math.max(chainNodes.length, 1);
    chainNodes.forEach((node, idx) => {
      const sx = p.l + idx * segW;
      const uCol = node.isBlocked ? CH.err : (node.util >= 0.90 ? CH.err : (node.util >= 0.75 ? CH.warn : CH.ok));
      x.fillStyle = uCol;
      x.fillRect(sx + 1, pipeY + 2, Math.max(segW - 2, 2), 10);
      reg(c, sx, pipeY, segW, 14, `<b>${node.title}</b> (${node.pl})<br>Статус: <b>${node.isBlocked ? 'Заблокировано (0)' : pc(node.util)}</b>`, () => {
        TREE_FOCUSED_KEY = (TREE_FOCUSED_KEY === node.key) ? null : node.key;
        render();
      });
    });

    const cardH = 62;
    const availW = w - p.l - p.r;
    const numCols = Math.max(1, Math.min(dispNodes.length, 4));
    const cardW = Math.min((availW - (numCols - 1) * 12) / numCols, 260);
    const actGap = numCols > 1 ? (availW - numCols * cardW) / (numCols - 1) : 0;
    const startY = pipeY + 30;

    x.fillStyle = bnNodes.length ? CH.err : CH.ok;
    x.font = '700 11.5px ' + FNT;
    x.textAlign = 'left'; x.textBaseline = 'top';
    x.fillText(bnNodes.length ? '🛑 Критические ограничения и блокировки маршрутов:' : '✓ Все логистические лимиты в норме:', p.l, startY);

    dispNodes.forEach((node, i) => {
      const bx = p.l + i * (cardW + actGap);
      const by = startY + 20;
      drawResCard(node, bx, by, cardW, cardH);
    });
  }

  bind(c);
}

function tabTREE(){
  const orders=fOrders();
  if(!orders.length)return '<div class="empty">Нет доступных заказов под текущими фильтрами</div>';
  if(!SELECTED_ORDER_ID||!orders.some(o=>o.id===SELECTED_ORDER_ID))SELECTED_ORDER_ID=orders[0].id;
  const curOrd=orders.find(o=>o.id===SELECTED_ORDER_ID)||orders[0];
  const curOpsAll=DS.ops.filter(r=>r.o===curOrd.id);
  const effF=(TREE_VIEW_MODE==='waterfall'||TREE_VIEW_MODE==='prod_res'||TREE_VIEW_MODE==='log_res')?'all':TREE_OP_TYPE_FILTER;
  const curOps=(effF==='all')?curOpsAll:curOpsAll.filter(r=>r.type===effF);
  const cMv=curOpsAll.filter(o=>o.type==='movement').length;
  const cPd=curOpsAll.filter(o=>o.type==='production').length;
  const cPc=curOpsAll.filter(o=>o.type==='procurement').length;
  const cSt=curOpsAll.filter(o=>o.type==='stock').length;
  // Селект: первые 100 заказов + всегда выбранный (иначе drill-down на заказ вне топ-100
  // показывал бы в селекте первый пункт, а KPI и граф — другой заказ)
  const ordPool=orders.slice(0,100);
  if(curOrd&&!ordPool.some(o=>o.id===curOrd.id))ordPool.push(curOrd);
  const ordOptions=ordPool.slice().sort((a,b)=>a.id-b.id).map(o=>
    `<option value="${o.id}" ${o.id===curOrd.id?'selected':''}>Заказ №${o.id} | ${o.prod} | ${o.cl} | P${o.p} | маржа ${mln(o.mar)}</option>`).join('');
  const K=[
    ['Выбранный заказ',`№${curOrd.id} · ${curOrd.prod}`,curOrd.cl,''],
    ['Объём отгрузки',`${nf(curOrd.sal,1)} т`,`Спрос ${nf(curOrd.dem)} т, SL ${pc(curOrd.sal/curOrd.dem)}`,''],
    ['Себестоимость заказа',mln(curOrd.cost)+' ₽',`${nf(curOrd.cpt)} ₽/т`,''],
    ['Маржа заказа',mln(curOrd.mar)+' ₽',`Рентабельность ${pc(curOrd.mar/curOrd.rev)}`,''],
    ['Режим',TREE_VIEW_MODE==='prod_res'?'Мощности производства':TREE_VIEW_MODE==='log_res'?'Мощности логистики':(TREE_VIEW_MODE==='waterfall'?'Потоки и водопад':(TREE_METRIC_MODE==='cost'?'Себестоимость, ₽':'Физический объём, т')),`Операций: ${curOps.length}`,''],
    ['Выпускающих заводов',nf(uq(curOpsAll.filter(o=>o.type==='production'&&o.pr===curOrd.prod),o=>o.pl).length),'основной передел',''],
    ['Поставщиков сырья',nf(uq(curOpsAll.filter(o=>o.type==='procurement'),o=>o.vd).length),'внешние закупки','']
  ];
  const isCustomMode = (TREE_VIEW_MODE==='prod_res' || TREE_VIEW_MODE==='log_res');
  let tableOps=[...curOps], focusTitle=null;
  let capacityTableRows = [];

  if(isCustomMode && DS && DS.capacity){
    const isLog = (TREE_VIEW_MODE==='log_res');
    const bomProducts = CapacityRCA.getOrderBOMProducts(curOrd);
    const orderLocations = new Set([curOrd.loc, ...curOpsAll.flatMap(o => [o.pl, o.fr, o.to]).filter(Boolean)]);
    const targetDate = normalizePeriodKey(curOrd.d);

    capacityTableRows = DS.capacity.filter(c => {
      if(isLog){
        if(c.cat !== 'route' && c.cat !== 'logistics' && c.cat !== 'warehouse' && c.cat !== 'loading' && c.cat !== 'unloading') return false;
      } else {
        if(c.cat !== 'production') return false;
      }

      if(TREE_FOCUSED_KEY && (c.rs === TREE_FOCUSED_KEY || (c.rsName && c.rsName.includes(TREE_FOCUSED_KEY)))) return true;

      const dateMatch = c.isGlobal || !targetDate || !c.periodKey || (c.periodKey === targetDate) || (curOrd.p !== undefined && c.p === Number(curOrd.p));
      if(!dateMatch) return false;

      const prodMatch = !c.prodList || c.prodList.includes('all') || c.prodList.some(p => bomProducts.has(p)) || (c.prodTarget && bomProducts.has(c.prodTarget));
      const locMatch = !c.locToList || c.locToList.includes('all') || c.locToList.some(l => orderLocations.has(l)) ||
                       (c.locFrList && c.locFrList.some(l => orderLocations.has(l))) ||
                       (c.pl && orderLocations.has(c.pl));

      return (prodMatch && locMatch);
    });

    if(TREE_FOCUSED_KEY){
      const fk = TREE_FOCUSED_KEY;
      const match = capacityTableRows.find(c => c.rs === fk || (c.rsName && c.rsName.includes(fk)));
      focusTitle = match ? `${match.rsName} (${match.rs})` : fk;
    }
  } else if(TREE_FOCUSED_KEY){
    const fk=TREE_FOCUSED_KEY;
    if(fk.startsWith('VD_')||fk.startsWith('SW_VD_')){
      const vd=fk.replace(/^(VD_|SW_VD_)/,'');
      if(vd==='OTHER'){
        const all=grp(curOpsAll.filter(o=>o.type==='procurement'),o=>o.vd,v=>({c:S(v,z=>z.cost)})).sort((a,b)=>b.c-a.c);
        const top5=new Set(all.slice(0,5).map(z=>z.k));
        tableOps=curOps.filter(o=>o.type==='procurement'&&!top5.has(o.vd));
        focusTitle='Прочие поставщики сырья';
      }else{tableOps=curOps.filter(o=>o.vd===vd||o.fr===vd);focusTitle='Поставщик: '+vd}
    }else if(fk==='ROOT'||fk==='SW_ROOT'){
      tableOps=curOps.filter(o=>o.oid==='A'||o.tm==='LASTMILE'||(o.type==='production'&&o.pr===curOrd.prod));
      focusTitle='Финальная отгрузка · '+curOrd.prod;
    }else if(fk.startsWith('STAGE2_')||fk.startsWith('SW_FIN_')){
      tableOps=curOps.filter(o=>o.type==='production'&&o.pr===curOrd.prod);
      focusTitle='Финишный передел · '+curOrd.prod;
    }else if(fk==='SEMI_OTHER'){
      const all=grp(curOpsAll.filter(o=>o.type==='production'&&o.pr!==curOrd.prod),
        o=>(o.pl||'Plant')+'·'+o.pr,v=>({c:S(v,z=>z.cost)})).sort((a,b)=>b.c-a.c);
      const top5=new Set(all.slice(0,5).map(z=>z.k));
      tableOps=curOps.filter(o=>o.type==='production'&&o.pr!==curOrd.prod&&!top5.has((o.pl||'Plant')+'·'+o.pr));
      focusTitle='Прочие заготовки и полуфабрикаты';
    }else if(fk.startsWith('SEMI_')){
      const parts=fk.replace('SEMI_','').split('_');
      tableOps=curOps.filter(o=>o.pl===parts[0]&&o.pr===parts[1]);
      focusTitle=`Полуфабрикат: ${parts[0]} · ${parts[1]}`;
    }else if(curOps.some(o=>o.rs===fk)){
      tableOps=curOps.filter(o=>o.rs===fk);
      focusTitle='Ресурс: '+fk;
    }else if(curOps.some(o=>o.pl===fk || o.fr===fk || o.to===fk)){
      tableOps=curOps.filter(o=>o.pl===fk || o.fr===fk || o.to===fk);
      focusTitle='Узел сети: '+fk;
    }else if(fk.includes('Plant_') || fk.includes('Port_') || fk.includes('Dispatch_')){
      const m=fk.match(/(Plant_\d+|Port_\d+|Dispatch_[A-Z0-9_]+)/i);
      if(m){
        tableOps=curOps.filter(o=>o.pl===m[0]||o.fr===m[0]||o.to===m[0]);
        focusTitle='Узел: '+m[0];
      }
    }else{
      const mo=curOps.filter(o=>o.oid&&(o.oid===fk||o.oid.startsWith(fk+'.')||fk.startsWith(o.oid+'.')));
      if(mo.length){tableOps=mo;focusTitle='Узел BOM: '+fk}
    }
  }

  const html=`
  <div class="card w" style="margin-bottom:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 18px">
    <div style="font-weight:600;font-size:14px">Заказ спроса для разузлования цепочки</div>
    <select id="treeOrderSelect" style="flex:1;min-width:320px;max-width:680px">${ordOptions}</select>
    ${TREE_FOCUSED_KEY?`<button class="btn d" id="treeResetFocus">Сбросить выбор узла</button>`:''}
  </div>
  <div class="kpis">${K.map(k=>`<div class="kpi"><div class="t">${k[0]}</div><div class="v ${k[3]}">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
  <div class="card w">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:12px">
      <div>
        <h3>${TREE_VIEW_MODE==='prod_res'?'Цепочка производственных мощностей заказа №'+curOrd.id:TREE_VIEW_MODE==='log_res'?'Цепочка логистических мощностей заказа №'+curOrd.id:'Сквозная цепочка пополнения заказа №'+curOrd.id}</h3>
        <div class="sub" style="margin-bottom:0">${isCustomMode?'Сквозная визуализация загрузки мощностей от норматива. Клик по ресурсу фильтрует реестр мощностей внизу.'
          :(TREE_METRIC_MODE==='cost'&&TREE_VIEW_MODE!=='waterfall'
          ?'Режим себестоимости: на узлах отображены затраты в млн ₽ и доля в полной себестоимости заказа. Клик по узлу фильтрует таблицу внизу.'
          :'Клик по узлу подсвечивает цепочку и фильтрует детальный реестр шагов внизу.')}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${(!isCustomMode && TREE_VIEW_MODE!=='waterfall')?`
        <div class="seg">
          <button class="btn ${TREE_METRIC_MODE==='vol'?'p':''}" id="treeUnitVol">Тонны</button>
          <button class="btn ${TREE_METRIC_MODE==='cost'?'p':''}" id="treeUnitCost">Себестоимость</button>
        </div>`:''}
        <div class="seg">
          <button class="btn ${TREE_VIEW_MODE==='stages'?'p':''}" id="vmStages">Этапы цепи</button>
          <button class="btn ${TREE_VIEW_MODE==='swimlanes'?'p':''}" id="vmSwim">Дорожки заводов</button>
          <button class="btn ${TREE_VIEW_MODE==='bom'?'p':''}" id="vmBOM">Дерево BOM</button>
          <button class="btn ${TREE_VIEW_MODE==='waterfall'?'p':''}" id="vmWf">Потоки и водопад</button>
          <button class="btn ${TREE_VIEW_MODE==='prod_res'?'p':''}" id="vmProdRes">🏭 Мощности цехов</button>
          <button class="btn ${TREE_VIEW_MODE==='log_res'?'p':''}" id="vmLogRes">📦 Мощности складов</button>
        </div>
        ${isCustomMode?`
        <div class="seg" style="margin-left:4px">
          <button class="btn ${RES_LAYOUT_MODE==='plants'?'p':''}" id="rlPlants" data-tip="По площадкам (группировка по заводам и складам)" style="font-size:12px;padding:5px 8px">🏭 Площадки</button>
          <button class="btn ${RES_LAYOUT_MODE==='grid'?'p':''}" id="rlGrid" data-tip="Сетка карточек с автопереносом" style="font-size:12px;padding:5px 8px">⊞ Сетка</button>
          <button class="btn ${RES_LAYOUT_MODE==='focus'?'p':''}" id="rlFocus" data-tip="Фокус на узких местах и блокировках (≥90% / const=0)" style="font-size:12px;padding:5px 8px">🛑 Фокус</button>
        </div>`:''}
        ${TREE_VIEW_MODE==='bom'?`
        <div class="tbar">
          <span class="tbar-lbl">Свернуть до</span>
          <input type="number" id="bomCustomInput" min="0" max="100" step="0.5" value="${BOM_AGG_THRESHOLD_PCT}"
            style="background:var(--scp-surface);color:var(--scp-text);border:1px solid var(--scp-ctrl);border-radius:4px;padding:5px 7px;width:62px;font-size:12.5px;text-align:center">
          <span style="font-size:12px;color:var(--scp-text-3)">%</span>
          <button class="chip ${BOM_AGG_THRESHOLD_PCT===0?'on':''}" id="btnP0">0</button>
          <button class="chip ${BOM_AGG_THRESHOLD_PCT===1?'on':''}" id="btnP1">1</button>
          <button class="chip ${BOM_AGG_THRESHOLD_PCT===5?'on':''}" id="btnP5">5</button>
          <button class="chip ${BOM_AGG_THRESHOLD_PCT===15?'on':''}" id="btnP15">15</button>
          <button class="chip ${BOM_AGG_THRESHOLD_PCT===30?'on':''}" id="btnP30">30</button>
        </div>`:''}
      </div>
    </div>
    ${(!isCustomMode && TREE_VIEW_MODE!=='waterfall')?`
    <div class="tbar" style="margin-bottom:12px">
      <span class="tbar-lbl">Тип операций</span>
      <button class="chip ${TREE_OP_TYPE_FILTER==='all'?'on':''}" id="fltOpAll">Все операции (${curOpsAll.length})</button>
      <button class="chip ${TREE_OP_TYPE_FILTER==='production'?'on':''}" id="fltOpPd"><i style="background:${CH.d3}"></i>Производство (${cPd})</button>
      <button class="chip ${TREE_OP_TYPE_FILTER==='movement'?'on':''}" id="fltOpMv"><i style="background:${CH.d1}"></i>Перемещение (${cMv})</button>
      <button class="chip ${TREE_OP_TYPE_FILTER==='procurement'?'on':''}" id="fltOpPc"><i style="background:${CH.d4}"></i>Закупки сырья (${cPc})</button>
      ${cSt>0?`<button class="chip ${TREE_OP_TYPE_FILTER==='stock'?'on':''}" id="fltOpSt"><i style="background:${CH.d6}"></i>Хранение (${cSt})</button>`:''}
    </div>`:''}
    <canvas id="treeCanvas" height="480"></canvas>
  </div>
  <div class="card w" style="margin-top:12px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
      <div>
        <h3>${isCustomMode ? 'Реестр мощностей и ограничений заказа №'+curOrd.id : 'Детальный реестр шагов пополнения заказа №'+curOrd.id}</h3>
        <div class="sub">Показано строк: <b>${isCustomMode ? capacityTableRows.length : tableOps.length}</b>${focusTitle
          ?` | <span style="color:var(--scp-accent);font-weight:600">Фильтр по ресурсу: ${focusTitle}</span>`
          :` (режим: ${isCustomMode ? (TREE_VIEW_MODE==='prod_res'?'Производственные мощности':'Логистические лимиты и маршруты') : (effF==='all'?'все':effF)})`}</div>
      </div>
      ${TREE_FOCUSED_KEY?`<button class="chip rm" id="tblResetFocus">Сбросить фильтр по узлу</button>`:''}
    </div>
    <div id="treeTbl" style="margin-top:8px"></div>
  </div>`;

  setTimeout(()=>{
    if(isCustomMode){
      dtable('#treeTbl',[
        {k:'pl',t:'Локация / Направление',left:1,flt:1},
        {k:'rsName',t:'Ресурс / Маршрут',left:1,flt:1},
        {k:'resType',t:'Тип ограничения',left:1,flt:1},
        {k:'prodTarget',t:'Маска продукта',left:1,flt:1,f:v=>v||'Все SKU'},
        {k:'periodKey',t:'Период',left:1,flt:1,f:(v,r)=>r.isGlobal?'Глобальный':(v||'P'+r.p)},
        {k:'avail',t:'Лимит (const)',num:1,f:(v,r)=>r.isBlocked?'0 т (заблокировано)':nf(v)+' т',cls:v=>v===0?'neg':''},
        {k:'load',t:'План загрузки',num:1,f:v=>nf(v)+' т'},
        {k:'free',t:'Свободный остаток',num:1,f:(v,r)=>r.isBlocked?'0 т':nf(v)+' т',cls:v=>v===0?'neg':'pos'},
        {k:'util',t:'Загрузка %',num:1,f:(v,r)=>r.isBlocked?'⛔ 100%':pc(v),cls:(v,r)=>r.isBlocked||v>=1.0?'neg':v>=0.9?'mid':'pos'}
      ],capacityTableRows,{key:'tree_cap_table',sort:'util',dir:'desc',h:310,csv:1,name:'order_limits_'+curOrd.id});
    } else {
      dtable('#treeTbl',[
        {k:'oid',t:'ID операции',left:1,flt:1,f:v=>v?`<code>${esc(v)}</code>`:'—'},
        {k:'dp',t:'Уровень',num:1,flt:1,f:v=>`<span class="tag">Ур. ${v||1}</span>`},
        {k:'type',t:'Тип',flt:1,left:1,f:v=>`<span style="color:${
          v==='production'?CH.d3:v==='movement'?CH.d1:v==='procurement'?CH.d4:CH.d6
        };font-weight:600">${v}</span>`},
        {k:'pr',t:'Материал',left:1,flt:1,f:v=>`<b>${esc(v)}</b>`},
        {k:'pl',t:'Площадка',left:1,flt:1},
        {k:'rs',t:'Ресурс',left:1,flt:1},
        {k:'route',t:'Маршрут',left:1,flt:1,v:r=>r.fr?`${r.fr} → ${r.to} (${r.tm||'плечо'})`:''},
        {k:'vd',t:'Поставщик',left:1,flt:1},
        {k:'v',t:'Объём, т',num:1,f:v=>nf(v,2)},
        {k:'r',t:'Тариф ₽/т',num:1,f:(v,r0)=>r0.stub?'0 ₽':nf(v)},
        {k:'cost',t:'Затраты',num:1,f:v=>v?`<b>${mln(v)} ₽</b>`:'—'},
        {k:'share',t:'Доля в с/с',num:1,v:r=>curOrd.cost?(r.cost||0)/curOrd.cost:0,f:v=>v?pc(v):'—'}
      ],tableOps,{key:'tree_ops',sort:'dp',dir:'desc',h:310,csv:1,name:'chain_'+curOrd.id});
    }

    $('#treeOrderSelect').onchange=e=>{SELECTED_ORDER_ID=+e.target.value;TREE_FOCUSED_KEY=null;render()};
    if($('#treeResetFocus'))$('#treeResetFocus').onclick=()=>{TREE_FOCUSED_KEY=null;render()};
    if($('#tblResetFocus'))$('#tblResetFocus').onclick=()=>{TREE_FOCUSED_KEY=null;render()};
    if($('#treeUnitVol'))$('#treeUnitVol').onclick=()=>{TREE_METRIC_MODE='vol';render()};
    if($('#treeUnitCost'))$('#treeUnitCost').onclick=()=>{TREE_METRIC_MODE='cost';render()};
    $('#vmStages').onclick=()=>{TREE_VIEW_MODE='stages';TREE_FOCUSED_KEY=null;render()};
    $('#vmSwim').onclick=()=>{TREE_VIEW_MODE='swimlanes';TREE_FOCUSED_KEY=null;render()};
    $('#vmBOM').onclick=()=>{TREE_VIEW_MODE='bom';TREE_FOCUSED_KEY=null;render()};
    $('#vmWf').onclick=()=>{TREE_VIEW_MODE='waterfall';TREE_OP_TYPE_FILTER='all';TREE_FOCUSED_KEY=null;render()};
    $('#vmProdRes').onclick=()=>{TREE_VIEW_MODE='prod_res';TREE_OP_TYPE_FILTER='all';TREE_FOCUSED_KEY=null;render()};
    $('#vmLogRes').onclick=()=>{TREE_VIEW_MODE='log_res';TREE_OP_TYPE_FILTER='all';TREE_FOCUSED_KEY=null;render()};
    if($('#rlPlants'))$('#rlPlants').onclick=()=>{RES_LAYOUT_MODE='plants';render()};
    if($('#rlGrid'))$('#rlGrid').onclick=()=>{RES_LAYOUT_MODE='grid';render()};
    if($('#rlFocus'))$('#rlFocus').onclick=()=>{RES_LAYOUT_MODE='focus';render()};
    const setOp=t=>{TREE_OP_TYPE_FILTER=t;TREE_FOCUSED_KEY=null;render()};
    if($('#fltOpAll'))$('#fltOpAll').onclick=()=>setOp('all');
    if($('#fltOpPd'))$('#fltOpPd').onclick=()=>setOp('production');
    if($('#fltOpMv'))$('#fltOpMv').onclick=()=>setOp('movement');
    if($('#fltOpPc'))$('#fltOpPc').onclick=()=>setOp('procurement');
    if($('#fltOpSt'))$('#fltOpSt').onclick=()=>setOp('stock');
    const inp=$('#bomCustomInput');
    if(inp){
      const apply=v=>{if(isNaN(v)||v<0)v=0;if(v>100)v=100;BOM_AGG_THRESHOLD_PCT=v;render()};
      inp.oninput=e=>apply(parseFloat(e.target.value));
      inp.onchange=e=>apply(parseFloat(e.target.value));
      [['#btnP0',0],['#btnP1',1],['#btnP5',5],['#btnP15',15],['#btnP30',30]]
        .forEach(([sel,v])=>{if($(sel))$(sel).onclick=()=>apply(v)});
    }
    let reqH=480;
    if(TREE_VIEW_MODE==='prod_res'||TREE_VIEW_MODE==='log_res'){
      const isLog = (TREE_VIEW_MODE==='log_res');
      const targetOps = curOpsAll.filter(o => isLog ? (o.type==='movement'||o.type==='stock') : (o.type==='production'));
      
      let nRes = uq(targetOps, o=>o.rs||o.pl).length || 4;
      if(isLog && DS && DS.capacity){
        const orderProducts = new Set([curOrd.prod, ...curOpsAll.map(o => o.pr).filter(Boolean)]);
        const orderLocations = new Set([curOrd.loc, ...curOpsAll.flatMap(o => [o.pl, o.fr, o.to]).filter(Boolean)]);
        const addLimits = DS.capacity.filter(c => (c.cat==='route'||c.cat==='logistics') && 
          (!c.prodList || c.prodList.includes('all') || c.prodList.some(p=>orderProducts.has(p))) &&
          (!c.locToList || c.locToList.includes('all') || c.locToList.some(l=>orderLocations.has(l)))
        );
        nRes += addLimits.length;
      }

      if(RES_LAYOUT_MODE === 'grid'){
        const cols = Math.max(1, Math.min(4, Math.floor(800 / 230)));
        const rows = Math.ceil(nRes / cols);
        reqH = Math.max(200, rows * 68 + 40);
      } else if(RES_LAYOUT_MODE === 'plants'){
        const cols = Math.max(1, Math.min(3, Math.floor(800 / 240)));
        const groupsEstimate = Math.ceil(nRes / 1.8);
        const rowsPerCol = Math.ceil(groupsEstimate / cols);
        reqH = Math.max(220, rowsPerCol * 110 + 50);
      } else {
        reqH = 190;
      }
    }else if(TREE_VIEW_MODE==='swimlanes'||TREE_VIEW_MODE==='stages'){
      const nP=uq(curOpsAll.filter(o=>o.type==='production'),o=>o.pl).length;
      const nV=uq(curOpsAll.filter(o=>o.type==='procurement'),o=>o.vd).length;
      const nS=uq(curOpsAll.filter(o=>o.type==='production'&&o.pr!==curOrd.prod),o=>o.pr).length;
      reqH=Math.max(480,Math.min(920,240+Math.max(nP,Math.min(nV,6),nS,5)*44));
    }
    const g=cv('#treeCanvas',H('#treeCanvas',reqH,0.48,200,1200));
    if(g){
      if(TREE_VIEW_MODE==='stages')drawModeStages(g,curOpsAll,curOrd);
      else if(TREE_VIEW_MODE==='swimlanes')drawModeSwimlanes(g,curOpsAll,curOrd);
      else if(TREE_VIEW_MODE==='bom')drawModeBOMTree(g,curOpsAll,curOrd);
      else if(TREE_VIEW_MODE==='prod_res')drawModeResourceChain(g,curOpsAll,curOrd,false);
      else if(TREE_VIEW_MODE==='log_res')drawModeResourceChain(g,curOpsAll,curOrd,true);
      else drawModeWaterfall(g,curOpsAll,curOrd);
      bind(g.c);
    }
  },0);

  return html+summary(`Резюме цепочки: заказ №${curOrd.id}`,[
    {t:'Анализ сквозного потока и структуры себестоимости',i:[
      `Переключайтесь между режимами <span class="h">«Тонны»</span> и <span class="h">«Себестоимость»</span>, чтобы увидеть, на каких переделах и закупках накапливается основная масса затрат.`,
      `В денежном режиме карточки узлов выводят сумму в млн ₽ и долю в общей себестоимости заказа (${mln(curOrd.cost)} ₽), внизу — сводный мост затрат.`,
      `Режим «Потоки и водопад» показывает трансформацию объёмов и путь от выручки ${mln(curOrd.rev)} ₽ через все статьи затрат до маржи ${mln(curOrd.mar)} ₽.`
    ]}
  ]);
}

/* ═══════════════ 16. ЗАГРУЗКА XLSX ═══════════════ */
const COL={
  p:['Период спроса'],dt:['marking_demand_optimizer_periods_link_start_date'],
  loc:['Локация спроса'],prod:['Продукт спроса'],cl:['Клиент спроса'],
  dem:['План спроса'],sal:['План продаж'],unm:['Неудовлетворенный спрос','Неудовлетворённый спрос'],
  price:['Цена за тонну'],cpt:['Cебестоимость на тонну','Себестоимость на тонну'],
  mpt:['Маржинальность на тонну'],rev:['Валовая выручка (план продаж)'],
  cost:['Суммарная себестоимость'],mar:['Валовая маржа (план продаж), руб'],
  id:['order_id'],prio:['margin_per_hour'],
  pl:['Локация производства'],rt:['Источник поставки'],oprod:['Продукт производства'],
  rs:['Ресурс'],v:['Размеченный объем операции'],r:['Затраты на тонну'],
  fr:['Локация откуда'],to:['Локация куда'],tm:['Тип транспорта'],
  vd:['Поставщик'],type:['Тип операции'],oid:['order_operation_id'],
  rc:['resource_consumption_operation'],run:['run_id'],cfg:['config_id'],dsid:['dataset_id']
};
function pick(row,keys){for(const k of keys)if(row[k]!==undefined&&row[k]!==null&&row[k]!=='')return row[k];return undefined}
/* num и pnum — в assets/inplan-common.js */
const str=v=>v===undefined||v===null?'':String(v).trim();
/* Ключ периода YYYY-MM из даты любого вида — единая точка разбора дат (fmtDate делегирует сюда).
   Русская выгрузка — DD.MM.YYYY (месяц — вторая группа), английская — MM/DD/YYYY (однозначно,
   когда вторая группа не может быть месяцем, >12), ISO — YYYY-MM-DD, Excel — серийный номер. */
function normalizePeriodKey(val){
  if(val===undefined||val===null||val==='')return '';
  if(val instanceof Date)return val.getUTCFullYear()+'-'+String(val.getUTCMonth()+1).padStart(2,'0');
  if(typeof val==='number'){
    if(!isFinite(val))return '';
    const d=new Date(Date.UTC(1899,11,30)+val*864e5);
    return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');
  }
  const s=String(val).trim();
  if(!s)return '';
  let m=s.match(/^(\d{4})-(\d{1,2})/);            // ISO: 2026-04 / 2026-04-15
  if(m)return m[1]+'-'+m[2].padStart(2,'0');
  m=s.match(/^(\d{4})(\d{2})$/);                  // 202604
  if(m)return m[1]+'-'+m[2];
  m=s.match(/^(\d{1,2})[\/\.](\d{1,2})[\/\.](\d{4})/); // 01.04.2026 | 03/15/2026
  if(m){
    const a=+m[1],b=+m[2],y=m[3];
    // Месяц — вторая группа (DD.MM.YYYY, русская традиция); переворот только если вторая > 12
    const mo=b>12?a:b;
    return y+'-'+String(mo).padStart(2,'0');
  }
  return s.slice(0,7);
}
function fmtDate(v){return normalizePeriodKey(v)||''}
function parseRows(rows,fileName){
  if(!rows.length)throw new Error('Лист пуст');
  const first=rows[0];
  if(pick(first,COL.id)===undefined||pick(first,COL.sal)===undefined)
    throw new Error('Не найдены обязательные столбцы «order_id» и «План продаж». Проверьте, что выбран лист marking_demand.');
  const T2={movement:'mv',production:'pd',procurement:'pc',stock:'st'};
  const seenOrd=new Set(),orders=[],ops=[],seenOp=new Set();
  let runId='',cfg='',dsid='',skippedOps=0;
  rows.forEach(rw=>{
    const id=num(pick(rw,COL.id));if(!id)return;
    runId=runId||str(pick(rw,COL.run));cfg=cfg||str(pick(rw,COL.cfg));dsid=dsid||str(pick(rw,COL.dsid));
    if(!seenOrd.has(id)){
      seenOrd.add(id);
      const price=num(pick(rw,COL.price)),sal=num(pick(rw,COL.sal));
      let rev=num(pick(rw,COL.rev));if(!rev)rev=sal*price;
      let cost=Math.abs(num(pick(rw,COL.cost)));
      let mar=num(pick(rw,COL.mar));if(!mar)mar=rev-cost;
      orders.push({id,p:pnum(pick(rw,COL.p)),d:fmtDate(pick(rw,COL.dt)),
        loc:str(pick(rw,COL.loc)),prod:str(pick(rw,COL.prod)),cl:str(pick(rw,COL.cl))||'—',
        dem:num(pick(rw,COL.dem)),sal,unm:num(pick(rw,COL.unm)),price,
        cpt:Math.abs(num(pick(rw,COL.cpt))),mpt:num(pick(rw,COL.mpt)),
        rev,cost,mar,pr:num(pick(rw,COL.prio))||2});
    }
    const t=T2[str(pick(rw,COL.type)).toLowerCase()];
    if(!t){skippedOps++;return} // неизвестный тип — строка не теряется молча, а попадёт в отчёт загрузки
    const oid=str(pick(rw,COL.oid)),rs=str(pick(rw,COL.rs));
    const key=id+'|'+oid+'|'+rs;if(seenOp.has(key))return;seenOp.add(key);
    ops.push({o:id,p:pnum(pick(rw,COL.p)),d:fmtDate(pick(rw,COL.dt)),t,
      pl:str(pick(rw,COL.pl)),pr:str(pick(rw,COL.oprod)),rs:(t==='mv'?'':rs),
      fr:str(pick(rw,COL.fr)),to:str(pick(rw,COL.to)),tm:str(pick(rw,COL.tm)),
      v:num(pick(rw,COL.v)),r:Math.abs(num(pick(rw,COL.r))),
      vd:str(pick(rw,COL.vd)),rt:str(pick(rw,COL.rt)),
      oid,dp:oid?oid.split('.').length:1,rc:num(pick(rw,COL.rc))||undefined});
  });
  if(!orders.length)throw new Error('Не удалось распознать ни одного заказа');
  const nm=fileName.replace(/\.(xlsx|xls)$/i,'')+(runId?` | run ${runId}`:'')+(cfg?` | cfg ${cfg}`:'');
  return {name:nm,orders,ops,skippedOps};
}

/* ═══════════════ 16.1. ТОЧНЫЙ ПАРСЕР capacity_view_sp ═══════════════ */
/* normalizePeriodKey определён выше, у парсера marking_demand — единая точка разбора дат. */

function parseCapacityRows(rawRows){
  if(!rawRows || !rawRows.length) return [];

  const cleanKey = k => String(k||'').toLowerCase().replace(/[\s_\-\.\(\)\/\\№,]/g, '');

  return rawRows.map((rawObj, idx) => {
    const normMap = new Map();
    const rawKeys = Object.keys(rawObj);
    rawKeys.forEach(k => normMap.set(cleanKey(k), rawObj[k]));

    const pickExact = (patterns) => {
      for(const p of patterns){
        const cp = cleanKey(p);
        if(normMap.has(cp)){
          const v = normMap.get(cp);
          if(v !== undefined && v !== null && v !== '') return v;
        }
      }
      return '';
    };

    // 1. Идентификатор ресурса и локация
    let rs = str(pickExact(['Ресурс: системный код', 'Resource: System Code', 'Resource_ID', 'Resource', 'WorkCenter', 'rs']));
    if(!rs){
      for(const k of rawKeys){
        const sVal = str(rawObj[k]);
        if(/RES_|Plant_.*_RES|Port_.*_RES/i.test(sVal)){ rs = sVal; break; }
      }
      if(!rs) rs = str(rawObj[rawKeys[0]] || `RES_${idx+1}`);
    }

    let pl = str(pickExact(['Локация: системный код', 'Plant_ID', 'Plant', 'Локация', 'Завод', 'pl']));
    if(!pl){
      const m = rs.match(/(Plant_\d+|Port_\d+)/i);
      if(m) pl = m[0];
    }

    // 2. Тип ресурса и наименование
    const resType = str(pickExact(['Вид ресурса: наименование', 'Вид ресурса', 'Resource_Type', 'Type'])) || 'Ресурс';
    let rsName = str(pickExact(['Наименование ресурса', 'Resource_Name', 'WorkCenter_Name', 'Ресурс'])) || rs;

    // Определение категории ресурса: Склад, Погрузка, Разгрузка или Производство
    const rtLow = resType.toLowerCase();
    let cat = 'production';
    if(rtLow.includes('склад') || rtLow.includes('хране')) cat = 'warehouse';
    else if(rtLow.includes('погруз')) cat = 'loading';
    else if(rtLow.includes('разгруз')) cat = 'unloading';
    else if(rtLow.includes('порт') || rtLow.includes('терминал') || rtLow.includes('транспорт')) cat = 'logistics';

    // 3. Период (ключ YYYY-MM и исходный номер)
    const rawPeriod = pickExact(['Период: наименование', 'Дата', 'Period', 'Date', 'Период', 'Ид периода', 'p']);
    const periodKey = normalizePeriodKey(rawPeriod) || normalizePeriodKey(pickExact(['Дата', 'Date']));
    const pNum = pnum(rawPeriod); // «P11» -> 11, а не 0

    // 4. Мощности из capacity_view_sp:
    let avail = num(pickExact(['Доступная мощность (итог)', 'Доступная мощность', 'Available_Capacity', 'ФРВ доступный (расчет)', 'Max_Capacity', 'avail']));
    let norm = num(pickExact(['ФРВ Номинальный', 'ФРВ Календарный', 'Norm_Capacity', 'Standard_Capacity', 'norm'])) || avail;
    if(!avail && norm) avail = norm;

    // Загрузка: приоритет колонок зависит от категории ресурса.
    // Для производственных ресурсов — производственная колонка; для складов, погрузки,
    // разгрузки и маршрутов — общая плановая загрузка и загрузка склада. Раньше производственная
    // колонка (всегда 0 у Погрузки/Разгрузки) шла первой, и реальная загрузка, например
    // 20 000 из 27 000 т у Plant_33_RES_174, терялась — ресурс показывался как 0%.
    const loadCols = (cat === 'production')
      ? ['План загрузки мощности производства',
         'План загрузки мощности склада',
         'Общая плановая загрузка мощности',
         'inipcapaplannedusage',
         'Plan_Load',
         'Used_Capacity',
         'load']
      : ['Общая плановая загрузка мощности',
         'План загрузки мощности склада',
         'inipcapaplannedusage',
         'План загрузки мощности производства',
         'Plan_Load',
         'Used_Capacity',
         'load'];
    let load = num(pickExact(loadCols));

    // Точный расчет утилизации: математический приоритет load / avail
    let util = 0;
    if(avail > 0 && load > 0){
      util = Math.min(1.0, load / avail);
    } else if(avail > 0){
      let rawUtilPct = pickExact(['Загрузка ресурса', 'Загрузка ресурса, %', 'Utilization', 'util']);
      if(rawUtilPct !== '' && rawUtilPct !== undefined){
        let uVal = num(rawUtilPct);
        // Если в файле целые проценты (100 = 100%, 85 = 85%, 1 = 1%)
        util = uVal > 1.0 ? (uVal / 100) : (uVal === 1 && load === 0 ? 0.01 : uVal);
      }
    } else if(load > 0 && avail === 0){
      avail = load;
      util = 1.0;
    }
    util = Math.min(1.0, Math.max(0, util));

    // Синхронный расчет свободного остатка
    let free = 0;
    if(avail > 0){
      free = Math.max(0, avail - load);
    }

    let grp = str(pickExact(['Группа ресурсов', 'Resource_Group', 'Group', 'grp']));

    return {
      pl,
      rs,
      rsName,
      resType,
      cat,
      grp,
      p: pNum,
      periodKey,
      norm,
      avail,
      load,
      free,
      util,
      isBottleneck: util >= 0.90,
      isCrit: util >= 0.999
    };
  }).filter(c => c.rs && (c.avail > 0 || c.load > 0 || c.rsName));
}

function parseResLocLocRows(rawRows){
  if(!rawRows || !rawRows.length) return [];
  const cleanKey = k => String(k||'').toLowerCase().replace(/[\s_\-\.\(\)\/\\№,]/g, '');

  const parseList = (val) => {
    if(!val) return [];
    return String(val)
      .replace(/[\(\)]/g, '')
      .split(/[,;\n]/)
      .map(s => s.trim())
      .filter(Boolean);
  };

  return rawRows.map(rawObj => {
    const normMap = new Map();
    Object.keys(rawObj).forEach(k => normMap.set(cleanKey(k), rawObj[k]));

    const pickExact = (patterns) => {
      for(const p of patterns){
        const cp = cleanKey(p);
        if(normMap.has(cp)){
          const v = normMap.get(cp);
          if(v !== undefined && v !== null && v !== '') return v;
        }
      }
      return '';
    };

    const rs = str(pickExact(['resource', 'ресурс', 'Resource', 'rs']));
    const locFrRaw = str(pickExact(['loc_fr', 'locfr', 'откуда', 'источник', 'from']));
    const locToRaw = str(pickExact(['loc_to', 'locto', 'куда', 'назначение', 'to']));
    const prodRaw = str(pickExact(['product', 'продукт', 'sku', 'материал']));
    const tm = str(pickExact(['transport', 'транспорт', 'видтранспорта', 'tm']));

    const limitRaw = pickExact(['const', 'ограничение', 'мощность', 'max_capacity', 'limit', 'value']);
    const limit = limitRaw !== '' ? num(limitRaw) : 0;
    const periodId = str(pickExact(['periodid', 'идпериода', 'период', 'period']));

    let periodKey = '';
    // Если periodid = 1 или пусто — это постоянное/глобальное ограничение модели
    const isGlobal = (periodId === '1' || periodId === '0' || periodId === '' || !periodId);

    if(!isGlobal){
      // Точный поиск года 20XX и месяца 01..12 внутри ID периода (например, 420260401 -> 2026-04)
      const m = periodId.match(/(20\d{2})(0[1-9]|1[0-2])/);
      if(m) {
        periodKey = `${m[1]}-${m[2]}`;
      } else {
        periodKey = normalizePeriodKey(periodId);
      }
    }

    const pNum = !isGlobal && !periodKey && !isNaN(Number(periodId)) && Number(periodId) > 0 ? Number(periodId) : 0;

    const locFrList = parseList(locFrRaw);
    const locToList = parseList(locToRaw);
    const prodList = parseList(prodRaw);

    const locFrClean = locFrList.length === 1 ? locFrList[0] : locFrRaw;
    const locToClean = locToList.length === 1 ? locToList[0] : locToRaw;

    let rsName = rs;
    if(locFrClean && locToClean){
      rsName = `Лимит ${locFrClean} → ${locToClean}`;
    } else if(rs){
      rsName = rs;
    }

    return {
      rs: rs || `${locFrClean}_${locToClean}`,
      rsName,
      locFr: locFrClean,
      locTo: locToClean,
      locFrList,
      locToList,
      prodList,
      tm,
      limit,
      avail: limit,
      norm: limit,
      isBlocked: limit === 0,
      isGlobal,
      p: pNum,
      periodId,
      periodKey
    };
  }).filter(r => r.rs || (r.locFr && r.locTo));
}

/* ═══════════════ 16.2. УМНАЯ МУЛЬТИФАЙЛОВАЯ ЗАГРУЗКА XLSX ═══════════════ */
async function loadFiles(fileList){
  if(typeof XLSX==='undefined'){
    alert('Парсер XLSX недоступен: не найден локальный файл assets/xlsx.full.min.js.\n\nВосстановите файл из репозитория либо временно подключите CDN-версию SheetJS.');
    return;
  }
  const files = Array.from(fileList);
  if(!files.length) return;

  $('#stat').innerHTML = `Чтение ${files.length} файл(ов)...`;

  const readOne = file => new Promise((resolve, reject)=>{
    const fr = new FileReader();
    fr.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
        resolve({file, wb});
      } catch(err) {
        reject({file, reason: err});
      }
    };
    fr.onerror = () => reject({file, reason: new Error('Ошибка чтения файла')});
    fr.readAsArrayBuffer(file);
  });

  try {
    // allSettled: ошибка одного файла не отменяет загрузку остальных
    const settled = await Promise.allSettled(files.map(readOne));
    const results = settled.filter(s=>s.status==='fulfilled').map(s=>s.value);
    const failedFiles = settled.filter(s=>s.status==='rejected')
      .map(s=>`${s.reason.file.name} — ${s.reason.reason && s.reason.reason.message || 'неизвестная ошибка'}`);
    let parsedDemand = null;
    let demandFrom = '';
    const demandFiles = [];
    let parsedCap = [];
    let parsedResLoc = [];

    for(const {file, wb} of results){
      const sheetNames = wb.SheetNames;
      const demandSheet = sheetNames.find(n=>/marking_demand/i.test(n) || /demand/i.test(n) || /заказ/i.test(n));
      const capSheet = sheetNames.find(n=>/capacity_view_sp/i.test(n) || /capacity/i.test(n) || /мощност/i.test(n) || /баланс/i.test(n));
      const resLocSheet = sheetNames.find(n=>/res_loc_loc/i.test(n) || /res_loc/i.test(n) || /ограничен/i.test(n));

      if(resLocSheet){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[resLocSheet],{defval:'',raw:true});
        parsedResLoc = parsedResLoc.concat(parseResLocLocRows(rows));
      }

      if(capSheet){
        const capRows = XLSX.utils.sheet_to_json(wb.Sheets[capSheet],{defval:'',raw:true});
        parsedCap = parsedCap.concat(parseCapacityRows(capRows));
      }

      if(demandSheet){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[demandSheet],{defval:'',raw:true});
        demandFiles.push(file.name);
        parsedDemand = parseRows(rows, file.name);
        demandFrom = file.name;
      } else if(!capSheet && !resLocSheet && !parsedDemand){
        const firstSheet = sheetNames[0];
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[firstSheet],{defval:'',raw:true});
        if(rows.length && (rows[0]['order_id'] !== undefined || rows[0]['План продаж'] !== undefined)){
          demandFiles.push(file.name);
          parsedDemand = parseRows(rows, file.name);
          demandFrom = file.name;
        } else if(rows.length && (rows[0]['const'] !== undefined || rows[0]['loc_fr'] !== undefined)){
          parsedResLoc = parsedResLoc.concat(parseResLocLocRows(rows));
        } else {
          parsedCap = parsedCap.concat(parseCapacityRows(rows));
        }
      }
    }

    // Точная интеграция ограничений res_loc_loc со строгой фильтрацией по периодам, продуктам и плечам
    if(parsedResLoc.length){
      const opsPool = (parsedDemand ? parsedDemand.ops : (DS ? DS.ops : []));
      
      parsedResLoc.forEach(rl => {
        const isBlocked = (rl.limit === 0 || rl.isBlocked);
        
        // Строгий подсчет факта по конкретному периоду, маске продукта, локациям и виду транспорта
        const relevantOps = opsPool.filter(op => {
          if(op.type !== 'movement') return false;

          // 1. Фильтр по периоду
          if(rl.periodKey){
            const opDate = op.d ? normalizePeriodKey(op.d) : '';
            if(opDate && opDate !== rl.periodKey) return false;
          }
          if(rl.p !== undefined && rl.p !== null && !isNaN(rl.p) && rl.p > 0){
            if(op.p !== undefined && op.p !== rl.p) return false;
          }

          // 2. Фильтр по продукту
          if(rl.prodList && rl.prodList.length && !rl.prodList.includes('all')){
            const opProd = String(op.pr || '').trim();
            if(!rl.prodList.some(p => p.toLowerCase() === opProd.toLowerCase())) return false;
          }

          // 3. Фильтр по виду транспорта
          if(rl.tm && rl.tm !== 'all'){
            if(String(op.tm || '').toLowerCase() !== rl.tm.toLowerCase()) return false;
          }

          // 4. Фильтр по системному ресурсу или локациям
          if(op.rs && rl.rs && op.rs.toLowerCase() === rl.rs.toLowerCase()) return true;

          const frMatch = !rl.locFrList || rl.locFrList.includes('all') || rl.locFrList.some(f => f.toLowerCase() === String(op.fr||'').toLowerCase());
          const toMatch = !rl.locToList || rl.locToList.includes('all') || rl.locToList.some(t => t.toLowerCase() === String(op.to||'').toLowerCase());

          return frMatch && toMatch;
        });

        const rawLoad = S(relevantOps, op => op.v);
        // Факт загрузки не может физически превышать лимит модели
        const actualLoad = isBlocked ? 0 : (rl.limit > 0 ? Math.min(rl.limit, rawLoad) : rawLoad);
        const util = isBlocked ? 1.0 : (rl.limit > 0 ? Math.min(1.0, actualLoad / rl.limit) : 0);
        const free = isBlocked ? 0 : Math.max(0, rl.limit - actualLoad);

        // Проверяем наличие в capacity_view_sp
        const existing = parsedCap.find(c => 
          c.rs.toLowerCase() === rl.rs.toLowerCase() && 
          (!rl.periodKey || !c.periodKey || c.periodKey === rl.periodKey)
        );

        const prodStr = (rl.prodList && rl.prodList.length && !rl.prodList.includes('all')) ? rl.prodList.join(', ') : '';

        if(existing){
          if(existing.avail <= 0 || isBlocked){
            existing.avail = rl.limit;
            existing.norm = rl.limit;
            existing.load = actualLoad;
            existing.util = util;
            existing.free = free;
            existing.isBlocked = isBlocked;
            existing.isBottleneck = isBlocked || (util >= 0.90);
          }
          // Ограничение res_loc_loc, наложенное на ресурс (в том числе на Погрузку/Разгрузку),
          // — это лимит направления. Явно помечаем категорией 'route', иначе фильтры
          // логистического анализа отсекали такие блокировки по категории 'loading'/'unloading'.
          existing.cat = 'route';
          existing.locFr = rl.locFr;
          existing.locTo = rl.locTo;
          existing.locFrList = rl.locFrList;
          existing.locToList = rl.locToList;
          existing.prodList = rl.prodList;
          existing.prodTarget = prodStr || existing.prodTarget;
        } else {
          parsedCap.push({
            pl: rl.locFr ? `${rl.locFr} → ${rl.locTo}` : (rl.locTo || 'Сеть'),
            rs: rl.rs || `${rl.locFr}_${rl.locTo}`,
            rsName: rl.rsName || (rl.locFr && rl.locTo ? `Лимит ${rl.locFr} → ${rl.locTo}` : rl.rs),
            resType: isBlocked ? 'Блокировка маршрута' : 'Лимит направления (res_loc_loc)',
            cat: 'route',
            locFr: rl.locFr,
            locTo: rl.locTo,
            locFrList: rl.locFrList,
            locToList: rl.locToList,
            prodList: rl.prodList,
            prodTarget: prodStr,
            p: rl.p,
            periodKey: rl.periodKey,
            norm: rl.limit,
            avail: rl.limit,
            load: actualLoad,
            free,
            util,
            isBlocked,
            isBottleneck: isBlocked || (util >= 0.90),
            isCrit: isBlocked || (util >= 0.999)
          });
        }
      });
    }

    // Сборка финального набора данных
    if(parsedDemand){
      parsedDemand.capacity = parsedCap;
      DS = build(parsedDemand);
    } else if(parsedCap.length){
      if(!DS) DS = build(SEED);
      DS.capacity = parsedCap.map(c=>({
        ...c,
        pl: sany(c.pl),
        rs: sany(c.rs),
        rsName: sany(c.rsName || c.rs),
        grp: sany(c.grp || '')
      }));
      DS.hasCap = true;
    } else {
      const why = failedFiles.length ? ` Причины: ${failedFiles.join('; ')}.` : '';
      throw new Error('Не удалось распознать данные заказов или мощностей.'+why);
    }

    // Новый датасет — старые фильтры/поиск/страницы таблиц невалидны: сбрасываем
    Object.keys(TBL).forEach(k=>delete TBL[k]);
    Object.keys(POPQ).forEach(k=>delete POPQ[k]);
    DS._demo=false; // реальная загрузка (Excel или ClickHouse) вытесняет демо-набор
    SELECTED_ORDER_ID=null; TREE_FOCUSED_KEY=null;
    clearF();
    render();

    const bnCount = DS.capacity.filter(c=>c.isBottleneck).length;
    const blockCount = DS.capacity.filter(c=>c.isBlocked).length;
    const capMsg = DS.hasCap ? ` | ⚡ Мощности и лимиты: ${DS.capacity.length} зап. (${bnCount} узких мест, ${blockCount} блокировок)` : '';
    const notes=[];
    if(parsedDemand&&parsedDemand.skippedOps) notes.push(`пропущено ${nf(parsedDemand.skippedOps)} ${plural(parsedDemand.skippedOps,['строка','строки','строк'])} операций с неизвестным типом`);
    if(demandFiles.length>1) notes.push(`demand-лист найден в нескольких файлах (${demandFiles.join(', ')}), применён последний: ${demandFrom}`);
    if(failedFiles.length) notes.push(`не прочитаны: ${failedFiles.join('; ')}`);
    const noteMsg = notes.length ? `<br><span class="neg">Внимание: ${esc(notes.join(' · '))}</span>` : '';
    $('#stat').innerHTML = `<span class="pos">Загружено:</span> ${esc(DS.name)}<br>${DS.orders.length} заказов | ${DS.ops.length} операций${capMsg}${noteMsg}`;
    STAT_PIN = true; // переживает переключения вкладок, пока не придёт новая загрузка или сброс
    autosaveDS(); // данные переживают перезагрузку страницы
  } catch(err){
    $('#stat').innerHTML = `<span class="neg">Ошибка: ${esc(err.message)}</span>`;
    alert('Ошибка загрузки файлов:\n\n' + err.message);
  }
}
/* ═══════════════ 17. РЕНДЕР И ИНИЦИАЛИЗАЦИЯ ═══════════════ */
function go(tab){TAB=tab;render()}
function render(){
  if(!DS){
    $('#nav').innerHTML='';$('#fpanel').style.display='none';
    $('#pgTitle').textContent='Данные не загружены';
    $('#pgSub').textContent='';
    $('#main').innerHTML='<div class="empty"><h2>Данные не загружены</h2>'
      +'<p>Нажмите кнопку загрузки в шапке и выберите файл со структурой листа <code>marking_demand</code>.</p></div>';
    STAT_PIN=false;
    $('#stat').innerHTML='Нет активного датасета';
    return;
  }
  $('#fpanel').style.display='';
  $('#nav').innerHTML=TABS.map(([k,n])=>
    `<button class="${TAB===k?'on':''}" data-t="${k}"><span class="dot"></span><b>${n}</b></button>`).join('');
  $$('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
  const cur=TABS.find(t=>t[0]===TAB)||TABS[0];
  $('#pgTitle').textContent=cur[1];
  $('#pgSub').textContent=TSUB[TAB]||'';
  fillSelects();
  const V={ov:tabOV,dm:tabDM,tree:tabTREE,lg:tabLG,pd:tabPD,caps:tabCAPS,
    pc:tabPC,st:tabST,cost:tabCOST,raw:tabRAW,
    vs:(window.CHX&&CHX.tabVS)||tabVS, dq:tabDQ};
  try{$('#main').innerHTML=(V[TAB]||tabOV)();decorateCards()}
  catch(err){$('#main').innerHTML=`<div class="empty"><h2 class="neg">Ошибка отрисовки блока</h2><p>${esc(err.message)}</p></div>`;console.error(err)}
  if(!STAT_PIN)
    $('#stat').innerHTML=`${esc(DS.name)}<br>${DS.orders.length} заказов | ${DS.ops.length} операций | периоды ${uq(DS.orders,o=>o.p).sort((a,b)=>a-b).join(', ')}`;
}
const bTheme=$('#bThemeToggle');
if(bTheme)bTheme.onclick=()=>{
  THEME=(THEME==='light')?'dark':'light';
  ipSetTheme(THEME);
  syncThemeTokens();
  if(DS)render();
};
/* Переключатель раскладки меню: слева ↔ сверху */
const bLayout=$('#bLayoutToggle');
if(bLayout)bLayout.onclick=()=>{
  const app=$('#app'),isTop=app.classList.toggle('layout-top');
  LAYOUT=isTop?'top':'side';
  ipSetLayout(LAYOUT);
  setTimeout(()=>{if(DS)render()},50);
};
/* Делегированные переходы из таблиц: номера заказов и RCA-бейджи (data-атрибуты
   вместо inline-onclick — значения из загруженных файлов не исполняются как код) */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-goto-order]');
  if(g){SELECTED_ORDER_ID=+g.dataset.gotoOrder;TREE_FOCUSED_KEY=null;go('tree');return}
  const j=e.target.closest('[data-rca-jump]');
  if(j){CapacityRCA.drillDownToOrder(+j.dataset.ord,j.dataset.rs,j.dataset.mode||'prod_res')}
});
$('#bLoad').onclick=()=>$('#fIn').click();
$('#bCH').onclick=()=>{ if(window.CHX) CHX.openModal(); else alert('Модуль ClickHouse не загружен: проверьте файл assets/inplan-ch.js') };
$('#fIn').onchange=e=>{if(e.target.files&&e.target.files.length){loadFiles(e.target.files);e.target.value=''}};
$('#bSave').onclick=()=>{if(!DS){alert('Нет данных для сохранения');return}saveVer()};
$('#bReset').onclick=()=>{
  if(!confirm('Сбросить данные и обнулить все дашборды?\n\nАвтосохранение тоже будет удалено. Сохранённые версии для сравнения останутся.'))return;
  clearSavedDataset();
  if(window.CHX&&typeof CHX.forgetSession==='function') CHX.forgetSession();
  DS=null;TAB='ov';STAT_PIN=false;clearF();render();
};
const toggleRail=()=>{
  const app=$('#app'),min=app.classList.toggle('min');
  $('#railToggle').textContent=min?'›':'‹ Свернуть панель';
  setTimeout(()=>{if(DS)render()},220);
};
$('#railToggle').onclick=toggleRail;
const hdrToggle=$('#bRailToggleHdr');
if(hdrToggle)hdrToggle.onclick=toggleRail;
let RT,lastW=0;
function redraw(force){
  const el=document.getElementById('main');
  const w=el?el.clientWidth:innerWidth;
  if(!force&&Math.abs(w-lastW)<16)return;
  lastW=w;clearTimeout(RT);
  RT=setTimeout(()=>{if(DS)render()},200);
}
window.addEventListener('resize',()=>redraw(true));
if(window.ResizeObserver){
  const ro=new ResizeObserver(()=>redraw(false));
  ro.observe(document.getElementById('main'));
}
window.addEventListener('keydown',e=>{
  // Escape закрывает всплывающие панели и полноэкранный график; сброс фильтров — отдельной кнопкой «Сбросить»
  if(e.key!=='Escape')return;
  dtpHide();$$('.pop-wrap').forEach(w=>w.classList.remove('open'));
  if(FULL_ID){FULL_ID=null;render()}
});

/* Хук ClickHouse: при загрузке данных из CH сохраняем свежий снимок,
   чтобы после закрытия браузера восстановились и данные, и соединение. */
window.onCHDataset=function(ds,versions){
  Object.keys(TBL).forEach(k=>delete TBL[k]);
  Object.keys(POPQ).forEach(k=>delete POPQ[k]);
  SELECTED_ORDER_ID=null; TREE_FOCUSED_KEY=null; clearF();
  DS=ds;
  if(Array.isArray(versions)&&versions.length) DS._chVersions=versions;
  STAT_PIN=true;
  render();
  autosaveDS();
  writeActiveDataset(DS, (window.CHX&&CHX.session&&CHX.session.read()?.expiresAt)||Date.now()+DATASET_TTL_MS);
};

/* Продление ClickHouse-сессии одновременно продлевает срок локального снимка. */
window.onCHSessionTouched=function(expiresAt){
  const active=readActiveDataset();
  if(active&&active.source==='clickhouse'){
    try{active.expiresAt=expiresAt||Date.now()+DATASET_TTL_MS;localStorage.setItem(ACTIVE_DATASET_KEY,JSON.stringify(active))}catch(e){}
  }
};

/* Статус автосессии, который обновляет коннектор после фонового
   переподключения или проверки соединения. */
window.onCHSessionStatus=function(info){
  const stat=document.getElementById('stat');
  if(!stat)return;
  stat.classList.add('session-status');
  if(info.type==='restoring'){
    stat.innerHTML='<span class="mid">Восстановление сессии…</span>';
    STAT_PIN=true;
    return;
  }
  if(info.type==='restored' || info.type==='active'){
    /* Снимок CH хранит и агрегаты версий, поэтому сравнение доступно сразу
       после перезагрузки, без повторной тяжёлой загрузки всех данных. */
    if(DS && Array.isArray(DS._chVersions) && window.CHX && !CHX.versions.length){
      CHX.versions=DS._chVersions;
      window.DS=DS;
    }
    const hasData=!!(DS && DS.src==='clickhouse' && !DS._demo);
    stat.innerHTML=hasData
      ?'<span class="pos">Сессия восстановлена</span><br>Данные предыдущей сессии восстановлены и подключение активно.'
      :'<span class="pos">Сессия восстановлена</span><br>Подключение к ClickHouse активно.';
    STAT_PIN=true;
    return;
  }
  if(info.type==='error'){
    const hasData=!!(DS && DS.src==='clickhouse' && !DS._demo);
    stat.innerHTML=hasData
      ?'<span class="neg">Сессия восстановлена частично</span><br>Данные доступны, но подключение неактивно. Откройте подключение к ClickHouse.'
      :'<span class="neg">Не удалось восстановить сессию</span><br>Откройте подключение к ClickHouse для повторной попытки.';
    STAT_PIN=true;
  }
};

/* стартуем с последнего автосохранения, иначе — на демо-наборе */
const SAVED=restoreDS();
if(!SAVED){clearSavedDataset()}
DS=SAVED?SAVED.ds:build(SEED);
if(!SAVED)DS._demo=true;
render();
setInterval(expireActiveDatasetIfNeeded,60000);
if(SAVED){
  $('#stat').innerHTML=`<span class="pos">Восстановлено автосохранение:</span> ${esc(SAVED.name||DS.name)}${SAVED.ts?' · '+fmtTs(SAVED.ts):''}<br>${DS.orders.length} заказов | ${DS.ops.length} операций`;
  STAT_PIN=true;
}
</script>
