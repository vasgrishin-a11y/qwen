<style>
/* ═══════════════ ТОКЕНЫ In.Plan ═══════════════ */
:root{
  /* neutral 0…950 */
  --scp-n-0:#ffffff;--scp-n-50:#f5f6f8;--scp-n-100:#eaeaea;--scp-n-150:#dfdfe0;
  --scp-n-200:#d4d5d6;--scp-n-300:#bfbfc1;--scp-n-500:#949598;--scp-n-600:#77787a;
  --scp-n-700:#5a5a5c;--scp-n-800:#3c3d3e;--scp-n-900:#1f1f20;--scp-n-950:#111111;
  /* brand 50…950, ядро 700 */
  --scp-b-50:#faf3ff;--scp-b-100:#f4e3ff;--scp-b-200:#eacdff;--scp-b-300:#d899ff;
  --scp-b-400:#c46cff;--scp-b-500:#af35ff;--scp-b-600:#9c0fff;--scp-b-700:#9000ff;
  --scp-b-800:#6f00ce;--scp-b-900:#4f0096;--scp-b-950:#410076;
  /* прикладные роли акцента */
  --scp-accent:#9000ff;--scp-accent-hover:#7320d9;--scp-accent-active:#822be2;
  --scp-accent-sub:#af47ff;--scp-accent-2:#c57aff;--scp-accent-bd:#e9ccff;
  --scp-accent-bg:#f1e0ff;--scp-accent-dis:#d8cfde;
  /* поверхности */
  --scp-bg:#f4f3f7;--scp-surface:#ffffff;--scp-surface-2:#f9f8fb;--scp-rail:#17171a;
  --scp-rail-2:#2a2a30;--scp-rail-hover:#242429;
  /* текст */
  --scp-text:#212529;--scp-text-2:#444647;--scp-text-3:#8c9096;--scp-text-dis:#d9d9d9;
  --scp-link:#0d56e2;
  /* границы */
  --scp-line:#e8e7ee;--scp-line-2:#dedce5;--scp-divider:#cbcbcb;--scp-ctrl:#949598;
  --scp-ctrl-hover:#5a5a5c;--scp-menu-bd:#cfd4dc;
  /* семантика */
  --scp-ok:#22bb55;--scp-ok-bg:#d2faef;--scp-err:#f22a41;--scp-err-bg:#ffd6db;
  --scp-warn:#ff9a3b;--scp-warn-bg:#fcf0d4;
  /* палитра данных */
  --dat-1:#2d3f8f;--dat-2:#3fa9c9;--dat-3:#22bb55;--dat-4:#ff9a3b;--dat-5:#f22a41;
  --dat-6:#7c5cd6;--dat-7:#0d9488;--dat-8:#c026a3;--dat-9:#8a8f98;
  /* геометрия */
  --r-s:4px;--r-m:8px;--r-l:16px;
  --p-1:4px;--p-2:8px;--p-3:12px;--p-4:16px;--p-6:24px;--p-8:32px;
  --rail-w:212px;--rail-w-min:56px;
}

/* ═══════════════ ИЗЯЩНАЯ ТЁМНАЯ ТЕМА In.Plan ═══════════════ */
[data-theme="dark"]{
  /* мягкий графитовый фон с благородным полутоном */
  --scp-bg:#1a1a22;--scp-surface:#22222c;--scp-surface-2:#292936;
  --scp-rail:#15151c;--scp-rail-2:#2f2f3d;--scp-rail-hover:#252533;
  /* контрастная и комфортная для глаз типографика */
  --scp-text:#f1f2f6;--scp-text-2:#c4c6d4;--scp-text-3:#8f92a4;--scp-text-dis:#525464;
  --scp-link:#4d88ff;
  /* тонкие, чёткие границы */
  --scp-line:#2d2d3a;--scp-line-2:#383849;--scp-divider:#434357;--scp-ctrl:#616378;
  --scp-ctrl-hover:#9a9cb2;--scp-menu-bd:#434357;
  /* фирменный акцент InPlan */
  --scp-b-50:#2d1945;--scp-b-100:#431e68;--scp-b-200:#5d2491;
  --scp-accent:#a846ff;--scp-accent-hover:#962bf9;--scp-accent-active:#be6bff;
  --scp-accent-sub:#c47aff;--scp-accent-2:#d79aff;--scp-accent-bd:#6e2da8;
  --scp-accent-bg:#3a195a;
  /* семантические фоны */
  --scp-ok:#2dd468;--scp-ok-bg:#143823;
  --scp-err:#f84b5c;--scp-err-bg:#42171c;
  --scp-warn:#fb9e38;--scp-warn-bg:#41290f;
  --scp-n-50:#292936;--scp-n-100:#313140;
}

/* ═══════════════ ВЕРХНЕЕ МЕНЮ (альтернативная раскладка) ═══════════════ */
.app.layout-top{flex-direction:column;min-height:100vh}
.app.layout-top .rail{width:100%!important;flex:0 0 auto;height:auto;position:static;
  flex-direction:row;align-items:center;padding:8px 16px;gap:16px;border-bottom:1px solid var(--scp-line-2)}
.app.layout-top .rail-logo{padding:0;min-height:auto}
.app.layout-top .rail-sub,.app.layout-top .rail-grp{display:none}
.app.layout-top .rail-nav{flex-direction:row;overflow-x:auto;overflow-y:hidden;flex:1;padding:0;gap:4px}
.app.layout-top .rail-nav button{border-left:0;border-bottom:4px solid transparent;padding:8px 12px;white-space:nowrap}
.app.layout-top .rail-nav button.on{border-left:0;border-bottom-color:var(--scp-accent)}
.app.layout-top .rail-foot{display:none}
.app.layout-top .wrap{flex:1;min-width:0;display:flex;flex-direction:column;overflow:auto}

[data-theme="dark"] .dq.e{background:var(--scp-err-bg)}
[data-theme="dark"] .dq.w{background:var(--scp-warn-bg)}
[data-theme="dark"] .dq.i{background:var(--scp-ok-bg)}
[data-theme="dark"] #tip{background:#15151c;border:1px solid var(--scp-line-2)}
[data-theme="dark"] input[type=number]{background:var(--scp-surface);color:var(--scp-text)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--scp-bg);color:var(--scp-text);
  font:400 14px/20px 'Open Sans',-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .2s ease,color .2s ease}

/* ═══════════════ КАРКАС: тёмный рельс + рабочая область ═══════════════ */
.app{display:flex;min-height:100vh}
.rail{width:var(--rail-w);flex:0 0 var(--rail-w);background:var(--scp-rail);
  display:flex;flex-direction:column;transition:width .2s ease-in-out, flex-basis .2s ease-in-out;position:sticky;top:0;height:100vh;z-index:300}
.app.min .rail{width:var(--rail-w-min);flex:0 0 var(--rail-w-min)}
.rail-logo{display:flex;align-items:center;padding:16px 14px 10px;min-height:56px}
.inplan-badge{display:flex;align-items:center;gap:3px;padding:6px;border-radius:6px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07)}
.ip-sq{width:11px;height:11px;border-radius:2.5px;transition:transform .2s ease}
.inplan-badge:hover .ip-sq{transform:scale(1.08)}
.ip-s1{background:var(--scp-accent);box-shadow:0 0 8px rgba(144,0,255,0.6)}
.ip-s2{background:var(--scp-accent-sub)}
.ip-s3{background:var(--scp-accent-2)}
.ip-s4{background:#fff;opacity:0.9}
.app.min .rail-sub,.app.min .rail-nav b,.app.min .rail-grp{display:none}
.rail-sub{color:#8a8a8a;font-size:11px;padding:0 16px 12px;letter-spacing:.2px}
.rail-grp{color:#77787a;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.6px;padding:10px 16px 6px}
.rail-nav{display:flex;flex-direction:column;overflow-y:auto;flex:1;padding-bottom:8px}
.rail-nav button{display:flex;align-items:center;gap:10px;background:transparent;border:0;
  border-left:4px solid transparent;color:#d6d6d6;text-align:left;padding:9px 14px 9px 12px;
  font:400 13px/18px 'Open Sans',sans-serif;cursor:pointer;transition:.15s;white-space:nowrap;overflow:hidden}
.rail-nav button:hover{background:var(--scp-rail-hover);color:#fff}
.rail-nav button.on{background:var(--scp-rail-2);border-left-color:var(--scp-accent);color:#fff;font-weight:600}
.rail-nav .dot{width:6px;height:6px;border-radius:50%;background:var(--scp-warn);flex:0 0 6px}
.rail-nav button.on .dot{background:var(--scp-accent-sub)}
.rail-foot{border-top:1px solid #2e2e2e;padding:8px}
.rail-foot button{width:100%;background:transparent;border:0;color:#8a8a8a;cursor:pointer;
  font:400 12px 'Open Sans',sans-serif;padding:7px 8px;border-radius:var(--r-s);text-align:left;
  display:flex;align-items:center;justify-content:center}
.rail-foot button:hover{background:var(--scp-rail-hover);color:#fff}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column;overflow:auto}

/* ═══════════════ ШАПКА СТРАНИЦЫ ═══════════════ */
header{background:var(--scp-surface);border-bottom:1px solid var(--scp-line-2);
  padding:14px 32px 12px;display:flex;align-items:flex-start;gap:16px}
.hdr-left{display:flex;align-items:flex-start;gap:12px}
.btn-rail-menu{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
  background:var(--scp-surface);border:1px solid var(--scp-ctrl);border-radius:var(--r-s);
  color:var(--scp-text-2);cursor:pointer;transition:.12s;margin-top:2px}
.btn-rail-menu:hover{border-color:var(--scp-accent);color:var(--scp-accent);background:var(--scp-b-50)}
.btn-rail-menu svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app.layout-top .btn-rail-menu{display:none}
h1{font:600 28px/34px 'Open Sans',sans-serif;margin:0;color:var(--scp-text)}
.h-sub{font-size:12px;line-height:16px;color:var(--scp-text-3);margin-top:2px}
.hdr-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
  background:var(--scp-surface);border:1px solid var(--scp-ctrl);border-radius:var(--r-s);
  color:var(--scp-text-2);cursor:pointer;transition:.12s;position:relative}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{border-color:var(--scp-accent);color:var(--scp-accent);background:var(--scp-b-50)}
.icon-btn.p{background:var(--scp-accent);border-color:var(--scp-accent);color:#fff}
.icon-btn.p:hover{background:var(--scp-accent-hover);border-color:var(--scp-accent-hover);color:#fff}
.icon-btn.d:hover{border-color:var(--scp-err);color:var(--scp-err);background:var(--scp-err-bg)}
.icon-btn[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);left:50%;
  transform:translateX(-50%);background:var(--scp-n-900);color:#fff;font-size:12px;line-height:16px;
  white-space:nowrap;padding:5px 9px;border-radius:var(--r-s);opacity:0;pointer-events:none;
  transition:opacity .15s;z-index:500}
.icon-btn[data-tip]:hover::after{opacity:1}
.stat{font-size:12px;line-height:16px;color:var(--scp-text-3);text-align:right;white-space:nowrap;
  align-self:center}
.stat.session-status{white-space:normal;max-width:440px}

/* ═══════════════ ПАНЕЛЬ ФИЛЬТРОВ ═══════════════ */
.fpanel{background:var(--scp-surface);border-bottom:1px solid var(--scp-line-2);
  padding:8px 32px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:52px}
.fbar-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;
  color:var(--scp-text-3);margin-right:2px}
.fbar-left,.fbar-mid,.fbar-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fbar-right{margin-left:auto}
.fbar-divider{width:1px;height:22px;background:var(--scp-line-2);margin:0 4px}
.pop-wrap{position:relative}
.pill-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;
  background:var(--scp-surface);border:1px solid var(--scp-ctrl);border-radius:var(--r-s);
  font:400 13px 'Open Sans',sans-serif;color:var(--scp-text);cursor:pointer;transition:.12s}
.pill-btn:hover{border-color:var(--scp-ctrl-hover)}
.pill-btn.on{background:var(--scp-accent-bg);border-color:var(--scp-accent);color:var(--scp-b-900)}
.pill-lbl{color:var(--scp-text-3);font-weight:400}
.pill-val{font-weight:600}
.pill-badge{background:var(--scp-accent);color:#fff;font-size:11px;font-weight:700;padding:0 6px;
  border-radius:9999px;height:18px;display:inline-flex;align-items:center}
.pill-badge.hide{display:none}
.pill-arr{font-size:8px;color:var(--scp-text-3)}
.pop-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:252px;
  background:var(--scp-surface);border:1px solid var(--scp-menu-bd);border-radius:var(--r-m);
  box-shadow:0 4px 15px #00000026;padding:8px;z-index:250}
.pop-wrap.open .pop-menu{display:block}
.pop-hdr{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 7px;
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;
  color:var(--scp-text-3);border-bottom:1px solid var(--scp-line)}
.pop-hdr-links{display:flex;gap:10px}
.pop-hdr-links a{color:var(--scp-accent);text-decoration:none;cursor:pointer;font-size:11px;
  font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.pop-hdr-links a:hover{color:var(--scp-accent-hover)}
.pop-q{width:100%;background:var(--scp-surface);color:var(--scp-text);border:1px solid var(--scp-ctrl);
  border-radius:var(--r-s);padding:6px 9px;font:400 13px 'Open Sans',sans-serif;margin:7px 0 4px}
.pop-q:focus{outline:none;border-color:var(--scp-accent)}
.pop-list{max-height:236px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.pop-item{padding:6px 8px;border-radius:var(--r-s);font-size:13px;cursor:pointer;
  color:var(--scp-text);display:flex;align-items:center;gap:9px;user-select:none}
.pop-item:hover{background:var(--scp-b-50)}
.pop-item.on{background:var(--scp-accent-bg);font-weight:600}
.pop-item input[type=checkbox]{cursor:pointer;accent-color:var(--scp-accent);margin:0;width:14px;height:14px}
.pop-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-reset-flt{display:inline-flex;align-items:center;height:32px;padding:0 12px;background:transparent;
  border:0;border-radius:var(--r-s);font:600 12px 'Open Sans',sans-serif;text-transform:uppercase;
  letter-spacing:.4px;color:var(--scp-accent);cursor:pointer}
.btn-reset-flt:hover:not(:disabled){background:var(--scp-b-50)}
.btn-reset-flt:disabled{color:var(--scp-text-dis);cursor:default}

/* ═══════════════ КОНТЕНТ ═══════════════ */
main{padding:20px 32px 72px;flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--scp-surface);border:1px solid var(--scp-line-2);border-radius:var(--r-m);
  padding:14px 16px}
.kpi .t{font-size:13px;line-height:18px;color:var(--scp-text-2)}
.kpi .v{font:700 28px/34px 'Open Sans',sans-serif;color:var(--scp-text);margin-top:6px;
  letter-spacing:-.4px}
.kpi .s{font-size:12px;line-height:16px;color:var(--scp-text-3);margin-top:3px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
.card{background:var(--scp-surface);border:1px solid var(--scp-line-2);border-radius:var(--r-m);
  padding:16px 18px 12px;min-width:0}
.card.w{grid-column:1/-1}
.card h3{margin:0;font:600 15px/20px 'Open Sans',sans-serif;color:var(--scp-text)}
.card .sub{font-size:12px;line-height:16px;color:var(--scp-text-3);margin:3px 0 10px}
canvas{width:100%;display:block;cursor:pointer}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--scp-text-2);
  padding:2px 0 8px;justify-content:center}
.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
/* ── интерактивная легенда (как в Superset): клик скрывает/показывает ряд ── */
.lg-i{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:4px;
  cursor:pointer;user-select:none;transition:.12s}
.lg-i:hover{background:var(--scp-b-50)}
.lg-i.off{color:var(--scp-text-3);text-decoration:line-through}
.lg-i.off i{background:var(--scp-n-300)!important}
/* ── полноэкранный режим карточки с графиком ── */
.card{position:relative}
.card>h3{padding-right:32px}
.card-fs{position:absolute;top:10px;right:10px;width:26px;height:26px;display:inline-flex;
  align-items:center;justify-content:center;background:var(--scp-surface);
  border:1px solid var(--scp-line-2);border-radius:var(--r-s);color:var(--scp-text-3);cursor:pointer;z-index:3}
.card-fs:hover{border-color:var(--scp-accent);color:var(--scp-accent);background:var(--scp-b-50)}
.card-fs svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card-fs .i-out{display:none}.card.full .card-fs .i-out{display:block}.card.full .card-fs .i-in{display:none}
.card.full{position:fixed;inset:14px;z-index:900;overflow:auto;box-shadow:0 12px 48px #00000059;
  border-color:var(--scp-accent);padding:20px 24px 16px}
body.has-full::after{content:'';position:fixed;inset:0;background:#00000059;z-index:850}
body.has-full{overflow:hidden}

/* ═══════════════ ТАБЛИЦЫ ═══════════════ */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:0 8px;height:32px;text-align:right;border-bottom:1px solid var(--scp-line);
  white-space:nowrap;line-height:16px}
th{height:36px;color:var(--scp-text-2);font-size:13px;font-weight:600;position:sticky;top:0;
  background:var(--scp-surface);z-index:2}
tbody tr:hover{background:var(--scp-b-50)}
.scr{max-height:340px;overflow:auto;border:1px solid var(--scp-line);border-radius:var(--r-s)}
.pos{color:var(--scp-ok)}.neg{color:var(--scp-err)}.mid{color:#c47512}
.dt-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.dt-q{background:var(--scp-surface);color:var(--scp-text);border:1px solid var(--scp-ctrl);
  border-radius:var(--r-s);padding:6px 10px;font:400 13px 'Open Sans',sans-serif;width:240px}
.dt-q:focus{outline:none;border-color:var(--scp-accent)}
.dt-info{font-size:12px;color:var(--scp-text-3)}
.dt-btn{background:var(--scp-surface);color:var(--scp-text-2);border:1px solid var(--scp-ctrl);
  border-radius:var(--r-s);padding:5px 10px;font:400 12px 'Open Sans',sans-serif;cursor:pointer}
.dt-btn:hover{border-color:var(--scp-accent);color:var(--scp-accent);background:var(--scp-b-50)}
.dt-btn.off,.dt-btn:disabled{opacity:.45;cursor:default}
.dt-btn.off:hover,.dt-btn:disabled:hover{border-color:var(--scp-ctrl);color:var(--scp-text-2);
  background:var(--scp-surface)}
.dt-chip{background:var(--scp-accent-bg);border:1px solid var(--scp-accent-bd);color:var(--scp-b-900);
  border-radius:9999px;padding:3px 10px;font-size:12px;cursor:pointer}
.dt-chip:hover{background:var(--scp-err-bg);border-color:var(--scp-err);color:var(--scp-err)}
.dt th.dt-th{padding-right:18px;white-space:nowrap}
.dt td,.dt th{text-align:right}
.dt td.l,.dt th.dt-th.l{text-align:left}
.dt .dt-t{cursor:pointer;user-select:none}
.dt .dt-t:hover{color:var(--scp-accent)}
.dt-ar{color:var(--scp-n-300);margin-left:5px;font-size:9px}
.dt-fn{cursor:pointer;margin-left:6px;color:var(--scp-n-300);font-size:10px}
.dt-fn:hover,.dt-fn.on{color:var(--scp-accent)}

#dtpop{display:none;position:fixed;z-index:600;width:260px;background:var(--scp-surface);

.dtp-h{display:flex;justify-content:space-between;align-items:center;font-size:11px;

.dtp-x{cursor:pointer}.dtp-x:hover{color:var(--scp-err)}
.dtp-q{width:100%;background:var(--scp-surface);color:var(--scp-text);border:1px solid var(--scp-ctrl);

.dtp-q:focus{outline:none;border-color:var(--scp-accent)}
.dtp-a{display:flex;gap:6px;margin-bottom:5px}
.dtp-a button{flex:1;background:var(--scp-surface);color:var(--scp-text-2);

.dtp-l{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.dtp-i{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:var(--r-s);

.dtp-i:hover{background:#eee7f3}
.dtp-i.on{color:var(--scp-b-900);font-weight:600}
.dtp-i input{accent-color:var(--scp-accent);margin:0;width:14px;height:14px}
.dtp-i span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtp-e{padding:12px;text-align:center;color:var(--scp-text-3);font-size:12px}

/* ═══════════════ ПРОЧИЕ КОМПОНЕНТЫ ═══════════════ */
.btn{background:var(--scp-surface);color:var(--scp-text);border:1px solid var(--scp-ctrl);
  border-radius:var(--r-s);padding:7px 14px;cursor:pointer;font:400 13px 'Open Sans',sans-serif;
  transition:.12s}
.btn:hover{background:var(--scp-n-50);border-color:var(--scp-ctrl-hover)}
.btn.p{background:var(--scp-accent);color:#fff;border-color:var(--scp-accent);font-weight:600}
.btn.p:hover{background:var(--scp-accent-hover);border-color:var(--scp-accent-hover)}
.btn.d{background:var(--scp-surface);border-color:var(--scp-err);color:var(--scp-err)}
.btn.d:hover{background:var(--scp-err-bg)}
.chip{background:var(--scp-surface);border:1px solid var(--scp-ctrl);border-radius:9999px;
  padding:4px 12px;font-size:12.5px;cursor:pointer;color:var(--scp-text-2);white-space:nowrap;transition:.12s}
.chip:hover{border-color:var(--scp-accent);color:var(--scp-accent);background:var(--scp-b-50)}
.chip.on{background:var(--scp-accent);color:#fff;border-color:var(--scp-accent);font-weight:600}
.chip.rm{border-color:var(--scp-err);color:var(--scp-err)}
.chip.rm:hover{background:var(--scp-err-bg)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.tag{font-size:11px;padding:2px 8px;border-radius:9999px;background:var(--scp-n-50);
  color:var(--scp-text-2);border:1px solid var(--scp-line-2)}
select{background:var(--scp-surface);color:var(--scp-text);border:1px solid var(--scp-ctrl);
  border-radius:var(--r-s);padding:7px 10px;font:400 13px 'Open Sans',sans-serif}
select:focus{outline:none;border-color:var(--scp-accent)}
input[type=number]{font-family:'Open Sans',sans-serif}
.frow{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.fg label{font-size:11px;color:var(--scp-text-3);font-weight:600;text-transform:uppercase;
  letter-spacing:.5px;display:block;margin-bottom:4px}
.sum{background:var(--scp-surface);border:1px solid var(--scp-line-2);
  border-left:4px solid var(--scp-accent);border-radius:var(--r-m);padding:16px 20px;margin-top:16px}
.sum h4{margin:0 0 10px;font:600 15px/20px 'Open Sans',sans-serif;color:var(--scp-text)}
.sum ul{margin:0 0 12px;padding-left:22px}
.sum li{margin:5px 0;font-size:13.5px;line-height:19px;color:var(--scp-text-2)}
.sum .h{color:var(--scp-text);font-weight:600}
.sec{font-size:11px;color:var(--scp-text-3);text-transform:uppercase;letter-spacing:.6px;
  font-weight:600;margin:14px 0 6px;border-bottom:1px solid var(--scp-line);padding-bottom:5px}
#tip{position:fixed;pointer-events:none;background:var(--scp-n-900);color:#fff;
  border-radius:var(--r-s);padding:8px 11px;font-size:12px;line-height:17px;z-index:950;
  display:none;max-width:300px;box-shadow:0 4px 15px #00000040}
#tip b{color:var(--scp-accent-2)}
#tip code{background:#333;padding:1px 4px;border-radius:3px;font-size:11px}
.dq{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r-m);
  margin-bottom:8px;font-size:13.5px;line-height:19px;border:1px solid var(--scp-line-2);
  background:var(--scp-surface);color:var(--scp-text-2)}
.dq.e{border-left:4px solid var(--scp-err);background:#fffafb}
.dq.w{border-left:4px solid var(--scp-warn);background:#fffdf8}
.dq.i{border-left:4px solid var(--scp-ok);background:#fafffc}
.dq .m{flex:1}
.dq b{color:var(--scp-text)}
.empty{text-align:center;padding:72px 24px;color:var(--scp-text-3);font-size:14px;
  background:var(--scp-surface);border:1px solid var(--scp-line-2);border-radius:var(--r-m)}
.empty h2{font:600 20px/26px 'Open Sans',sans-serif;color:var(--scp-text);margin:0 0 8px}
.tbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 10px;
  background:var(--scp-n-50);border:1px solid var(--scp-line-2);border-radius:var(--r-m)}
.tbar-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;
  color:var(--scp-text-3);margin-right:4px}
.seg{display:inline-flex;background:var(--scp-n-50);border:1px solid var(--scp-line-2);
  border-radius:var(--r-s);padding:2px}
.seg .btn{border:0;background:transparent;padding:5px 11px;font-size:12.5px;border-radius:3px}
.seg .btn:hover{background:var(--scp-n-100)}
.seg .btn.p{background:var(--scp-accent);color:#fff}
@media(max-width:1100px){
  .grid{grid-template-columns:1fr}
  header,main,.fpanel{padding-left:16px;padding-right:16px}
  .app{flex-direction:column!important}
  .rail{width:100%;flex:0 0 auto;height:auto;position:static;flex-direction:column}
  .rail-nav{flex-direction:row;overflow-x:auto}
  .rail-nav button{border-left:0;border-bottom:4px solid transparent}
  .rail-nav button.on{border-left:0;border-bottom-color:var(--scp-accent)}
}

.chm-stat{font-size:12px;color:var(--scp-text-3)}
.chm-sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;

.chm-nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chm-meta{font-size:11px;color:var(--scp-text-3);white-space:nowrap}
.chm-sel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;
  padding:8px;background:var(--scp-b-50);border:1px solid var(--scp-accent-bd);border-radius:var(--r-s)}
</style>

/* Цвет текста поверх заливки: контрастно в обеих темах */
function onFill(hex){
  if(!hex||hex[0]!=='#')return CH.txt;
  const h=hex.length===4?hex.replace(/#(.)(.)(.)/,'#$1$1$2$2$3$3'):hex;
  const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(4,6),16);
  return (0.299*r+0.587*g+0.114*b)>138?'#15151c':'#ffffff';
}
/* rgba из hex */
function rgba(hex,a){const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`}

/* ═══════════════ 3.1. УНИВЕРСАЛЬНАЯ ТАБЛИЦА ═══════════════ */
const TBL={};
let DTP=null;
function dtp(){if(!DTP){DTP=document.createElement('div');DTP.id='dtpop';
  DTP.onclick=e=>e.stopPropagation();document.body.appendChild(DTP)}return DTP}
function dtpHide(){if(DTP)DTP.style.display='none'}

function dtable(sel,cols,rows,opts){
  opts=opts||{};
  const host=$(sel); if(!host) return;
  const key=(opts.key||sel).replace(/[^A-Za-z0-9_]/g,'');
  if(!TBL[key]) TBL[key]={sort:opts.sort||cols[0].k,dir:opts.dir||'desc',q:'',flt:{},pg:1};
  const st=TBL[key];

  const data=rows.map(r=>{const o={_r:r};cols.forEach(c=>{o[c.k]=c.v?c.v(r):r[c.k]});return o});
  const cell=(c,d)=>c.f?c.f(d[c.k],d._r)
    :(d[c.k]===''||d[c.k]==null?'—':(typeof d[c.k]==='number'?nf(d[c.k],2):esc(d[c.k])));
  const plain=(c,d)=>String(cell(c,d)).replace(/<[^>]*>/g,'').trim();

  function view(){
    let out=data;
    cols.forEach(c=>{const s=st.flt[c.k];
      if(s&&s.length){const set=new Set(s);out=out.filter(d=>set.has(String(d[c.k]==null?'':d[c.k])))}});
    const q=st.q.trim().toLowerCase();
    if(q)out=out.filter(d=>cols.some(c=>plain(c,d).toLowerCase().includes(q)));
    const sc=cols.find(c=>c.k===st.sort);
    if(sc){const dir=st.dir==='asc'?1:-1;
      out=out.slice().sort((a,b)=>{const x=a[sc.k],y=b[sc.k];
        const nx=typeof x==='number',ny=typeof y==='number';
        if(sc.num||(nx&&ny))return((nx?x:0)-(ny?y:0))*dir;
        return String(x==null?'':x).localeCompare(String(y==null?'':y),'ru',{numeric:true})*dir})}
    return out;
  }
  const uqv=c=>[...new Set(data.map(d=>String(d[c.k]==null?'':d[c.k])))]
    .sort((a,b)=>a.localeCompare(b,'ru',{numeric:true}));

  function draw(){
    const out=view(), pg=opts.pg||0;
    const tp=pg?Math.max(1,Math.ceil(out.length/pg)):1;
    st.pg=Math.min(Math.max(1,st.pg),tp);
    const slice=pg?out.slice((st.pg-1)*pg,st.pg*pg):out.slice(0,opts.max||4000);
    const actC=cols.filter(c=>st.flt[c.k]&&st.flt[c.k].length);
    const nAct=actC.length+(st.q?1:0);

    host.innerHTML=`<div class="dt">
      <div class="dt-bar">
        <input class="dt-q" type="text" placeholder="Поиск по таблице" value="${esc(st.q)}">
        <span class="dt-info">${nf(out.length)} из ${nf(data.length)}${pg?` · стр. ${st.pg} из ${tp}`:''}</span>
        ${actC.map(c=>`<span class="dt-chip" data-cf="${c.k}">${esc(c.t)}: ${st.flt[c.k].length} ✕</span>`).join('')}
        <span style="flex:1"></span>
        ${opts.csv?`<button class="dt-btn" data-csv="1">Экспорт CSV</button>`:''}
        <button class="dt-btn ${nAct?'':'off'}" data-clr="1" ${nAct?'':'disabled'}>Сбросить</button>
      </div>
      <div class="scr" style="max-height:${opts.h||340}px"><table><thead><tr>
        ${cols.map(c=>{const on=st.sort===c.k,fon=st.flt[c.k]&&st.flt[c.k].length;
          return `<th class="dt-th${c.left?' l':''}"${on?` aria-sort="${st.dir==='asc'?'ascending':'descending'}"`:''}><span class="dt-t" data-sk="${c.k}">${esc(c.t)}
            <span class="dt-ar">${on?(st.dir==='asc'?'▲':'▼'):'↕'}</span></span>${
            c.flt?`<span class="dt-fn${fon?' on':''}" data-fk="${c.k}">▾</span>`:''}</th>`}).join('')}
      </tr></thead><tbody>
        ${slice.length?slice.map(d=>`<tr>${cols.map(c=>
          `<td class="${c.cls?(c.cls(d[c.k],d._r)||''):''}${c.left?' l':''}">${cell(c,d)}</td>`).join('')}</tr>`).join('')
          :`<tr><td colspan="${cols.length}" style="text-align:center;padding:26px;color:var(--scp-text-3)">Ничего не найдено</td></tr>`}
      </tbody></table></div>
      ${pg&&tp>1?`<div class="dt-pgs">
        <button class="dt-btn" data-pg="1">«</button>
        <button class="dt-btn" data-pg="${st.pg-1}">Назад</button>
        <span>${st.pg} из ${tp}</span>
        <button class="dt-btn" data-pg="${st.pg+1}">Вперёд</button>
        <button class="dt-btn" data-pg="${tp}">»</button></div>`:''}
    </div>`;

    const qi=host.querySelector('.dt-q');
    qi.oninput=()=>{const p=qi.selectionStart;st.q=qi.value;st.pg=1;draw();
      const n=host.querySelector('.dt-q');n.focus();n.selectionStart=n.selectionEnd=p};
    host.querySelectorAll('.dt-t').forEach(e=>e.onclick=()=>{
      const k=e.dataset.sk;
      if(st.sort===k)st.dir=st.dir==='asc'?'desc':'asc';else{st.sort=k;st.dir='desc'}
      draw()});
    host.querySelectorAll('.dt-fn').forEach(e=>e.onclick=ev=>{ev.stopPropagation();openFlt(e,e.dataset.fk)});
    host.querySelectorAll('[data-cf]').forEach(e=>e.onclick=()=>{st.flt[e.dataset.cf]=[];st.pg=1;draw()});
    const clr=host.querySelector('[data-clr]');
    if(clr)clr.onclick=()=>{st.q='';st.flt={};st.pg=1;draw()};
    host.querySelectorAll('[data-pg]').forEach(e=>e.onclick=()=>{st.pg=+e.dataset.pg;draw()});
    const cb=host.querySelector('[data-csv]');
    if(cb)cb.onclick=()=>{
      /* Числа — как есть (точка-разделитель, без неразрывных пробелов формата ru-RU),
         текст — очищенный от разметки; кавычки удваиваются по RFC 4180 */
      const lines=[cols.map(c=>c.t).join(';')]
        .concat(out.map(d=>cols.map(c=>{
          const raw=d[c.k];
          const v=(typeof raw==='number'&&isFinite(raw))?String(raw):plain(c,d).replace(/"/g,'""');
          return `"${v}"`;
        }).join(';')));
      const b=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
      const a=document.createElement('a');a.href=URL.createObjectURL(b);
      a.download=(opts.name||'table')+'_'+new Date().toISOString().slice(0,10)+'.csv';a.click()};
  }

  function openFlt(anchor,k){
    const c=cols.find(z=>z.k===k),P=dtp(),vals=uqv(c);
    let fq='';
    const build=()=>{
      const list=vals.filter(v=>!fq||v.toLowerCase().includes(fq));
      const cur=st.flt[k]||[];
      P.innerHTML=`<div class="dtp-h"><span>${esc(c.t)}</span><span class="dtp-x">✕</span></div>
        <input class="dtp-q" type="text" placeholder="Поиск значения" value="${esc(fq)}">
        <div class="dtp-a"><button data-all="1">Выбрать все</button><button data-non="1">Снять все</button></div>
        <div class="dtp-l">${list.map(v=>{const on=cur.includes(v);
          return `<label class="dtp-i${on?' on':''}"><input type="checkbox" ${on?'checked':''} data-v="${esc(v)}">
            <span>${esc(v===''?'(пусто)':v)}</span></label>`}).join('')||'<div class="dtp-e">нет значений</div>'}</div>`;
      P.querySelector('.dtp-x').onclick=dtpHide;
      const fi=P.querySelector('.dtp-q');
      fi.oninput=()=>{const p=fi.selectionStart;fq=fi.value.toLowerCase();build();
        const n=P.querySelector('.dtp-q');n.value=fq?fi.value:'';n.focus();n.selectionStart=n.selectionEnd=p};
      P.querySelector('[data-all]').onclick=()=>{st.flt[k]=list.slice();st.pg=1;draw();build()};
      P.querySelector('[data-non]').onclick=()=>{st.flt[k]=[];st.pg=1;draw();build()};
      P.querySelectorAll('input[type=checkbox]').forEach(i=>i.onchange=()=>{
        const s=new Set(st.flt[k]||[]);
        i.checked?s.add(i.dataset.v):s.delete(i.dataset.v);
        st.flt[k]=[...s];st.pg=1;draw();build()});
    };
    build();
    P.style.display='block';
    const r=anchor.getBoundingClientRect();
    P.style.left=Math.max(8,Math.min(r.left-12,innerWidth-272))+'px';
    P.style.top=Math.min(r.bottom+6,Math.max(8,innerHeight-370))+'px';
  }

  draw();
}

/* ═══════════════ 4. ПОДГОТОВКА ДАТАСЕТА ═══════════════ */
function build(src){
  /* Данные хранятся «чистыми» — HTML-экранирование выполняется только в точках вывода
     (dtable, дропдауны фильтров), иначе получаем двойное экранирование: «&amp;amp;» в таблицах,
     испорченные CSV-экспорт, поиск и сортировку. От угловых скобок данные очищаются на входе,
     чтобы значения из XLSX не могли сформировать теги в контекстах без экранирования
     (тултипы canvas и т.п.). */
  const CLEAN=['loc','prod','cl'];
  const o=src.orders.map(r=>{const x={...r,chan:String(r.loc).startsWith('Sale_EX')?'EX':'RU'};
    CLEAN.forEach(k=>x[k]=sany(x[k]));return x});
  const ops=src.ops.map(r=>{const x={...r,type:TMAP[r.t]||r.t,cost:(Math.abs(r.r)<=1?0:Math.abs(r.r)*r.v),
    stub:Math.abs(r.r)<=1,tclass:TCLASS[r.tm]||r.tm||'—'};
    ['pl','pr','rs','fr','to','tm','vd','rt','oid'].forEach(k=>x[k]=sany(x[k]));return x});
  const om=new Map(o.map(x=>[x.id,x]));
  ops.forEach(r=>{
    const x=om.get(r.o);
    r.cl=x?x.cl:'';
    r.chan=x?x.chan:'';
    r.sprod=x?x.prod:'';
    r.d=x?x.d:(r.d||'');
  });
  
const cap = (src.capacity || []).map(c=>({
  ...c,
  pl: sany(c.pl),
  rs: sany(c.rs),
  rsName: sany(c.rsName || c.rs),
  grp: sany(c.grp || ''),
  altFor: sany(c.altFor || ''),
  isBottleneck: c.isBottleneck !== undefined ? c.isBottleneck : (c.util >= 0.90),
  isCrit: c.isCrit !== undefined ? c.isCrit : (c.util >= 0.999)
}));

  return {
    name: src.name||'Датасет',
    orders: o,
    ops,
    capacity: cap,
    hasCap: cap.length > 0,
    ts: new Date().toISOString()
  };
}
/* ═══════════════ 4.2. ДВИЖОК СКВОЗНОГО АНАЛИЗА МОЩНОСТЕЙ И RCA ═══════════════ */
const CapacityRCA = {
  getCap(rsId, plId, orderPeriod, orderDate){
    if(!rsId || !String(rsId).trim()) return null;
    if(!DS || !DS.hasCap || !DS.capacity || !DS.capacity.length) return null;
    const rLower = String(rsId||'').trim().toLowerCase();
    const pLower = String(plId||'').trim().toLowerCase();
    const targetDate = normalizePeriodKey(orderDate);

    // 1. Точное совпадение по периоду (YYYY-MM)
    if(targetDate){
      const match = DS.capacity.find(c => 
        c.rs.toLowerCase() === rLower &&
        (!plId || (c.pl && c.pl.toLowerCase() === pLower)) &&
        (c.periodKey === targetDate || c.isGlobal)
      );
      if(match) return match;
    }

    // 2. Совпадение по номеру периода
    if(orderPeriod !== undefined && orderPeriod !== null){
      const matchP = DS.capacity.find(c => 
        c.rs.toLowerCase() === rLower &&
        (!plId || (c.pl && c.pl.toLowerCase() === pLower)) &&
        (c.p === Number(orderPeriod) || c.isGlobal)
      );
      if(matchP) return matchP;
    }

    // 3. Глобальное ограничение или общее совпадение
    return DS.capacity.find(c => 
      c.rs.toLowerCase() === rLower &&
      (!plId || (c.pl && c.pl.toLowerCase() === pLower))
    ) || DS.capacity.find(c => c.rs.toLowerCase() === rLower) || null;
  },

  /**
   * Точный поиск лимита res_loc_loc с учетом глобальных ограничений (periodid=1 / isGlobal) и BOM-масок.
   * Сопоставляются только настоящие лимиты направлений: строки из res_loc_loc (cat='route')
   * либо записи с явно заданным направлением locFr → locTo. Складские мощности без масок
   * сюда не попадают — иначе любое движение «находило» случайную складскую строку,
   * и логистика всегда выглядела «В норме», даже когда лимиты не проверялись вовсе.
   */
  getLogLimit(rsId, locFr, locTo, prod, orderPeriod, orderDate){
    if(!DS || !DS.capacity.length) return null;
    const rLower = rsId ? String(rsId).trim().toLowerCase() : '';
    const frLower = locFr ? String(locFr).trim().toLowerCase() : '';
    const toLower = locTo ? String(locTo).trim().toLowerCase() : '';
    const prodLower = prod ? String(prod).trim().toLowerCase() : '';
    const targetDate = normalizePeriodKey(orderDate);

    return DS.capacity.find(c => {
      // Только лимиты направлений с явными масками (res_loc_loc / merged route rows)
      const isRouteLimit = (c.cat === 'route') || (c.locFr && c.locTo);
      if(!isRouteLimit) return false;

      const isLogCat = (c.cat === 'route' || c.cat === 'logistics' || c.cat === 'warehouse' || c.cat === 'loading' || c.cat === 'unloading');
      if(!isLogCat) return false;

      // Проверка периода с учетом глобальных ограничений
      const dateMatch = c.isGlobal || !targetDate || !c.periodKey || (c.periodKey === targetDate) || (orderPeriod !== undefined && c.p === Number(orderPeriod));
      if(!dateMatch) return false;

      if(rLower && c.rs.toLowerCase() === rLower) return true;

      const frMatch = !c.locFrList || c.locFrList.includes('all') || (frLower && c.locFrList.some(f => f.toLowerCase() === frLower));
      const toMatch = !c.locToList || c.locToList.includes('all') || (toLower && c.locToList.some(t => t.toLowerCase() === toLower));
      const prodMatch = !c.prodList || c.prodList.includes('all') || (prodLower && c.prodList.some(p => p.toLowerCase() === prodLower));

      return frMatch && toMatch && prodMatch;
    }) || null;
  },
  /**
   * Сквозной сбор продуктов BOM для заказа (включая полуфабрикаты из аналогичных заказов при полном дефиците)
   */
  getOrderBOMProducts(order){
    const ordOps = (DS.ops||[]).filter(op => op.o === order.id);
    const prods = new Set([order.prod]);
    ordOps.forEach(op => { if(op.pr) prods.add(op.pr); });

    // Если у заказа дефицит и мало операций, ищем типовую BOM-структуру для этого SKU в других заказах
    if(prods.size <= 1 && DS.ops){
      DS.ops.forEach(op => {
        if(op.sprod === order.prod || op.pr === order.prod){
          if(op.pr) prods.add(op.pr);
        }
      });
    }
    return prods;
  },

  /**
   * Раздельный анализ производственных и логистических узких мест заказа (включая блокировки и дефициты)
   */
  analyzeOrderChain(order){
    if(!DS) return {hasData:false, prodBottleneck:null, logBottleneck:null, isStarving:false, rootCause:'—'};

    const ordOps = (DS.ops||[]).filter(op => op.o === order.id);
    const prodOps = ordOps.filter(op => op.type === 'production');
    const logOps = ordOps.filter(op => op.type === 'movement' || op.type === 'stock');
    const bomProducts = this.getOrderBOMProducts(order);
    const targetDate = normalizePeriodKey(order.d);

    if(!DS.hasCap && !ordOps.length){
      return { hasData: Boolean(DS && DS.hasCap), prodBottleneck: null, logBottleneck: null, isStarving: false, rootCause:'—' };
    }

    // 1. Производственные мощности
    const prodChain = [];
    prodOps.forEach((op, idx) => {
      const rsId = op.rs || `RES_${op.pl}_${idx}`;
      const cap = this.getCap(rsId, op.pl, order.p, order.d);
      if(cap && cap.cat !== 'route' && cap.cat !== 'logistics' && cap.cat !== 'warehouse' && cap.cat !== 'loading' && cap.cat !== 'unloading'){
        prodChain.push({
          rs: cap.rs,
          rsName: cap.rsName,
          pl: cap.pl || op.pl,
          util: cap.util,
          free: cap.free,
          load: cap.load,
          avail: cap.avail,
          isBottleneck: cap.util >= 0.90
        });
      }
    });

    // Если у дефицитного заказа нет производственных операций в marking_demand, ищем мощности по BOM
    if(!prodChain.length && DS.capacity && order.unm > 0){
      DS.capacity.forEach(cap => {
        if(cap.cat === 'production' && (cap.isGlobal || !targetDate || cap.periodKey === targetDate || cap.p === order.p)){
          const relatesToBOM = [...bomProducts].some(p => (cap.rsName && cap.rsName.includes(p)) || (cap.rs && cap.rs.includes(p)));
          if(relatesToBOM || cap.util >= 0.90){
            prodChain.push({
              rs: cap.rs,
              rsName: cap.rsName,
              pl: cap.pl,
              util: cap.util,
              free: cap.free,
              load: cap.load,
              avail: cap.avail,
              isBottleneck: cap.util >= 0.90
            });
          }
        }
      });
    }

    prodChain.sort((a,b) => b.util - a.util);
    const prodBottleneck = prodChain.length && prodChain[0].util >= 0.90 ? prodChain[0] : null;

    // 2. Логистические мощности и маршруты (из операций)
    const logChain = [];
    logOps.forEach((op) => {
      const cap = this.getLogLimit(op.rs, op.fr, op.to, op.pr || order.prod, order.p, order.d) ||
                  (op.rs ? this.getCap(op.rs, null, order.p, order.d) : null) ||
                  (DS.capacity||[]).find(c => 
                    (c.cat === 'route' || c.cat === 'loading' || c.cat === 'unloading') &&
                    ((op.rs && c.rs.toLowerCase() === op.rs.toLowerCase()) ||
                     (op.fr && op.to && c.locFr && c.locTo && c.locFr.toLowerCase() === op.fr.toLowerCase() && c.locTo.toLowerCase() === op.to.toLowerCase()))
                  );

      if(cap && !logChain.some(item => item.rs === cap.rs)){
        const isBlocked = (cap.avail === 0 || cap.isBlocked);
        const util = isBlocked ? 1.0 : cap.util;
        logChain.push({
          rs: cap.rs,
          rsName: cap.rsName || (cap.locFr && cap.locTo ? `${cap.locFr} → ${cap.locTo}` : cap.rs),
          resType: cap.resType || (cap.cat === 'route' ? 'Лимит направления' : 'Логистика'),
          cat: cap.cat,
          pl: cap.pl || (cap.locFr ? `${cap.locFr} → ${cap.locTo}` : op.fr || op.to),
          locFr: cap.locFr || op.fr,
          locTo: cap.locTo || op.to,
          prodTarget: cap.prodTarget || cap.prodRaw || op.pr || order.prod,
          util,
          free: isBlocked ? 0 : cap.free,
          load: cap.load,
          avail: cap.avail,
          isBlocked,
          isBottleneck: isBlocked || util >= 0.90
        });
      }
    });

    // 3. Анализ заблокированных направлений и ограничений res_loc_loc (включая global periodid=1 и BOM)
    if(DS.capacity && order.unm > 0){
      const orderLocations = new Set([order.loc, ...ordOps.flatMap(o => [o.pl, o.fr, o.to]).filter(Boolean)]);

      const relevantLimits = DS.capacity.filter(c => {
        const isLogCat = (c.cat === 'route' || c.cat === 'logistics' || c.cat === 'warehouse' || c.cat === 'loading' || c.cat === 'unloading');
        if(!isLogCat) return false;
        
        // Дата: совпадение по периоду или глобальный лимит
        const dateMatch = c.isGlobal || !targetDate || !c.periodKey || (c.periodKey === targetDate) || (order.p !== undefined && c.p === Number(order.p));
        if(!dateMatch) return false;

        // Продукт: проверка по всей спецификации BOM
        const prodMatch = !c.prodList || c.prodList.includes('all') || c.prodList.some(p => bomProducts.has(p));
        
        // Локация
        const locMatch = !c.locToList || c.locToList.includes('all') || c.locToList.some(l => orderLocations.has(l)) ||
                         (c.locFrList && c.locFrList.some(l => orderLocations.has(l))) ||
                         (c.pl && orderLocations.has(c.pl));

        return prodMatch && locMatch && (c.avail === 0 || c.isBlocked || c.util >= 0.90);
      });

      relevantLimits.forEach(cap => {
        if(!logChain.some(item => item.rs === cap.rs)){
          const isBlocked = (cap.avail === 0 || cap.isBlocked);
          logChain.push({
            rs: cap.rs,
            rsName: cap.rsName || `${cap.locFr || 'Сеть'} → ${cap.locTo || order.loc}`,
            resType: cap.resType || (isBlocked ? 'Блокировка направления (res_loc_loc)' : 'Лимит направления'),
            cat: cap.cat,
            pl: cap.locFr ? `${cap.locFr} → ${cap.locTo}` : (cap.pl || order.loc),
            locFr: cap.locFr,
            locTo: cap.locTo,
            prodTarget: cap.prodTarget || cap.prodRaw || order.prod,
            util: isBlocked ? 1.0 : cap.util,
            free: isBlocked ? 0 : cap.free,
            load: cap.load,
            avail: cap.avail,
            isBlocked,
            isBottleneck: true
          });
        }
      });
    }

    logChain.sort((a,b) => (b.isBlocked ? 2 : b.util) - (a.isBlocked ? 2 : a.util));
    const logBottleneck = logChain.length && (logChain[0].isBottleneck || logChain[0].isBlocked) ? logChain[0] : null;

    // Определение интегральной причины дефицита (RCA)
    let rootCause = 'В норме';
    if(order.unm > 0){
      if(logBottleneck && logBottleneck.isBlocked){
        rootCause = `Блокировка логистики: ${logBottleneck.rsName}`;
      } else if(prodBottleneck && prodBottleneck.util >= 0.99){
        rootCause = `Перегруз производства (100%): ${prodBottleneck.rsName}`;
      } else if(logBottleneck && logBottleneck.util >= 0.95){
        rootCause = `Лимит логистики: ${logBottleneck.rsName}`;
      } else if(prodBottleneck){
        rootCause = `Узкое место цеха: ${prodBottleneck.rsName}`;
      } else {
        rootCause = 'Сырьевой / мультифакторный дефицит';
      }
    }

    return {
      hasData: true,
      prodBottleneck,
      logBottleneck,
      prodChain,
      logChain,
      rootCause,
      isStarving: Boolean(prodBottleneck && prodChain.some(r => r !== prodBottleneck && r.util < 0.45))
    };
  },

  drillDownToOrder(orderId, rsKey, mode='prod_res'){
    SELECTED_ORDER_ID = Number(orderId);
    TREE_VIEW_MODE = mode;
    TREE_FOCUSED_KEY = rsKey || null;
    go('tree');
  }
};

function fOrders(excludeKey=null){
  return DS.orders.filter(o=>{
    if(excludeKey!=='p' && F.p.length && !F.p.includes(String(o.p))) return false;
    if(excludeKey!=='ch' && F.ch.length && !F.ch.includes(o.chan)) return false;
    if(excludeKey!=='cl' && F.cl.length && !F.cl.includes(o.cl)) return false;
    if(excludeKey!=='pr' && F.pr.length && !F.pr.includes(o.prod)) return false;
    if(excludeKey!=='pi' && F.pi.length && !F.pi.includes(String(o.pr))) return false;
    if((excludeKey!=='pl' && F.pl.length) || (excludeKey!=='vd' && F.vd.length) ||
       (excludeKey!=='tm' && F.tm.length) || (excludeKey!=='nd' && F.nd.length)){
      const relOps = DS.ops.filter(r=>r.o===o.id);
      if(excludeKey!=='pl' && F.pl.length &&
         !relOps.some(r=>F.pl.includes(r.pl)||F.pl.includes(r.fr)||F.pl.includes(r.to))) return false;
      if(excludeKey!=='vd' && F.vd.length && !relOps.some(r=>F.vd.includes(r.vd))) return false;
      if(excludeKey!=='tm' && F.tm.length && !relOps.some(r=>F.tm.includes(r.tm))) return false;
      if(excludeKey!=='nd' && F.nd.length &&
         !relOps.some(r=>F.nd.includes(r.fr)||F.nd.includes(r.to)||F.nd.includes(r.pl))) return false;
    }
    return true;
  });
}
function fOps(excludeKey=null){
  const ords = fOrders(excludeKey);
  const ids = new Set(ords.map(o=>o.id));
  return DS.ops.filter(r=>{
    if(!ids.has(r.o)) return false;
    if(excludeKey!=='pl' && F.pl.length &&
       !(F.pl.includes(r.pl)||(r.type==='movement'&&(F.pl.includes(r.fr)||F.pl.includes(r.to))))) return false;
    if(excludeKey!=='vd' && F.vd.length && !F.vd.includes(r.vd)) return false;
    if(excludeKey!=='tm' && F.tm.length && !F.tm.includes(r.tm)) return false;
    if(excludeKey!=='nd' && F.nd.length &&
       !(F.nd.includes(r.fr)||F.nd.includes(r.to)||F.nd.includes(r.pl))) return false;
    return true;
  });
}

function cv(id,h){
  const c=$(id);if(!c)return null;
  const r=Math.max(1,Math.min(devicePixelRatio||1,3));
  const w=Math.max(c.clientWidth||(c.parentElement?c.parentElement.clientWidth-36:0)||600,260);
  c.width=Math.round(w*r);c.height=Math.round(h*r);

  const x=c.getContext('2d');x.setTransform(r,0,0,r,0,0);x.clearRect(0,0,w,h);
  x.font='12px '+FNT;c._h=[];c._lab=[];

}
/* Высота графика; в полноэкранном режиме — по свободной высоте карточки */
function H(id,base,ratio=0.52,min=180,max=430){
  const c=$(id);if(!c)return base;
  const full=c.closest('.card.full');
  if(full){
    const top=c.getBoundingClientRect().top-full.getBoundingClientRect().top+full.scrollTop;
    return Math.max(320,Math.floor(full.clientHeight-top-36));
  }
  const w=c.clientWidth||(c.parentElement?c.parentElement.clientWidth-36:0)||600;
  return Math.round(Math.max(min,Math.min(max,Math.max(base,w*ratio))));
}
function reg(c,x,y,w,h,html,cb){c._h.push({x,y,w,h,html,cb})}
function bind(c){
  c.onmousemove=e=>{const b=c.getBoundingClientRect(),mx=e.clientX-b.left,my=e.clientY-b.top;
    const hit=(c._h||[]).find(r=>mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h);

      TIP.style.left=L+'px';TIP.style.top=T+'px';c.style.cursor=hit.cb?'pointer':'default'}
    else{TIP.style.display='none';c.style.cursor='default'}};
  c.onmouseleave=()=>TIP.style.display='none';
  c.onclick=e=>{const b=c.getBoundingClientRect(),mx=e.clientX-b.left,my=e.clientY-b.top;
    const hit=(c._h||[]).find(r=>mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h);if(hit&&hit.cb)hit.cb()};
}
function yAxis(x,w,h,p,max,fmt,n=5){x.strokeStyle=CH.grid;x.lineWidth=1;x.fillStyle=CH.axis;
  x.font='11px '+FNT;x.textAlign='right';x.textBaseline='middle';
  for(let i=0;i<=n;i++){const y=h-p.b-(h-p.t-p.b)*i/n;x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();
    x.fillText(fmt(max*i/n),p.l-7,y)}}

/* Решает, нужен ли поворот подписей X, и возвращает нужный нижний отступ */
function fitX(x,labs,w,p,force){
  x.font='11px '+FNT;
  const bw=(w-p.l-p.r)/Math.max(labs.length,1);
  const maxW=Math.max(0,...labs.map(l=>x.measureText(String(l)).width));
  if(!force&&maxW<=bw-8)return {rot:0,b:32};
  return {rot:1,b:Math.min(100,Math.round(Math.min(maxW,120)*0.72+18))};
}
/* Подписи X: без нагромождений — поворот 45°, прореживание, обрезка по доступному месту */
function xAxis(x,w,h,p,labs,rot){
  const bw=(w-p.l-p.r)/Math.max(labs.length,1);
  x.font='11px '+FNT;x.fillStyle=CH.lab;
  if(rot){
    const step=Math.max(1,Math.ceil(14/bw)),maxLen=Math.max(5,Math.floor((p.b-16)/4.6));
    x.textAlign='right';x.textBaseline='middle';
    labs.forEach((l,i)=>{if(i%step)return;let s=String(l);if(s.length>maxLen)s=s.slice(0,maxLen-1)+'…';
      x.save();x.translate(p.l+bw*(i+.5),h-p.b+9);x.rotate(-Math.PI/4);x.fillText(s,0,0);x.restore()});
  }else{
    const maxW=Math.max(0,...labs.map(l=>x.measureText(String(l)).width));
    const step=Math.max(1,Math.ceil((maxW+10)/bw));
    x.textAlign='center';x.textBaseline='top';
    labs.forEach((l,i)=>{if(i%step)return;x.fillText(String(l),p.l+bw*(i+.5),h-p.b+7)});
  }
}
/* Подпись значения с контролем пересечений: возвращает false, если места нет */
function barLab(c,x,txt,cx,cy){
  x.font='600 10.5px '+FNT;const tw=x.measureText(txt).width;
  const r={x:cx-tw/2,y:cy-13,w:tw,h:13};
  if((c._lab||[]).some(o=>r.x<o.x+o.w+4&&r.x+r.w+4>o.x&&r.y<o.y+o.h+2&&r.y+r.h+2>o.y))return false;
  c._lab.push(r);
  x.fillStyle=CH.lab;x.textAlign='center';x.textBaseline='bottom';x.fillText(txt,cx,cy);return true;
}
function chBars(id,h,labs,ser,fmt,tips,cb,rot,showLab){
  REDRAW[id]=()=>chBars(id,h,labs,ser,fmt,tips,cb,rot,showLab);
  const g=cv(id,h);if(!g)return;const{c,x,w}=g;
  const hs=hiddenOf(id),vis=ser.filter((s,i)=>!hs.has(i));
  const p={l:64,r:16,t:showLab?26:14,b:32};const fx=fitX(x,labs,w,p,rot);p.b=fx.b;

    reg(c,p.l+bw*i,p.t,bw,ph,tips(i),cb?()=>cb(i):null)});

/* Стек + линия (правая ось 0–100%). Индексы легенды: 0..st.length-1 — столбцы, st.length — линия */
function chStackLine(id,h,labs,st,ln,fmtL,tips,cb,rot){
  REDRAW[id]=()=>chStackLine(id,h,labs,st,ln,fmtL,tips,cb,rot);
  const g=cv(id,h);if(!g)return;const{c,x,w}=g;
  const hs=hiddenOf(id),lnHid=hs.has(st.length);
  const p={l:64,r:lnHid?18:52,t:26,b:32};const fx=fitX(x,labs,w,p,rot);p.b=fx.b;
  const ph=h-p.t-p.b;
  const tot=labs.map((_,i)=>S(st.filter((s,si)=>!hs.has(si)),s=>s.v[i])),max=Math.max(...tot,1)*1.2;
  yAxis(x,w,h,p,max,fmtL);xAxis(x,w,h,p,labs,fx.rot);
  const bw=(w-p.l-p.r)/labs.length,iw=Math.min(bw*.55,90);
  const tops=[],topCol=[];
  labs.forEach((_,i)=>{let b=0,col=CH.d1;st.forEach((s,si)=>{if(hs.has(si)||!(s.v[i]>0))return;
      const hh=ph*s.v[i]/max;x.fillStyle=s.c;x.fillRect(p.l+bw*i+(bw-iw)/2,h-p.b-b-hh,iw,hh);b+=hh;col=s.c});
    tops.push(h-p.b-b);topCol.push(col);
    reg(c,p.l+bw*i,p.t,bw,ph,tips(i),cb?()=>cb(i):null)});
  const lx=i=>p.l+bw*(i+.5),ly=v=>h-p.b-ph*Math.min(Math.max(v||0,0),1);
  const lineAt=px=>{const f0=(px-p.l)/bw-.5,i0=Math.max(0,Math.min(labs.length-1,Math.floor(f0))),
    i1=Math.min(labs.length-1,i0+1),f=Math.min(1,Math.max(0,f0-i0));return ly(ln.v[i0]*(1-f)+ln.v[i1]*f)};
  if(!lnHid){

    x.strokeStyle=ln.c;x.lineWidth=2;x.beginPath();

    x.fillStyle=CH.axis;x.font='11px '+FNT;x.textAlign='left';x.textBaseline='middle';

/* Бизнес-водопад: items=[{k,v,type:'total'|'delta',c}] — total задаёт уровень, delta сдвигает */
function chWaterfall(id,h,items,fmt,tips,cb){

  const p={l:70,r:20,t:30,b:32};const fx=fitX(x,items.map(i=>i.k),w,p,0);p.b=fx.b;
  let lvl=0;const bars=items.map(it=>{
    if(it.type==='total'){lvl=it.v;return {...it,y0:0,y1:it.v,after:it.v}}
    const y0=lvl;lvl+=it.v;return {...it,y0:Math.min(y0,lvl),y1:Math.max(y0,lvl),after:lvl}});
  const max=Math.max(...bars.map(b=>b.y1),1)*1.15,ph=h-p.t-p.b;

  RAIL:'🚂 Ж/Д',
  TRUCK:'🚚 Авто',

  LASTMILE:'🎯 Доставка клиенту',

function chFlow(id,h,legsList,fmt,cb){
  const g=cv(id,h);if(!g)return;const{c,x,w}=g;
  if(!legsList.length){
    x.fillStyle=CH.axis;x.textAlign='center';x.font='13px '+FNT;
    x.fillText('Нет данных по перемещениям под выбранными условиями',w/2,h/2);bind(c);return;
  }

  const isInterplantOnly = (LG_FLOW_LAYER==='interplant') || legsList.every(l=>l.fr.startsWith('Plant_')&&l.to.startsWith('Plant_'));
  const activeSelectedNode = F.nd && F.nd.length ? F.nd[0] : null;

  // Множество площадок, отгружающих наружу
  const finalPlantSet = new Set();
  legsList.forEach(l=>{
    if(l.fr.startsWith('Plant_') && (l.to.startsWith('Sale_')||l.to.startsWith('Dispatch_')||l.to.startsWith('Port_'))){
      finalPlantSet.add(l.fr);
    }
  });

  // Карта клиентов для локаций спроса Sale_*
  const saleCustMap=new Map();
  if(DS&&DS.orders){
    DS.orders.forEach(o=>{
      if(o.loc&&o.cl){
        if(!saleCustMap.has(o.loc))saleCustMap.set(o.loc,new Set());
        saleCustMap.get(o.loc).add(o.cl);
      }
    });
  }

  // Сбор уникальных узлов
  const nodeSet=new Set();
  legsList.forEach(l=>{nodeSet.add(l.fr);nodeSet.add(l.to)});
  const nodeArr=[...nodeSet];

  // Топологическое ранжирование DAG для межзаводских цепочек (чтобы разнести заводы по шагам потока)
  const interplantRanks=new Map();
  if(isInterplantOnly){
    nodeArr.forEach(n=>interplantRanks.set(n,0));
    // Вычисление максимального пути от истоков
    let changed=true;
    for(let iter=0;iter<6&&changed;iter++){
      changed=false;
      legsList.forEach(l=>{
        const rSrc=interplantRanks.get(l.fr)||0;
        const rDst=interplantRanks.get(l.to)||0;
        if(rDst<=rSrc){
          interplantRanks.set(l.to,Math.min(3,rSrc+1));
          changed=true;
        }
      });
    }
    // Если все заводы скопились в конце, распределяем истоки
    const inDegrees=new Map();
    legsList.forEach(l=>inDegrees.set(l.to,(inDegrees.get(l.to)||0)+1));
    nodeArr.forEach(n=>{
      if(!inDegrees.has(n)) interplantRanks.set(n,0);
    });
  }

  // Определение роли и колонки узла
  const getNodeMeta=name=>{
    const s=String(name||'');
    if(s.startsWith('Sale_')||s.startsWith('Cust_')||s.includes('Клиент'))
      return {st:5,cat:'sale',title:'Локация спроса',icon:'🎯',col:CH.ok};
    if(s.startsWith('Dispatch_')||s.startsWith('WH_')||s.startsWith('Склад'))
      return {st:4,cat:'dispatch',title:'Точка отгрузки',icon:'📍',col:CH.warn};
    if(s.startsWith('Port_')||s.startsWith('Hub_')||s.startsWith('Порт'))
      return {st:3,cat:'port',title:'Порт / Хаб',icon:'⚓',col:CH.d6};
    if(s.startsWith('Plant_')||s.startsWith('Завод')){
      if(isInterplantOnly){
        const rnk=Math.min(3,interplantRanks.get(name)||0);
        if(rnk===0) return {st:0,cat:'donor',title:'Первичный завод (Донор)',icon:'⛏️',col:CH.d4};
        if(rnk===1) return {st:1,cat:'semi',title:'Первичный передел',icon:'⚙️',col:CH.d2};
        if(rnk===2) return {st:2,cat:'proc',title:'Финишный прокат',icon:'🏭',col:CH.d1};
        return {st:3,cat:'finish',title:'Сборка и выпуск',icon:'📦',col:CH.d3};
      }
      if(finalPlantSet.has(name)){
        return {st:2,cat:'plant_fin',title:'Производство ГП',icon:'🏭',col:CH.d1};
      }
      return {st:1,cat:'plant_semi',title:'Производство полуфабрикатов',icon:'⚙️',col:CH.d2};
    }
    if(s.startsWith('Vendor_')||s.startsWith('Поставщик'))
      return {st:0,cat:'vendor',title:'Поставщик сырья',icon:'📦',col:CH.d4};
    return {st:3,cat:'other',title:'Узел сети',icon:'🏢',col:CH.ctrl};
  };

  const allNodes=nodeArr.map(name=>{
    const meta=getNodeMeta(name);
    const vOut=S(legsList.filter(l=>l.fr===name),l=>l.v);
    const vIn=S(legsList.filter(l=>l.to===name),l=>l.v);
    const vol=Math.max(vOut,vIn,1);
    let extra='';
    if(meta.cat==='sale'&&saleCustMap.has(name)){
      const clArr=[...saleCustMap.get(name)];
      extra=clArr.slice(0,2).join(', ')+(clArr.length>2?` +${clArr.length-2}`:'');
    }
    return {id:name,name,stage:meta.st,cat:meta.cat,title:meta.title,icon:meta.icon,color:meta.col,vol,extra};
  });

  const STAGE_TITLES=isInterplantOnly?[
    '1. Первичные заводы (Доноры)',
    '2. Первичный передел',
    '3. Финишный прокат',
    '4. Сборка и выпуск'
  ]:[
    '1. Поставщики сырья',
    '2. Полуфабрикаты',
    '3. Готовая продукция',
    '4. Хабы и порты',
    '5. Точки отгрузки',
    '6. Локации спроса'
  ];

  const maxStageCount = isInterplantOnly ? 4 : 6;
  const presentStages=Array.from({length:maxStageCount},(_,i)=>i).filter(st=>allNodes.some(n=>n.stage===st));
  const p={l:16,r:16,t:44,b:24};
  const numCols=Math.max(presentStages.length,1);
  const colW=(w-p.l-p.r)/numCols;
  const cardW=Math.min(colW*0.84,210),cardH=38;
  const availH=h-p.t-p.b;

  // Отрисовка колонок стадий
  x.font='600 11px '+FNT;x.textAlign='center';
  presentStages.forEach((stIdx,cIdx)=>{
    const cx=p.l+cIdx*colW+colW/2;
    const stageColors=isInterplantOnly?[CH.d4,CH.d2,CH.d1,CH.d3]:[CH.d4,CH.d2,CH.d1,CH.d6,CH.warn,CH.ok];
    x.fillStyle=stageColors[stIdx]||CH.txt;
    x.fillText(STAGE_TITLES[stIdx]||`Этап ${stIdx+1}`,cx,p.t-20);
    x.strokeStyle=CH.grid;x.lineWidth=1;x.setLineDash([3,3]);
    x.beginPath();x.moveTo(cx,p.t-8);x.lineTo(cx,h-p.b);x.stroke();x.setLineDash([]);
  });

  // Расчет позиций карточек
  const nodeMap=new Map();
  presentStages.forEach((stIdx,cIdx)=>{
    const colNodes=allNodes.filter(n=>n.stage===stIdx).sort((a,b)=>b.vol-a.vol);
    const stepY=availH/Math.max(colNodes.length,1);
    colNodes.forEach((n,rIdx)=>{
      const curH=Math.min(cardH,Math.max(28,stepY-6));
      n.x=p.l+cIdx*colW+(colW-cardW)/2;
      n.y=p.t+rIdx*stepY+(stepY-curH)/2;
      n.w=cardW;n.h=curH;
      nodeMap.set(n.id,n);
    });
  });

  // Множество связанных с выбранным узлом
  const isConnectedLeg = l => !activeSelectedNode || l.fr===activeSelectedNode || l.to===activeSelectedNode;
  const isConnectedNode = n => !activeSelectedNode || n.id===activeSelectedNode || legsList.some(l=>(l.fr===activeSelectedNode&&l.to===n.id)||(l.to===activeSelectedNode&&l.fr===n.id));

  // Отрисовка лент потоков (Sankey Bezier)
  const maxLegVol=Math.max(...legsList.map(l=>l.v),1);
  legsList.slice().sort((a,b)=>a.v-b.v).forEach(l=>{
    const src=nodeMap.get(l.fr),dst=nodeMap.get(l.to);
    if(!src||!dst)return;

    const isHl = activeSelectedNode ? (l.fr===activeSelectedNode || l.to===activeSelectedNode) : false;
    const isDim = activeSelectedNode ? !isHl : false;

    let sx=src.x+src.w,sy=src.y+src.h/2;
    let ex=dst.x,ey=dst.y+dst.h/2;

    const isSameCol=(src.stage===dst.stage);
    if(isSameCol){
      sx=src.x+src.w;ex=dst.x+src.w;
    }

    const flowThick=Math.max(2.5,Math.min(22,(l.v/maxLegVol)*18));
    const dx=isSameCol?34:Math.max(22,Math.abs(ex-sx)*0.45);

    const grad=x.createLinearGradient(sx,sy,ex,ey);
    const alphaSrc = isHl ? 0.75 : (isDim ? 0.08 : 0.42);
    const alphaDst = isHl ? 0.75 : (isDim ? 0.08 : 0.42);
    grad.addColorStop(0,rgba(isHl?CH.brand:src.color,alphaSrc));
    grad.addColorStop(1,rgba(isHl?CH.brand:dst.color,alphaDst));

    x.beginPath();
    if(isSameCol){
      x.moveTo(sx,sy);
      x.bezierCurveTo(sx+dx,sy,ex+dx,ey,ex,ey);
      x.strokeStyle=isHl?CH.brand:rgba(src.color,isDim?0.10:0.55);
      x.lineWidth=isHl?Math.max(flowThick,4):flowThick;
      x.stroke();
    }else{
      x.moveTo(sx,sy-flowThick/2);
      x.bezierCurveTo(sx+dx,sy-flowThick/2,ex-dx,ey-flowThick/2,ex,ey-flowThick/2);
      x.lineTo(ex,ey+flowThick/2);
      x.bezierCurveTo(ex-dx,ey+flowThick/2,sx+dx,sy+flowThick/2,sx,sy+flowThick/2);
      x.closePath();
      x.fillStyle=grad;x.fill();

      x.strokeStyle=isHl?CH.brand:rgba(src.color,isDim?0.10:0.65);
      x.lineWidth=isHl?1.8:1;
      x.beginPath();x.moveTo(sx,sy);x.bezierCurveTo(sx+dx,sy,ex-dx,ey,ex,ey);x.stroke();
    }

    // Иконка вида транспорта по центру
    const mx=isSameCol?sx+dx/2:(sx+ex)/2,my=(sy+ey)/2;
    const icoStr=TM_ICONS[l.tm]||l.tm||'Транспорт';
    const shortIco=icoStr.split(' ')[0]||'🚚';
    const tagW=20,tagH=16;
    drawBox(x,mx-tagW/2,my-tagH/2,tagW,tagH,3);
    x.fillStyle=isDim?CH.pane:CH.surf;x.fill();
    x.strokeStyle=isHl?CH.brand:(isDim?CH.dim:CH.line);
    x.lineWidth=isHl?1.5:1;x.stroke();
    x.fillStyle=isDim?CH.dimTxt:CH.txt;x.font='9.5px '+FNT;
    x.textAlign='center';x.textBaseline='middle';
    x.fillText(shortIco,mx,my+1);

    // Список перемещаемых продуктов
    const prodsTxt = l.prods && l.prods.length ? l.prods.join(', ') : '—';

    reg(c,mx-18,my-12,36,24,
      `<b>${l.fr} → ${l.to}</b><br>`
      +`Вид транспорта: <b>${icoStr}</b><br>`
      +`Перемещаемый продукт: <b>${prodsTxt}</b><br>`
      +`Объём потока: <b>${fmt(l.v)}</b><br>`
      +(l.c?`Затраты: <b>${bn(l.c)}</b><br>`:'')
      +(l.rate>1?`Тариф: <b>${nf(l.rate)} ₽/т</b>`:'Тариф: условие поставки/внутрисети'),
      null);
  });

  // Отрисовка карточек узлов
  allNodes.forEach(n=>{
    if(!n.w)return;
    const isSelected = (activeSelectedNode===n.id);
    const isConnected = isConnectedNode(n);
    const isDim = activeSelectedNode && !isConnected;

    // Свечение для выбранного узла (Neon Glow Halo)
    if(isSelected){
      x.save();
      x.shadowColor=rgba(CH.brand,0.7);
      x.shadowBlur=14;
      x.shadowOffsetX=0;
      x.shadowOffsetY=0;
      x.fillStyle=CH.brandBg||'#f1e0ff';
      drawBox(x,n.x-2,n.y-2,n.w+4,n.h+4,6);
      x.fill();
      x.restore();
    }

    x.fillStyle=isSelected?(CH.brandBg||'#f1e0ff'):(isDim?CH.pane:CH.surf);
    drawBox(x,n.x,n.y,n.w,n.h,4);x.fill();

    // Рамка карточки
    if(isSelected){
      x.strokeStyle=CH.brand;
      x.lineWidth=2.4;
    }else if(isConnected&&activeSelectedNode){
      x.strokeStyle=CH.accent;
      x.lineWidth=1.5;
    }else{
      x.strokeStyle=isDim?CH.dim:CH.line;
      x.lineWidth=1;
    }
    x.stroke();

    // Маркер роли слева
    x.fillStyle=isDim?CH.dim:(isSelected?CH.brand:n.color);
    x.fillRect(n.x,n.y+3,isSelected?4.5:3.5,n.h-6);

    // Заголовок карточки
    x.fillStyle=isDim?CH.dimTxt:(isSelected?CH.brand:CH.txt);
    x.font=(isSelected?'700 ':'600 ')+'10.5px '+FNT;
    x.textAlign='left';x.textBaseline='top';
    const maxChars=Math.max(8,Math.floor((n.w-26)/6.8));
    const title=n.name.length>maxChars?n.name.slice(0,maxChars-1)+'…':n.name;
    x.fillText(`${n.icon} ${title}${isSelected?' ✓':''}`,n.x+8,n.y+4);

    // Вторая строка
    x.fillStyle=isDim?CH.dimTxt:(isSelected?CH.brand:(n.extra?CH.ok:CH.sub));
    x.font=(isSelected?'600 ':'')+'9.5px '+FNT;
    const subTxt=n.extra?`${fmt(n.vol)} · ${n.extra}`:fmt(n.vol);
    const subCrop=subTxt.length>maxChars+4?subTxt.slice(0,maxChars+3)+'…':subTxt;
    x.fillText(subCrop,n.x+8,n.y+19);

    reg(c,n.x,n.y,n.w,n.h,
      `<b>${n.title}: ${n.name}</b>${isSelected?' <span style="color:var(--scp-accent);font-weight:700">[ВЫБРАН]</span>':''}<br>`
      +(n.extra?`Клиент: <b>${n.extra}</b><br>`:'')
      +`Сквозной объём: <b>${fmt(n.vol)}</b><br>`
      +`<span style="color:var(--scp-accent)">${isSelected?'Клик: снять выделение узла':'Клик: сфокусировать граф и цепочку на узле'}</span>`,
      cb?()=>cb(n.id):null);
  });

  bind(c);
}

function chDumbbell(id,h,items,fmt,cb){const g=cv(id,h);if(!g)return;const{c,x,w}=g;
  const p={l:126,r:100,t:10,b:10},max=Math.max(...items.flatMap(i=>[i.a,i.b]),1)*1.1,row=(h-p.t-p.b)/Math.max(items.length,1);
  items.forEach((it,i)=>{const y=p.t+row*(i+.5),X=v=>p.l+(w-p.l-p.r)*v/max;
    x.strokeStyle=CH.line;x.lineWidth=2.5;x.beginPath();
    x.moveTo(X(Math.min(it.a,it.b)),y);x.lineTo(X(Math.max(it.a,it.b)),y);x.stroke();
    x.fillStyle=CH.d1;x.beginPath();x.arc(X(it.a),y,5,0,7);x.fill();
    x.fillStyle=it.b>it.a?CH.err:CH.ok;x.beginPath();x.arc(X(it.b),y,5,0,7);x.fill();
    x.fillStyle=CH.lab;x.font='11.5px '+FNT;x.textAlign='right';x.textBaseline='middle';
    x.fillText(String(it.k).slice(0,17),p.l-8,y);
    x.fillStyle=CH.txt;x.font='600 11.5px '+FNT;x.textAlign='left';x.fillText(fmt(it.b),w-p.r+7,y);
    reg(c,0,y-row/2,w,row,it.tip,cb?()=>cb(it):null)});
  bind(c)}

function summary(title,blocks){
  return `<div class="sum"><h4>${title}</h4>`+blocks.map(b=>
    `<div class="sec">${b.t}</div><ul>${b.i.map(s=>`<li>${s}</li>`).join('')}</ul>`).join('')+`</div>`}

    {t:'Рекомендации',i:[
